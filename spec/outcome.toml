subject = "Match outcome"
summary = '''How a side comes to win or lose, how that spreads to the other sides, when the match is over, and what the players are told. Objectives are in [objectives](objectives.toml); the event lines' wording, icons and sounds are in [messages](messages.toml) and [game events](game-events.toml).'''
games = '''traced in both.'''

[[topic]]
title = "Outcomes"

[[topic.rule]]
id = "side-outcome"
tags = ["code"]
text = '''Every side has an outcome: still playing, won or lost. It starts as still playing and is decided once: after that nothing changes it, not a trigger, not a later win by someone else, not losing everything. A side that lost can't come back and a side that won can't lose.'''

[[topic.rule]]
id = "match-state"
tags = ["code"]
text = '''The match itself is not started, running or over. It becomes over at the moments given under Spreading, and never goes back to running.'''

[[topic.rule]]
id = "what-decides-outcome"
tags = ["code"]
text = '''Four things decide a side's outcome: the default defeat rule, the city rule, resigning, and the map's triggers. All four go through the same steps (Deciding a side's outcome, then Spreading), so they differ only in what sets them off and in the events named with each.'''

[[topic.rule]]
id = "teamvictory"
tags = ["code", "data"]
text = '''Teams matter only through the `TeamVictory` game variable (stock `true`; it isn't a lobby rule). Diplomacy doesn't come into any of this: allies that aren't on one team are opponents here, and enemies on one team win together. "Team-mates" below means sides on the same team; a side with no team has none.'''

[[topic.rule]]
id = "team-of-several"
tags = ["code"]
text = '''A team "of several" below means a team with two or more member sides, counting members that have already lost.'''

[[topic.rule]]
id = "independent-sides"
tags = ["code", "game", "data"]
text = '''Independent sides (the map's `independent` flag: on the stock maps, the sides that hold the neutral cities and farms, such as Berlin's "Civilian (Neutral)" and "Civilian (Aggressive)") take no part in any of this except through triggers. The default defeat rule never defeats them and the city rule never makes them win; no other side's win or loss gives them an outcome; they're left out when deciding whether the match is over; and an outcome a trigger gives them doesn't spread. So on a map without such triggers they stay still playing for the whole match. Kohan II's independent sides are the same.'''

[[topic.rule]]
id = "unheld-sides"
tags = ["code", "game", "data"]
text = '''A side that nobody holds when the match is launched, neither a player nor an AI, isn't in the match at all and counts for nothing here. That covers the lobby's Closed slots and Open slots left empty alike: the two are treated the same at launch. The exception is a side the map marks `required`, which stays and is given an AI if nobody holds it (on the stock skirmish maps only the independent sides are required, and they get no AI). Seen when a map is started with only the host's side: the other player sides are gone from the start.'''

[[topic]]
title = "The default defeat rule"

[[topic.rule]]
id = "default-defeat"
tags = ["code"]
text = '''A side is defeated when it has nothing that keeps it alive. With `TeamVictory` on and the side on a team, its team-mates' things keep it alive too: no member falls while any member still has such a thing, and when the last one goes every member still playing is defeated in the same instant, in side order.'''

[[topic.rule]]
id = "what-keeps-side-alive"
tags = ["code"]
text = '''
What keeps a side alive is each living thing it owns that is one of:
- a regiment (a thing whose template has an `OrganizationComponent`), of any kind and wherever it is, aboard a transport included;
- a thing whose template has a `RecruitComponent`;
- a thing with a `MobileDeploymentComponent` whose other form has either of those: for a truck, the building named by its `unpack_to`.
'''

[[topic.rule]]
id = "stock-keep-alive-things"
tags = ["data"]
text = '''In the stock data that makes: every regiment; the Corps HQ, the four Division HQs and the Airfield, and the trucks that unpack into them; battleships and carriers. Not keeping a side alive: Depots, Bunkers, Brigades, the Motor Pool and their trucks, cities and other captured buildings, and loose units that aren't in a regiment.'''

[[topic.rule]]
id = "kohan-ii-keep-alive-things"
tags = ["code", "data"]
text = '''
Kohan II has the same rule; only its data differs. There, what keeps a side alive is:
- every settlement: the `Settlement` template that all settlements are built on carries a `RecruitComponent`. It's the settlement that counts, not its centre building (see [settlements](settlements.toml) for the two and how long a settlement lasts);
- every company on the map (each has an `OrganizationComponent`), denizens that have come out of a building as a company included, for as long as they're out. Denizens inside a building aren't things and don't count. Not keeping a side alive: centres on their own, the settlement's other structures, walls, outposts, forts, lairs, camps and the start location. So a Kohan II side is out once it has no settlement and no company left: one whose last settlement is captured or destroyed stays in the match for as long as any of its companies lives, and is defeated on the first test after the last one dies.
'''

[[topic.rule]]
id = "thing-stops-counting"
tags = ["code"]
text = '''A thing stops counting the moment it dies (not when its wreck is cleared), is removed, or changes side; captured or given things count for their new side from then on.'''

[[topic.rule]]
id = "thing-starts-counting"
tags = ["code"]
text = '''A thing that's being built or is still unpacking starts counting when it's finished. One with a `MobileDeploymentComponent` counts from the moment the side has it, so an HQ counts through unpacking and packing with no gap: truck, unpacking building and building all count.'''

[[topic.rule]]
id = "resources-dont-count"
tags = ["code"]
text = '''Stockpiles, income, technologies and cities held make no difference. A side with money and Depots but no HQ, HQ truck or regiment is out.'''

[[topic.rule]]
id = "defeat-test-timing"
tags = ["code"]
text = '''The rule is tested for every side on every simulation tick, from game time 1.0 s on. Before that nothing is tested, which is what lets sides be given their starting things. There's no delay and no countdown: the first test that finds the side with nothing defeats it.'''

[[topic.rule]]
id = "default-defeat-condition"
tags = ["code", "data"]
text = '''It's tested only while the match is running and the side is still playing, and only for a side whose default defeat condition is on. The condition is a flag each side carries in the map, on unless the map says otherwise; the `kingdom_enable_default_victory_condition` trigger effect sets it.'''

[[topic.rule]]
id = "independent-never-defeated"
tags = ["code", "game", "data"]
text = '''It never applies to independent sides, whatever their default defeat condition says and whatever they hold. On the stock skirmish maps they hold only cities and farms, which keep nothing alive, yet they're never defeated and no "%s has been defeated" appears for them: on Berlin both civilian sides are still playing, with nothing that keeps them alive, well after the first test.'''

[[topic.rule]]
id = "defeat-test-order"
tags = ["code"]
text = '''Sides are tested one after another, in side order, and each defeat spreads before the next side is tested. So if the last two opponents lose their last things on the same tick, the earlier one in side order is defeated and the later one, now alone, wins.'''

[[topic]]
title = "The city rule"

[[topic.rule]]
id = "cityvictoryratio"
tags = ["code"]
text = '''`CityVictoryRatio` (see [objectives](objectives.toml) for the lobby rule and the line it shows) is tested on the same ticks as the default rule, from 1.0 s on, for every side that's still playing and isn't independent, when the rule is above 0 and the map has at least one city.'''

[[topic.rule]]
id = "city-count"
tags = ["code"]
text = '''The side's count is the cities it holds, plus those of every other member of its team (members that have lost included; `TeamVictory` isn't consulted for the count). It wins when count / the map's cities × 100 is at least the rule's value. The cities need not be held for any time: the first tick the share is reached wins.'''

[[topic.rule]]
id = "city-victory-steps"
tags = ["code"]
text = '''Then, in order: `city_ratio_victory` is posted once, with the team's name (the side's if it has no team) and the count; each member of the team (or the side alone) is marked as having won by cities, which is what ticks the objectives line, and has its outcome decided as won, the first member's win spreading as below.'''

[[topic.rule]]
id = "city-victory-teamvictory-off"
tags = ["code"]
text = '''So with `TeamVictory` off, the member tested first wins and its team-mates lose with everyone else.'''

[[topic]]
title = "Resigning"

[[topic.rule]]
id = "resign"
tags = ["code"]
text = '''A player resigns from the game menu ("Resign"). It's refused for a player who has no side any more.'''

[[topic.rule]]
id = "resign-alone"
tags = ["code"]
text = '''A side that isn't on a team of several, or any side when `TeamVictory` is off, resigns at once: `kingdom_resigned` is posted with the side's name, the side is marked resigned and its outcome is decided as lost (which posts no `kingdom_defeated`, since it resigned), spreading as below. The player is then left with no side, as an observer.'''

[[topic.rule]]
id = "team-resign-vote"
tags = ["code", "guess"]
text = '''
With `TeamVictory` on, a side on a team of several can't resign alone: the request is a vote for the whole team to resign.
- While any other player on the team hasn't voted, nothing happens to any side; the vote is announced ("%s voted for %s to resign", see [messages](messages.toml)). Votes stand for the rest of the match. AI-run sides and players who no longer have a side don't have to vote.
- On the last vote `team_resigned` is posted with the team's name, and then every side on the team that a player holds resigns as above, but without `kingdom_resigned`.
'''

[[topic.rule]]
id = "resigned-things-disband"
tags = ["code"]
text = '''Resigning differs from any other defeat in one way: the side's things go. From then on each of its regiments and loose units disbands itself as soon as Disband is available to it, and each of its buildings razes itself if it can, or else sells itself, checked once a second (see Disbanding and selling in [buildings](buildings.toml)). Things that can do neither stay.'''

[[topic]]
title = "Triggers"

[[topic.rule]]
id = "kingdom-mission-won-lost"
tags = ["code"]
text = '''`kingdom_mission_won` (side) decides the side's outcome as won, and `kingdom_mission_lost` (side) as lost, each spreading as below. On a side whose outcome is already decided they do nothing. They work on any map, in any mode. They're the only way an independent side gets an outcome: `kingdom_mission_lost` on one posts `kingdom_defeated` with its name (it has no team, so it stands alone) while the match is running, and `kingdom_mission_won` posts `kingdom_victory`; either way nothing spreads.'''

[[topic.rule]]
id = "enable-default-victory"
tags = ["code"]
text = '''`kingdom_enable_default_victory_condition` (side, yes/no) turns the default defeat rule on or off for that side alone. Off, the side stays in the match with nothing left until a trigger or another side's win decides it.'''

[[topic.rule]]
id = "kingdom-default-lose"
tags = ["code", "data"]
text = '''The condition `kingdom_default_lose` (side) is the default rule's test and nothing else: true while the side has nothing that keeps it alive (and, with `TeamVictory` on, neither has any team-mate). It ignores the 1.0 s start, the side's flag and its outcome. The campaigns use it on several sides. `kingdom_has_no_settlements` only tests that the side holds no settlement, so in AA it's always true; no shipped map uses it.'''

[[topic.rule]]
id = "campaign-maps-same-rules"
tags = ["data"]
text = '''Campaign maps are under the same rules as any other map: the default defeat rule and the city rule stay in force unless the map turns the first off. The shipped missions end by trigger: nearly all call `kingdom_mission_won` or `kingdom_mission_lost` on the player's side (`kingdom_0`), and many switch the default rule off for the enemy side, some for the player's, a few seconds in.'''

[[topic.rule]]
id = "no-other-outcome-triggers"
tags = ["data"]
text = '''There are no other trigger effects or conditions about winning, losing or a side's being alive; a map tests anything else (a thing destroyed, an objective settled) with its ordinary conditions.'''

[[topic.rule]]
id = "wwii-campaign-battles"
tags = ["code"]
text = '''A battle fought from the WWII campaign's map has the default defeat rule switched off for every side when it starts; what decides those battles isn't covered here.'''

[[topic]]
title = "Deciding a side's outcome"

[[topic.rule]]
id = "deciding-steps"
tags = ["code"]
text = '''
Whatever the cause, deciding a still-playing side's outcome does this, in order:

1. The outcome is set.
2. An event for the side itself, only if the side stands alone: `TeamVictory` is off, or it has no team, or its team has just the one member. Won: `kingdom_victory`. Lost: `kingdom_defeated`, unless the match is already over or the side resigned. Both carry the side's name. A side on a team of several gets no event of its own under `TeamVictory`; the team events below stand in.
3. If it's the side of the player at this machine, that player is shown the outcome (What the player sees).
4. It spreads to the other sides, unless the side is independent or the outcome came from spreading itself.
'''

[[topic]]
title = "Spreading"

[[topic.rule]]
id = "side-wins"
tags = ["code"]
text = '''**A side wins.** The match is over. If `TeamVictory` is on and the side is on a team of several, `team_victory` is posted with the team's name. Then every other side still playing has its outcome decided: won for its team-mates when `TeamVictory` is on, lost for everyone else except independent sides, which are left as they are. None of those posts an event (the losers because the match is already over, the team-mates because the team event covers them).'''

[[topic.rule]]
id = "side-loses"
tags = ["code"]
text = '''
**A side loses.** Look at every side that hasn't lost, leaving out independent sides:
- If two of them aren't on the same team (they're on different teams, or either has no team), the match goes on. In that case only, if `TeamVictory` is on, the loser is on a team of several, every member of that team has now lost, and the loser didn't resign, `team_defeated` is posted with the team's name.
- Otherwise the survivors win: they're one side, or all on one team. The first of them in side order has its outcome decided as won (posting `kingdom_victory` if it stands alone); then, if it's on a team, `team_victory` is posted with the team's name when `TeamVictory` is on and the team has several members, and every other member still playing has its outcome decided as won. Then the match is over.
- If no side is left that hasn't lost, the match is over with no winner.
'''

[[topic.rule]]
id = "one-team-left-wins"
tags = ["code"]
text = '''Note what follows from the second case: the survivors being on one team ends the match in their favour even with `TeamVictory` off (each then posts its own `kingdom_victory`), and a team's last defeat posts `team_defeated` only when the match carries on afterwards.'''

[[topic.rule]]
id = "what-winning-means"
tags = ["code"]
text = '''Winning is therefore not "every enemy is defeated" by diplomacy. It's "every side that hasn't lost is on my team", with a side on no team winning only when it's the last one. Any side whose default rule is off holds the match open; independent sides never do.'''

[[topic.rule]]
id = "decided-in-side-order"
tags = ["code"]
text = '''Several sides can be decided in one instant (a team falling together, a win deciding everyone else), but always one after another in side order, each seeing what the earlier ones left.'''

[[topic.rule]]
id = "no-winner"
tags = ["code"]
text = '''A match with no winner needs every side to lose without any ever being the last survivor, which the default rule can't produce (the last one standing wins before it's tested). Triggers can: `kingdom_mission_lost` on a side whose loss leaves only sides that have already lost.'''

[[topic]]
title = "Events"

[[topic.rule]]
id = "outcome-events"
tags = ["data"]
text = '''
All seven are `global`, so every player sees each one whoever it's about.

| Event | When | `%s`, `%d` |
|---|---|---|
| `kingdom_defeated` | a side standing alone loses while the match is running, other than by resigning | the side's name |
| `kingdom_resigned` | a side resigns on its own | the side's name |
| `kingdom_victory` | a side standing alone wins | the side's name |
| `team_defeated` | the last member of a team of several loses, the match goes on, and that member didn't resign | the team's name |
| `team_resigned` | a team's resignation vote completes | the team's name |
| `team_victory` | a side on a team of several wins, by any cause, with `TeamVictory` on | the team's name |
| `city_ratio_victory` | the city rule is met | the team's name, or the side's if it has no team; the cities counted |
'''

[[topic.rule]]
id = "event-order-city-rule"
tags = ["code"]
text = '''
Orders that follow from the steps above:
- City rule: `city_ratio_victory`, then `team_victory` (or `kingdom_victory` for a side standing alone).
'''

[[topic.rule]]
id = "event-order-last-opponent"
tags = []
text = '''Last opponent defeated: its `kingdom_defeated` if it stood alone, then the winner's `kingdom_victory` if that one stands alone, then `team_victory` if the winner is on a team of several.'''

[[topic.rule]]
id = "event-order-side-resigns"
tags = []
text = '''A side resigning on its own, as the last opponent: `kingdom_resigned`, then the victory events as above.'''

[[topic.rule]]
id = "event-order-team-resigns"
tags = []
text = '''A team resigning: `team_resigned`, then the victory events if that leaves one team or side. No `team_defeated`.'''

[[topic.rule]]
id = "event-order-trigger-win"
tags = []
text = '''A win by trigger: `kingdom_victory` or `team_victory` only. The sides that lose by it post nothing.'''

[[topic]]
title = "After a side has lost"

[[topic.rule]]
id = "lost-side-keeps-things"
tags = ["code"]
text = '''Nothing is taken from a side that loses without resigning: its things stay where they are and keep behaving as before (fighting, producing, holding cities, giving sight), its stockpiles stay, and its captured cities stay its own until someone takes them. Only a resigned side's things remove themselves.'''

[[topic.rule]]
id = "no-gifts-to-lost-side"
tags = ["code"]
text = '''It can no longer be given resources or things by another side: both are refused.'''

[[topic.rule]]
id = "no-human-opponents"
tags = ["code"]
text = '''It no longer counts as a human opponent: once no two human players who haven't lost are on different teams (or without teams), the game says "No human opponents remain." once.'''

[[topic]]
title = "When the match is over"

[[topic.rule]]
id = "match-over"
tags = ["code"]
text = '''The match is over when a side wins, or when a loss leaves the survivors all on one team, a single side, or nobody (Spreading). This is the same in single-player and multiplayer.'''

[[topic.rule]]
id = "play-after-over"
tags = ["code"]
text = '''The simulation doesn't stop. Everything keeps running, triggers included; what changes is that the default defeat rule is no longer tested, no `kingdom_defeated` is posted, and every outcome has by then been decided, so nothing further can be won or lost.'''

[[topic.rule]]
id = "end-mission"
tags = ["code", "data"]
text = '''The match ends for real only when the host (or the single player) leaves it. Once it's over the game menu's entry to leave reads "End Mission" for the host; before that it reads "Resign" for a player with a side, "Abort Mission" for a host whose only opponents left are AI, and "Leave Game" for an observer.'''

[[topic]]
title = "What the player sees"

[[topic.rule]]
id = "outcome-dialog"
tags = ["code", "data"]
text = '''
When the outcome of the player's own side is decided, a dialog opens at once (no delay, no banner beforehand), except as below:
- Won, as host or alone: "Mission Won", with End Mission and Keep Playing.
- Lost, as host or alone: "Mission Lost", with End Mission; in multiplayer also Observe. While the match is still running and other human players haven't lost, only Observe is offered.
- As a client: "Mission Won. Waiting for the host to end the game." with Keep Playing, or "Mission Lost. Waiting for the host to end the game." with Observe.
'''

[[topic.rule]]
id = "outcome-during-cutscene"
tags = ["code"]
text = '''Alone or as host, if a map's cutscene mode is on at that moment ([triggers](triggers.toml#scripted-scenes)), no dialog opens: the mission ends at once, as End Mission would.'''

[[topic.rule]]
id = "keep-playing"
tags = ["code", "data"]
text = '''Keep Playing closes the dialog and play carries on ("To exit select 'End Mission' from the menu."). End Mission leaves for the debriefing.'''

[[topic.rule]]
id = "wwii-campaign-battle-end"
tags = ["game"]
text = '''A battle fought from the WWII campaign's map ends the same way for the player: the dialog offers End Mission or Keep Playing, and after Keep Playing the player can go on fighting for as long as they like and leave whenever they choose with End Mission from the game menu (Esc).'''

[[topic.rule]]
id = "event-lines"
tags = ["data"]
text = '''The events above arrive as message-log lines with their sounds, as any event does.'''

[[topic.rule]]
id = "debriefing-result"
tags = ["code"]
text = '''The debriefing treats the player as having won only if their side's outcome is won; lost, or still playing when the host ended the match, is a defeat there. It shows one of two sets of widgets and plays `victory_music` or `defeat_music` accordingly (see [music](music.toml)), shows the mission's success or failure text on a campaign map, and lists the side's objectives (see [objectives](objectives.toml)).'''

[[topic]]
title = "Saved games"

[[topic.rule]]
id = "saved-outcomes"
tags = ["code", "data"]
text = '''A saved game keeps, for each side, its outcome, whether its default defeat condition is on, whether it resigned and whether it won by cities; and for the match, whether it's not started, running or over.'''

[[topic.rule]]
id = "keep-alive-recounted"
tags = ["guess"]
text = '''What keeps a side alive isn't stored; it's counted again from the side's things on loading.'''

