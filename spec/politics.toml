subject = "Politics panel"
summary = '''The list of a match's sides with how the viewing player stands to each: AA's politics panel (`PoliticsDisplay` in `UI/Game/politics_display.tgi`) and Kohan II's politics page of its side panel (`SidePanelPolitics`).'''
games = '''traced in AA, whose program also holds the Kohan II page's code. Kohan II's own program wasn't checked.'''

[[topic]]
title = "Opening and closing"

[[topic.rule]]
id = "closed-at-start"
tags = ["code", "data"]
text = '''It's closed at the start of every match, like AA's other windows ([interface](interface.toml#at-rest)). It opens only when the player asks: the control panel's politics button (`ButtonPolitics`, which runs `PoliticsDisplayToggle`), or F4, which presses that button (`hotkeys_custom.txt`). A second press closes it, and Backspace closes it too (`CloseSideOrDisplayPanel`). Screenshots that show it open are from matches where the player had opened it.'''

[[topic.rule]]
id = "no-pause"
tags = ["code"]
text = '''Unlike the objectives, technology and message log windows, it doesn't pause a single-player game, and it doesn't close or hide them either. It's a panel that stays up during play, sharing the screen with whatever else is open.'''

[[topic.rule]]
id = "no-sound"
tags = ["code", "data"]
text = '''It opens and closes without a sound of its own: its layout gives it none. The button sounds as a toggle button does ([sounds](sounds.toml)).'''

[[topic.rule]]
id = "politics-button-toggle"
tags = ["code", "guess"]
text = '''The button is a toggle button: each press flips it between lit and unlit, and the panel opens or closes with it. Nothing ties the two together otherwise, so closing the panel with Backspace leaves the button lit, and the next press unlights it and opens the panel.'''

[[topic.rule]]
id = "closed-at-match-end"
tags = ["code"]
text = '''It's closed whenever a match ends.'''

[[topic]]
title = "Rows"

[[topic.rule]]
id = "one-row-per-side"
tags = ["code"]
text = '''One row per side that a player holds in the match, person or computer. The map's independent sides get no row, and nor do slots that nobody took at launch. A player watching without a side gets no row of their own.'''

[[topic.rule]]
id = "row-order"
tags = ["code"]
text = '''Rows come in side order (the map's `kingdom_0`, `kingdom_1` and so on), the same for every player: the viewer's own row isn't moved to the top.'''

[[topic.rule]]
id = "defeated-side-grey"
tags = ["code", "data"]
text = '''A side knocked out of the match keeps its row, with its name written in grey (`UIColorDefeatedKingdom` in `UVars.tgi`, 0.5, 0.5, 0.5); its gem keeps its side's colour. A side that has won is written as usual.'''

[[topic.rule]]
id = "row-contents"
tags = ["code", "game", "data"]
text = '''A row reads: the gem in the side's colour, a space, the side's name in the row's own text colour, then the relation marker. That's the gem and name a message line gives a side ([messages](messages.toml#names-in-lines)), and the name follows the same rules ([players](players.toml#side-names)): the player's name for a side a player took ("Player", a nickname), "Kesselring AI" for a computer player, a " (1)" for a repeated name from the session's numbering, and in a campaign mission the map's own side names ("Kesselring's Force").'''

[[topic.rule]]
id = "relation-marker"
tags = ["code", "game", "data"]
text = '''The relation marker is how the viewing player stands to that row's side ([players](players.toml#relations)): `glyph_ally` (`ch_ally`, a blue circle), `glyph_neutral` (`ch_neutral`) or `glyph_enemy` (`ch_enemy`, a red square). They're special glyphs from `Fonts/special_glyphs_AA.tgi` drawn in the row's text, so their pictures are the glyphs' own, not tinted. The viewer's own row has no marker.'''

[[topic.rule]]
id = "viewing-player"
tags = ["code"]
text = '''"The viewing player" is the side the player is playing or, while observing, the side being viewed. With neither (watching without a side), no row has a marker or a tooltip.'''

[[topic.rule]]
id = "neutral-only-if-set"
tags = ["code", "guess"]
text = '''A side is neutral to another only where the match sets it so, as the map's relations or the teams do; anything unset is an enemy ([players](players.toml#relations)).'''

[[topic]]
title = "Keeping up to date"

[[topic.rule]]
id = "live-updates"
tags = ["code"]
text = '''While it's open, the panel checks every frame and follows any change at once: a relation changing, a side being knocked out (turning grey), a side being renamed (a computer player taking over a leaver's side becomes "Bob AI", [multiplayer](multiplayer.toml)). A row appears or goes as sides join or leave the list, and the panel's height follows the number of rows.'''

[[topic.rule]]
id = "leaving-player-keeps-row"
tags = ["code", "guess"]
text = '''A player who leaves a multiplayer match doesn't lose their side's row: the side stays in the match under its new name.'''

[[topic]]
title = "Layout"

[[topic.rule]]
id = "layout-units"
tags = ["code", "data"]
text = '''All in layout units ([interface](interface.toml#layout-units-and-placement)).'''

[[topic.rule]]
id = "panel-size"
tags = []
text = '''The panel runs from x 800 to the screen's right edge, from the top of the screen down. Its height is `offset_top` + `offset_bottom` + the rows' heights + `separation` between each two rows: with AA's 20, 20, 3 and 15-tall rows, two sides make it 20 + 15 + 3 + 15 + 20 = 73 tall. It grows downward as rows are added; the top stays put.'''

[[topic.rule]]
id = "row-placement"
tags = []
text = '''Row n (from 0) starts `offset_top` + n × (row height + `separation`) below the panel's top. Each row is the `Label` in the layout: from 23 in from the panel's left, 188 wide and 15 tall, in the tiny font, left justified.'''

[[topic.rule]]
id = "marker-column"
tags = []
text = '''The relation marker sits `offset_relation` (161) across from the start of the row's text, whatever the name's length, so the markers line up in a column.'''

[[topic.rule]]
id = "panel-background"
tags = []
text = '''Behind the rows is the panel's background, sized to the whole panel: a tooltip-style frame (the tooltip box's corner, edge and centre textures, `SharedTooltipChildPanelVE`) over a black fill whose opacity is `transparency` (0 in AA, so no fill shows), clamped to 0..1.'''

[[topic]]
title = "Tooltips and clicks"

[[topic.rule]]
id = "row-tooltip"
tags = ["code", "data"]
text = '''
Each row has its own tooltip, built for the viewer and that row's side. The layout's `politics_display_Label_tooltip` ("set by code") is never shown.
- The title: the side as the row shows it, gem then name.
- If the side is in a team, a "Team" line with the team's name (`ui_tooltip_politics_team`).
- A "Relation" line (`ui_tooltip_politics_relation`): "Self", "Ally", "Neutral" or "Enemy" (`ui_tooltip_politics_relation_self` and so on).
- A blank line, then a description: "Your Side." for the viewer's own row (`ui_tooltip_politics_display_self`), and for the others `ui_tooltip_politics_display_ally_generic` ("Supply and visibility are shared with allied sides. ..."), `ui_tooltip_politics_display_neutral_generic` or `ui_tooltip_politics_display_enemy_generic`.
'''

[[topic.rule]]
id = "row-click"
tags = ["code"]
text = '''Clicking a row does nothing in AA.'''

[[topic]]
title = "Kohan II's politics page"

[[topic.rule]]
id = "k2-same-rows"
tags = ["code", "data", "guess"]
text = '''It lists the same sides in the same order, each row written the same way (gem, name, then the relation marker at `offset_relation`, 150 in its layout), and keeps up to date the same way; so one model of rows fits both games. Its markers are `ch_shield`, `ch_sword` and `ch_eye` (ally, enemy, neutral). The row tooltips are presumably the same too.'''

[[topic.rule]]
id = "k2-list-box"
tags = ["code", "data", "guess"]
text = '''What differs: its rows are items of a list box (`ListBoxKingdoms`, up to 16 visible, several selectable at once) on a side panel page rather than a panel of its own, and it adds a Send Tribute button (`ButtonSendTribute`). It's enabled only while the page has a viewing player and something it needs is set.'''

[[topic.rule]]
id = "k2-select-ally"
tags = ["code"]
text = '''Selecting a row of an allied side opens the command grid's team commands for that side, as choosing it on the ally page does ([team commands](team-commands.toml)).'''

[[topic.rule]]
id = "k2-send-tribute"
tags = ["code", "guess"]
text = '''Send Tribute opens the same number box as Give Resources, with no text, capped by the player's own money, and on OK gives that amount of money to each selected side that is an ally, as Give Resources does.'''

