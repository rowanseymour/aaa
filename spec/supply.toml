text = '''Attaching and detaching post "<HQ>: attaching <regiment>" and "<HQ>: detaching <regiment>".'''

[[topic.rule]]
id = "attached-state"
tags = ["data"]
text = '''An attached regiment has the state "Attached to HQ" (priority 2, so it rarely shows as the panel's state).'''

[[topic.rule]]
id = "cycle-detached"
tags = ["code", "data"]
text = '''
Cycle Detached Regiments (F5, or the floating button on the left, which does the same thing):
- it steps through all of your own regiments that have no HQ, whether or not any HQ could take them, skipping ones that can't be selected. Only regiments count: a lone truck (a depot's or the Corps HQ's), a building and a unit inside a regiment are never in it, and a Division HQ regiment, packed or unpacked, isn't either, being an HQ itself. So besides fighting regiments it takes in regiments no HQ recruits, such as the special operations' secret agents and saboteurs;
- the order is fixed, the order of your side's list of things, starting after the regiment that's selected now and wrapping round. Only Tab's cycle has a reverse key in the shipped hotkeys;
- each step replaces the selection with that one regiment and moves the camera to it. If the only candidate is already selected, nothing happens.
- The floating button shows only while you have at least one regiment with no HQ whose type some HQ of yours recruits (free slots and distance don't matter). It's re-checked about once a second, so it can lag a change by up to a second.
'''

[[topic.rule]]
id = "cycle-order-oldest-first"
tags = ["guess"]
text = '''Your side's list of things, which Cycle Detached Regiments follows, is oldest first.'''

[[topic.rule]]
id = "command-all"
tags = ["code"]
text = '''
Command All (button 4 on the command grid, hotkey A, "Select all attached regiments"):
- the button shows when the selection is yours and its first thing is an HQ with attachment slots, packed or unpacked alike;
- it needs exactly one thing selected. It clears the selection, so the HQ is deselected, then selects every regiment attached to that HQ; with none attached the selection ends up empty.
- Given with one attached regiment selected instead, it selects all the regiments of that regiment's HQ.
'''

