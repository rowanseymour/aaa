subject = "Match start"
summary = '''What happens to the map's things between loading a map and the first tick of play: placeholders and random things become real things, each side gets its start location, money and camera, which world rules apply, and what each game's sides have once play begins. Money is in [economy](economy.toml#starting-money); what keeps a side in the match afterwards is in [outcome](outcome.toml).'''
games = '''traced in both.'''

[[topic]]
title = "Order of events"

[[topic.rule]]
id = "start-order"
tags = ["code"]
text = '''When a new match starts (single-player or multiplayer, a map or a random map), in this order: each side is given its starting money and its starting properties (faction, handicap); then the map's placeholders and random things are replaced; then the fog setting is applied; then each player's camera is placed; then AA's Time of Day is applied ([lighting](lighting.toml#time-of-day)); then the match is running. All of it happens before game time 1.0 s, so before the default defeat rule is first tested.'''

[[topic.rule]]
id = "saved-games-not-redone"
tags = ["code", "guess"]
text = '''Loading a saved game doesn't do this again: the saved things are already the replacements.'''

[[topic.rule]]
id = "editor-keeps-placeholders"
tags = ["code", "guess"]
text = '''The map editor loads a map without starting a match, so in the editor placeholders and random things stay as placed, and the map is saved with them.'''

[[topic]]
title = "What the player sees as play begins"

[[topic.rule]]
id = "loading-screen"
tags = ["code", "data"]
text = '''From launch until play begins the loading screen fills the window: its splash art, the map's name and description and a status line. The map isn't drawn behind it or anywhere else. Game time stands still at 0 throughout ([multiplayer](multiplayer.toml#loading)): everything in Order of events above is done, but no tick has played and no trigger has been tested.'''

[[topic.rule]]
id = "continue-button"
tags = ["code"]
text = '''In single-player, play begins only when the player presses Continue, however long ago loading finished. Until then nothing plays: the first tick comes after the press, never before.'''

[[topic.rule]]
id = "waiting-on-other-players"
tags = ["code"]
text = '''In multiplayer there is no Continue. Each machine shows "Waiting on Other Players" once it has finished, still with no map in sight, and play begins on every machine at the same step once all have finished.'''

[[topic.rule]]
id = "first-tick"
tags = ["code"]
text = '''When play begins the loading screen goes and the match's first tick plays almost at once (within a fraction of a 1/16 s step), running the first test of the triggers ([triggers](triggers.toml#when-triggers-are-tested)).'''

[[topic.rule]]
id = "map-first-seen"
tags = ["game", "data"]
text = '''The player never sees the map as it stood before that tick. After Continue the screen stays black for about a second, and when the map first appears the start-up triggers have already taken effect: `(2v2)Berlin`, whose only trigger turns the sun to `sun_night` at once, appears already at night, with no frame of its own daylight.'''

[[topic.rule]]
id = "black-second"
tags = []
text = '''What keeps the screen black for that second hasn't been traced, nor whether multiplayer shows the same black second (see Open questions).'''

[[topic]]
title = "Placeholders"

[[topic.rule]]
id = "placeholder-things"
tags = ["code", "data"]
text = '''A placeholder is a thing whose definition has category `PLACEHOLDER` (in the data, `[Thing Template=Placeholder]`, e.g. `placeholder_settlementvillage`, or AA's `placeholder_corpsunpacked`). It stands for "this side's version of X", so one map serves every nation. Both games use them: AA's skirmish maps place each side's Corps HQ as `placeholder_corpsunpacked`, Kohan II's place each side's first settlement as `placeholder_settlementvillage`.'''

[[topic.rule]]
id = "placeholder-replacement"
tags = ["code", "data"]
text = '''At match start every placeholder owned by a side that isn't independent is replaced by the thing its owner's nation names for it: the `[Placeholder]` entry in the nation's definition whose `placeholder_IDS` is that placeholder, giving `thing_IDS` (Kohan II's `human` nation: `placeholder_settlementvillage` becomes `human_center_village`).'''

[[topic.rule]]
id = "unowned-placeholders-kept"
tags = ["code"]
text = '''Placeholders that are unowned or owned by an independent side are left as they are: they stay on the map as the placeholder thing.'''

[[topic.rule]]
id = "missing-nation-entry"
tags = ["code", "data"]
text = '''A nation with no entry for the placeholder, or whose entry is `null`, leaves it as it is too (an error in the log, not a load error at that point).'''

[[topic.rule]]
id = "replacement-keeps"
tags = ["code", "guess"]
text = '''
The replacement keeps:
- the placeholder's owner;
- its position and facing;
- its thing id, so triggers and objectives naming the placeholder's id find the replacement;
- properties given to the placeholder itself (in the map); properties it has from anywhere else are dropped, with a note in the log. Nothing else carries over: not the placeholder's name, health or state. The replacement is made as the editor would place it: complete, not under construction, with its own name from its name list.
'''

[[topic.rule]]
id = "replacement-blocked"
tags = ["code"]
text = '''The placeholder is removed first, then its replacement created in its place. If the replacement can't be created there (blocked, or a rule below refuses it), the side gets nothing in its place and an error line is posted to the message log.'''

[[topic.rule]]
id = "replacement-requirements"
tags = ["code", "data"]
text = '''A replacement that is a settlement centre brings its settlement with it (see [settlements](settlements.toml)). A replacement that needs a `required_object_ids` thing beneath it (Kohan II's centres need a `marker_settlement`) gets one created for it first, at the same spot.'''

[[topic.rule]]
id = "placeholder-load-checks"
tags = ["code"]
text = '''
When data loads, every placeholder is checked against every nation:
- a nation without an entry for some placeholder is a load error while `DataCheckingStrict` is on (it is in both games' SVars);
- each replacement's blocking shape must contain the placeholder's (a load error otherwise), and some of the placeholder's flags are made to match its replacement's, with an error in the log where they differed.
'''

[[topic]]
title = "Random things"

[[topic.rule]]
id = "random-thing-replaced"
tags = ["code", "data"]
text = '''A thing with category `RANDOM_OBJECT` or `RANDOM_ACTOR` (e.g. `random_settlement_camps`, the random lairs) is replaced at match start by one thing drawn from its list, whoever owns it, independent sides and unowned things included.'''

[[topic.rule]]
id = "random-thing-list"
tags = ["code", "data"]
text = '''A random thing's list is made of the definitions that name it in a `[RandomActor]` block (`random_actor_ids`, with a `weight`): `bandit_settlementcamp` and three other camps each name `random_settlement_camps`. The draw is weighted by `weight` and uses the match's random seed, so every machine draws the same.'''

[[topic.rule]]
id = "random-replacement-keeps"
tags = ["code"]
text = '''The replacement keeps the same things a placeholder's does (owner, position, facing, thing id, properties given to it).'''

[[topic.rule]]
id = "empty-list-error"
tags = ["code"]
text = '''An empty list is a load error.'''

[[topic]]
title = "Start locations"

[[topic.rule]]
id = "start-loc"
tags = ["code", "data"]
text = '''`start_loc` (category `START_LOC`) marks where a side starts. It's invisible and can't be targeted. A side has at most one: giving a side a second removes the first.'''

[[topic.rule]]
id = "missing-start-location"
tags = ["code", "data"]
text = '''When a map is prepared for play, a side with no start location gets one, placed at its settlement if it has one, otherwise at whichever of its things has the highest `starting_location_priority` (AA's `placeholder_corpsunpacked` has 1000), otherwise at the map's centre.'''

[[topic.rule]]
id = "starting-camera"
tags = ["code"]
text = '''At match start each player's camera looks at their own side's start location; an observer's looks at the centre of the map. A side with no start location leaves the camera where it was.'''

[[topic.rule]]
id = "start-location-provides"
tags = ["data"]
text = '''What a start location provides is up to its data: AA's gives the side's building limit (`building_limit_provided = 20`, see [economy](economy.toml)); Kohan II's has no production and only marks the spot.'''

[[topic]]
title = "What each side has at the start"

[[topic.rule]]
id = "no-starting-forces"
tags = ["code"]
text = '''Nothing puts regiments, companies or heroes on the map for a side when the match starts. A side begins with exactly what the map gives it once placeholders and random things are replaced, plus its starting money. Kohan II's sides also start with heroes in their hero pool, which aren't on the map: see [companies](companies.toml#heroes).'''

[[topic.rule]]
id = "kohan2-battleground"
tags = ["code", "data"]
text = '''Kohan II's `(1v1)Battleground` gives each side a `start_loc` and a `placeholder_settlementvillage`. So each side starts with its nation's village centre, the settlement that comes with it, and the centre's denizens inside it (workers and militia, see [settlements](settlements.toml)), and no companies on the map.'''

[[topic.rule]]
id = "independent-sides-start"
tags = ["code", "data"]
text = '''Its independent sides start with what their random lairs and camps become. None of those keeps a side alive, so (as in AA) they're defeated at the first test, and their lairs and camps carry on regardless (see [outcome](outcome.toml)).'''

[[topic.rule]]
id = "starting-money"
tags = ["code", "data"]
text = '''Starting money works the same way in both games: each stockpiled resource starts at `ResourceStockpileDefault` (the Money world rule as chosen for the match, see [World rules](#world-rules); its default is 500 in both games, at most 9999 in Kohan II's world rules) unless the map stores the side's own stockpile. In Kohan II that's `gold`; its upkeep resources (`stone`, `wood`, `iron`, `mana`) aren't stockpiled.'''

[[topic]]
title = "World rules"

[[topic.rule]]
id = "world-rules-set"
tags = ["code", "data"]
text = '''A match is played with one set of world rules: those in `Game/world_rules*.tgi`, among them AA's City Control %, Difficulty, Fog of War, Money, Starting Experience and Time of Day. Every map stores a full set of its own, each rule with its value and whether the map fixes it.'''

[[topic.rule]]
id = "rules-replace-map"
tags = ["code"]
text = '''When a match starts, the rules chosen for it replace the map's stored set entirely. The map's stored values matter only as the Scenario Map dialog's starting point (below). In multiplayer the host's choice goes to every player.'''

[[topic.rule]]
id = "shipped-scenario-rules"
tags = ["data"]
text = '''AA's shipped scenarios all store City Control % 0, Difficulty Normal, Fog of War Explored, Starting Experience 0, Time of Day Default and Money 500, except `(2v2)Moscow`, which stores Money 1000. None fixes a rule.'''

[[topic]]
title = "The Scenario Map dialog (AA)"
under = "World rules"

[[topic.rule]]
id = "scenario-map-rules"
tags = ["code", "data"]
text = '''Picking a map in the list fills the dialog's rules with the values that map stores. This happens every time a map is picked, including picking another and then coming back, and replaces whatever was shown or set before. So Moscow shows Money 1000 and every other shipped scenario 500; Starting Experience shows 0 for all of them, not the rule's default of 200.'''

[[topic.rule]]
id = "fixed-rules-hidden"
tags = ["code"]
text = '''A rule the map fixes isn't offered.'''

[[topic.rule]]
id = "scenario-rules-changed"
tags = ["code"]
text = '''The rules shown can be changed. Load takes them as shown, and the match is played with them: Moscow left alone starts every side that uses the default stockpile at 1000; with Money changed to 800 they start at 800 ([economy](economy.toml#starting-money)).'''

[[topic.rule]]
id = "description-pane-rules"
tags = ["code", "game"]
text = '''The map's description pane lists the stored rules whose values differ from the rules' defaults, such as "Starting Experience 0" (and Money 1000 for Moscow). It shows the map's stored values, not the edited ones.'''

[[topic]]
title = "The Random Map dialog (AA)"
under = "World rules"

[[topic.rule]]
id = "random-map-rules"
tags = ["code", "data"]
text = '''Choosing a type (Alaska, France and so on) fills the dialog's rules from that random map setup. A setup starts from every rule's default and then applies its own `[Rules]` list (`Templates/template_rmc_aa.tgi` for every shipped type). That list only sets Difficulty to Normal (`MEDIUM`) with `show_ui = false`, which also fixes it, so Difficulty isn't offered. The others start at their defaults: City Control % 0, Fog of War Explored, Money 500, Starting Experience 200, Time of Day Default.'''

[[topic.rule]]
id = "random-map-type-change"
tags = ["code", "data"]
text = '''Choosing another type fills the rules again from its setup, so any changes are lost. All shipped types have the same rules, so that amounts to going back to the defaults.'''

[[topic.rule]]
id = "random-map-rules-used"
tags = ["code"]
text = '''As with a scenario, the match is played with the rules as shown when the dialog is confirmed.'''

[[open]]
q = '''The Scenario Map dialog screenshot (`menu-scenario-map.jpg`, Fall of Berlin picked) shows Fog of War None and Starting Experience 200, not the Explored and 0 that Berlin stores, while its description pane shows "Starting Experience 0". The Random Map screenshot also shows Fog of War None. Either the player had changed those two rules before the screenshots were taken, or the dialogs keep a choice that wasn't found. Worth checking in the game: open Scenario Map, pick Moscow, then another map, then Moscow again, and see what Money, Fog of War and Starting Experience show each time.'''
by = "analysis"
asked = 2026-11-20

