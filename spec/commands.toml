subject = "Commands"
summary = '''How the player gives orders: the command grid and its recruit menus, the hotkeys its tooltips show, and orders aimed at a thing or a place on the map.'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "Command grid"
intro = '''The 4×3 grid of command buttons, slots numbered row by row from 0 at the top left to 11 at the bottom right.'''

[[topic.rule]]
id = "command-buttons"
tags = ["code", "data"]
text = '''Each command the selection can carry out right now, and that has an `icon`, gets a button. It goes in its `preferred_position` slot (`Game/actor_commands.tgi`, `actor_commands_aa.tgi`). A position outside 0–11 (`structure_cancel_queued` has -1) means the command never shows a button.'''

[[topic.rule]]
id = "button-placement"
tags = ["code", "data"]
text = '''
Buttons are placed in two rounds, going through the commands that show in the game's own order of commands (below):
- first, from the end of the order to its start, each command takes its `preferred_position` slot unless one later in the order has already taken it;
- then the commands that lost their slot are placed, from the start of the order to its end, each in the first slot still free: counting up from slot 0 for an ordinary command, counting down from slot 11 for one with `high_importance`. If none is free it has no button. So every command that can have its preferred slot gets it before any loser is placed: a loser only fills a slot no shown command prefers, never pushes another on, and of two that want one slot, the one later in the order keeps it.
- Worked example (made up to show the rule, though Attach to HQ and Detach from HQ do show together, below): Move (0), Attack (`kill`, 1), Run (`retreat`, 2), Stop (3), Guard (6), Attach to HQ (10), Detach from HQ (11) and Disband (11, `high_importance`). In the first round Disband loses slot 11 to Detach from HQ, which comes later; everyone else gets their own. In the second, Disband counts down from 11: 11 and 10 are taken, so it takes 9.

  | Row | | | | |
  |---|---|---|---|---|
  | 0–3 | Move | Attack | Run | Stop |
  | 4–7 | — | — | Guard | — |
  | 8–11 | — | Disband | Attach to HQ | Detach from HQ |
'''

[[topic.rule]]
id = "command-order"
tags = ["code", "data"]
text = '''
The game's order of commands is fixed by the game, not by the data files: the order they're listed in (`Game/actor_commands.tgi`, `actor_commands_aa.tgi`, `Game/ActorCommands/*.tgi`) plays no part. It is: `kill`, `bombard`, `guard`, `repair`, `construct`, `move`, `stop`, `retreat`, `rout`, `explore`, `disband`, `unpack`, `pack_organization`, `build_structure`, `commission`, `recruit`, `set_rally_point`, `recruit_location`, `structure_cancel_queued`, `construction_cancel`, `sell`, `upgrade`, `raze`, `sally_forth`, `recall`, `air_attack`, `air_recon`, `escort_on`, `escort_off`, `attach`, `detach`, `hq_attach`, `hq_detach`, `set_formation`, `pack`, `research`, `cancel_flare`, `group_behavior_enable`, `group_behavior_disable`.
- Examples: `research` keeps slot 6 against `guard`; `hq_attach` keeps slot 10 against `detach` (Kohan II) and `rout`; of the slot 9 commands, `pack` beats `attach`, `escort_off`, `escort_on`, `unpack` and `bombard`, in that order.
- Slot 11: Detach from HQ (`hq_detach`, ordinary) comes after Disband (`disband`, `high_importance`), so were both to show, Detach from HQ would keep slot 11 and Disband would take the highest free slot below it. `cancel_flare` likewise beats `raze`, `sell`, `construction_cancel` and `disband` for slot 11. Whether Disband and Detach from HQ ever show together: the Delete key's rule below.
'''

[[topic.rule]]
id = "whose-commands-show"
tags = ["code", "data"]
text = '''Only the player's own things count, and with several selected a command shows when any of them can carry it out. A `non_group_command` (Disband, Sell) shows only when exactly one thing is selected; with more it has no button and its key does nothing.'''

[[topic.rule]]
id = "unavailable-commands"
tags = ["code"]
text = '''A command the selection can't carry out has no button, with one exception: when the one selected thing is a regiment in combat, a command that one of its members could carry out still gets a button, greyed unless the regiment itself can. So an unattached regiment's Disband shows greyed while it fights.'''

[[topic.rule]]
id = "hotkeys-need-button"
tags = ["code", "data"]
text = '''A key in the hotkey files acts only on a button that is showing, and when several commands share a key, the key presses whichever of them has a button. Delete is mapped to Disband, Sell and Detach from HQ, which never show together in the shipped data.'''

[[topic.rule]]
id = "confirmation-dialogs"
tags = ["code", "data", "guess"]
text = '''Disband, Sell and Raze ask first, from the button or the key, while the "Confirmation Dialogs" game option (`UIMessageBoxConfirmation`, on by default in `UVars.tgi`) is on: a message box "Are you sure?" (`important_command_confirm`) with an accept and a cancel button. Accepting carries the command out, cancelling drops it. With the option off they happen at once. No other command asks. The buttons read "Ok" and "Cancel" (`button_ok`, `button_cancel`). What each does: [buildings](buildings.toml#disbanding-and-selling).'''

[[topic.rule]]
id = "deploy-commands"
tags = ["code", "data"]
text = '''`recruit` (named "Deploy", tooltip "Opens the deployment menu.") and `recruit_location` ("Deploy to Location", "Opens the deployment menu. Selection is deployed via transport.") are the two buttons that open a recruiter's list, at slots 0 and 1. Pressing one replaces the grid with that menu.'''

[[topic.rule]]
id = "deploy-or-deploy-to-location"
tags = ["code"]
text = '''Which of the two a recruiter offers depends on its `RecruitActor` list, entry by entry: an entry whose template names no `transport_actor` belongs to Deploy, one that names a transport belongs to Deploy to Location. Each button shows only while at least one of its entries is offered (not hidden, see [recruiting](recruiting.toml#offered-greyed-or-hidden)); a greyed entry still counts.'''

[[topic.rule]]
id = "menu-choice-from-list-only"
tags = ["code"]
text = '''Nothing else picks the menu: not water nearby, nor the recruiter's kind.'''

[[topic.rule]]
id = "guard-button"
tags = ["data"]
text = '''`guard` ("Guard", tooltip "Commands selection to guard target object or area.") prefers slot 6, the slot `research` also prefers; its hotkey in the standard set is G. Pressing it waits for a click on the map with the `guard` cursor (an animated cursor, frames `Cursors/Guard_%d.tga`, looping each second), the cursor Attach, Detach and the HQ attach orders also use. It can't be given by right-click (`can_hot_command_actor` and `can_hot_command_location` are false). Its order marker is the effect `waypoint_defend_actor` ([order markers](#order-markers)). What the order does: [combat](combat.toml), Guard orders.'''

[[topic.rule]]
id = "rout-button"
tags = ["code", "game", "data", "guess"]
text = '''
`rout` ("Rout", tooltip "Commands selection to flee automatically. It cannot be controlled.", icon `UI/Game/ActionButtons/IconRout.png`) prefers slot 10, as `hq_attach` and Kohan II's `detach` do. Its key in the standard set is O (`hotkeys_standard_aa.txt`; HQ Attach is C); the other hotkey sets bind no command keys. It shows only while a regiment it's offered to is in a fight of its own and can move ([morale](morale.toml#the-players-orders)), with several selected when any one of them is. It's never greyed: units never carry it out, so the in-combat greyed exception above never applies; when it shows it's enabled, and it has no disabled text.
- It never meets HQ Attach in practice: HQ Attach is offered only to a regiment that isn't engaged, and only with one thing selected (it's a `non_group_command`), while Rout needs a fight. Were both to show, HQ Attach would keep slot 10 and Rout take the first free slot from 0.
- Attach to HQ (`hq_attach`) has a button whenever some HQ of your side recruits the regiment's kind and the regiment isn't engaged, attached or not. It's enabled only while there's an HQ it could go to, not counting the one it's attached to; otherwise it's greyed ([supply](supply.toml)). So an attached regiment whose side has no other HQ for it shows Attach to HQ greyed in slot 10 beside an enabled Detach from HQ in slot 11. This holds while its HQ packs or unpacks: the attachment and Detach from HQ stay.
- An HQ is never offered HQ Attach (no HQ recruits HQs, which is what attaching needs). Nor, in practice, Rout: a packed HQ is an unarmed truck that doesn't start fights, and an unpacked one can't move.
'''

[[topic]]
title = "A building's state and its commands"
under = "Command grid"

[[topic.rule]]
id = "structure-states"
tags = ["code", "data"]
text = '''A building is always in exactly one structure state: `structure_normal`, `structure_packing`, `structure_unpacking`, `structure_researching`, `structure_recruiting`, `structure_upgrading` or `structure_razing` (`Game/actor_states.tgi`, `actor_states_aa.tgi`). Researching or recruiting is the state while the item at the front of its queue is being built; with an empty queue it's back to normal. Only this state counts below, never the state the panel shows (the highest priority one) nor any other state it holds: `falling`, typed `busy`, and `construction`, untyped, are never structure states, so their `type` changes no command.'''

[[topic.rule]]
id = "packing-unpacking-no-commands"
tags = ["code", "game", "data", "guess"]
text = '''
Packing and unpacking take every command away from the building, whatever their `type` says: no Deploy, Deploy to Location, Set Rally Point, Research, Sell, Raze or anything else. A regiment's commands are those its members have, so an unpacking Division HQ's regiment has none either. What the grid still shows then isn't a command:
- Command All (slot 4), while the selected thing is an HQ with attachment places ([supply](supply.toml)), packed or unpacked, in any state;
- Team Commands (slot 8, `GoToTeamCommands`, "Opens the Team Commands menu", the clipboard icon `IconTeamCommands.png`), whatever is selected, while your side stands `ALLY` to at least one other side in the match. It's your side's relation that counts, one-way and with the team rule ([players](players.toml#relations)), so a teammate counts when your team is allied to its, and a side that has you as an ally while you don't have it doesn't. Every side in the match counts: computer sides, and the map's independent sides if the map makes them your allies; player slots nobody took aren't in the match. Nothing else is tested, so whether the ally is still in the match or already defeated doesn't matter. It's re-checked each time the grid is rebuilt, so a relation a trigger changes shows at the next rebuild. What it opens is in [team commands](team-commands.toml). It isn't Research: no Division HQ (Infantry, Armor, Mechanized or Airborne) has a research list, so none ever shows Research ([research](research.toml));
- Pack, greyed (below).
'''

[[topic.rule]]
id = "busy-states"
tags = ["code", "data"]
text = '''
In any other state, a structure state whose `type` is `busy` (in the shipped data, upgrading and razing; packing and unpacking already have nothing) hides, from that building:
- Deploy (`recruit`) and Deploy to Location (`recruit_location`);
- Research (`research`);
- Set Rally Point (`set_rally_point`), with one exception: while upgrading it stays if the building's Recruit (`commission`, Kohan II's settlements) is offered. No AA building has that, so in AA Set Rally Point goes too. The type is read from the data each time, so a state given `type = busy` in the data hides these as well. Hidden means no button at all, never a greyed one.
'''

[[topic.rule]]
id = "queue-and-none-states"
tags = ["code", "data"]
text = '''
Type `queue` (researching and recruiting) and `none` change nothing by their type: Deploy, Deploy to Location, Set Rally Point and Research stay offered while the building researches or recruits, so more can be queued. What any state other than normal does change, by the state itself and not its type:
- Pack is greyed (below);
- Raze isn't offered;
- while upgrading or razing, Sell isn't offered and Cancel (`construction_cancel`) is, to stop the upgrade or the razing. Sell stays while researching or recruiting ([buildings](buildings.toml#who-can-sell)).
'''

[[topic.rule]]
id = "set-rally-point"
tags = ["code"]
text = '''Set Rally Point otherwise shows exactly when Deploy (or Kohan II's Recruit) does: a building whose only menu is Deploy to Location has no rally point button.'''

[[topic.rule]]
id = "pack-command"
tags = ["code", "data"]
text = '''
Pack (`pack`, slot 9) on a building that packs into a truck:
- It's never offered when the template's `pack_health_min` is 1 or more (every nation's airfield) or the building holds `NOT_DISPOSABLE`.
- Otherwise, with that building the one selected, Pack always has a button. It's enabled only while the building is in the normal structure state, isn't under construction and has at least `pack_health_min` of its full health (0.5 by default); otherwise it's greyed. So it's greyed while packing, unpacking, researching, recruiting, upgrading or razing, and below half health. Being under siege doesn't grey it.
'''

[[topic.rule]]
id = "open-menu-survives-state"
tags = ["code", "guess"]
text = '''A Deploy or Research menu that's open when the building's state takes the command away stays open: its entries are refreshed once a second and keep their own offered, greyed or hidden look, which ignores the building's state. Pressing one does nothing: the order reaches a building without that command and is dropped, with no message, nothing paid and nothing queued. The menu closes only through its Cancel or when nothing is selected.'''

[[topic.rule]]
id = "unit-and-regiment-commands"
tags = ["code"]
text = '''Units and regiments: no `type` is read for them. A truck, or the regiment it leads, has no commands from the moment it reaches the spot it was told to unpack on until the building it becomes has finished unpacking. On the way there it has all its usual ones ([buildings](buildings.toml#an-unpack-order-from-start-to-finish)). A falling paratrooper's commands are his regiment's as usual ([combat](combat.toml)).'''

[[topic]]
title = "How the grid is drawn"
under = "Command grid"
intro = '''`ActionButtons` (`UI/Game/action_buttons.tgi`) is the grid's area; its 12 buttons are `ActionButtonsButton`, laid out by the program. Positions below are in the 1024×768 layout and stretch with it ([interface](interface.toml#layout-units-and-placement)).'''

[[topic.rule]]
id = "grid-cells"
tags = ["code"]
text = '''The area is cut into a 4×3 table of equal cells: a cell is a quarter of the area's width and a third of its height, each rounded down to a whole pixel. Each button sits centred in its cell, the gap on either side rounded down. Slot n is in column n mod 4 and row n div 4.'''

[[topic.rule]]
id = "aa-grid-layout"
tags = ["code", "data"]
text = '''With AA's area (185×138 at 831, 108 in the control panel) and 42×42 buttons, cells are 46×46 and each button sits 2 in from its cell's top left: slot 0's top left is at 2, 2 in the area (833, 619 on the screen), and slots step 46 across and 46 down. So the columns start at 2, 48, 94 and 140 and the rows at 2, 48 and 94.'''

[[topic.rule]]
id = "button-size"
tags = ["data"]
text = '''Every button is the size its layout gives it, 42×42 in AA.'''

[[topic.rule]]
id = "button-layers"
tags = ["data", "guess"]
text = '''A button draws, bottom to top: its frame, `ButtonUnfocused.png`, or `ButtonFocused.png` while the mouse is over it, filling the button; then the command's icon; then, while it's flashing (below), `ActionButtonBorderTargeted.tga` over it with its transparency.'''

[[topic.rule]]
id = "icon-inset"
tags = ["code", "data"]
text = '''The icon fills the button less an inset on every side: 1 pixel (`action_button_unpressed_client_*`) normally, so 40×40 at 1, 1; 3 pixels (`action_button_pressed_client_*`) while the button is held down, so 36×36 at 3, 3. The icon is stretched to that square (AA's icons are 42×42), so a press shrinks it towards its centre and release restores it.'''

[[topic.rule]]
id = "button-held-down"
tags = ["code"]
text = '''A button is held down while a mouse button (left or right) that went down on it is still down; the frame doesn't change for it. Nothing else holds a grid button down: it doesn't stay down while its targeted command waits for a click, nor while the menu it opened is showing.'''

[[topic.rule]]
id = "flashing-button"
tags = ["code", "data"]
text = '''Flashing: a button flashes when a trigger's `flash_ui_button` effect names it. It shows the targeted border for `UIFlashToggleSeconds` (0.5), then hides it for as long, and so on, for `UIFlashTogglesWhenTargeted` (16) half-periods, eight seconds in all; then the border stays off. Nothing else shows it.'''

[[topic.rule]]
id = "greyed-command"
tags = ["code"]
text = '''A greyed command keeps its button, its frame and the frame's mouse-over change; only its icon is greyed. A grid button is never put in the widget's disabled state, so the layout's `ENABLED` children always draw.'''

[[topic.rule]]
id = "greyed-icon-colour"
tags = ["code", "game"]
text = '''A greyed icon is redrawn in grey: each pixel becomes 0.114 × red + 0.318 × green + 0.043 × blue of the original, in all three colour channels. So it loses its colour and is darkened to under half: white becomes about 47% grey (121 of 255), and a full green 32%. It still covers the panel behind it.'''

[[topic.rule]]
id = "exhausted-tooltip-line"
tags = ["code", "guess"]
text = '''Its tooltip gets the line `ui_tooltip_action_button_exhausted_append` ("Not available while exhausted.") added, but only for the local player's own selected regiment when it's exhausted.'''

[[topic.rule]]
id = "empty-slot"
tags = ["code", "game"]
text = '''An empty slot has no button: nothing of its own is drawn, it takes no mouse-over and shows no tooltip. What shows there is the control panel's own image, whose recessed squares are where the buttons sit.'''

[[topic.rule]]
id = "menu-entries-same-buttons"
tags = ["code"]
text = '''Recruit and research menu entries, Cancel and the other buttons the grid offers (the team commands, Command all) are the same 12 buttons with a different icon and tooltip, so they're placed, framed, pressed and greyed exactly as commands are. A menu's Cancel always goes in slot 11, whatever `index` its `ActionButtonInfo` gives.'''

[[topic]]
title = "Deploy menus"
under = "Command grid"

[[topic.rule]]
id = "deploy-menu-layout"
tags = ["code", "game"]
text = '''A menu lays out its entries in the order the `RecruitActor` list gives them, from slot 0 row by row, up to slot 10. Slot 11 holds Cancel, which goes back to the commands. A list longer than eleven entries loses the rest. The Corps HQ's eleven entries fill slots 0–10 exactly.'''

[[topic.rule]]
id = "other-menu-entries-skipped"
tags = ["code"]
text = '''Entries that belong to the other menu take no slot: the ones after them move up to close the gap.'''

[[topic.rule]]
id = "hidden-entry-keeps-slot"
tags = ["code"]
text = '''An entry hidden for missing properties still takes its slot, which is left empty, so the entries after it don't move up.'''

[[topic.rule]]
id = "greyed-entry"
tags = ["code", "game"]
text = '''A greyed entry has its button, greyed.'''

[[topic.rule]]
id = "entry-name-and-icon"
tags = ["data"]
text = '''A button shows the recruited template's own `name` and `icon`, inherited from its template like any other value. So `regiment_<nation>_infantry_amphib`, which sets neither, looks exactly like the plain Infantry Regiment.'''

[[topic.rule]]
id = "infantry-hq-menus"
tags = ["code", "game", "data"]
text = '''So for each nation's Infantry HQ, the Deploy menu holds the entries before the amphibious regiment, in list order from slot 0. The amphibious regiment, last in the list, is in neither menu. It has a water transport, so it belongs to Deploy to Location, and it's hidden there for a missing property (see [recruiting](recruiting.toml#offered-greyed-or-hidden)). The USA HQ's Marine regiment is the same case. So the HQ has no Deploy to Location button: the grid shows Deploy at slot 0 and nothing at slot 1.'''

[[topic.rule]]
id = "battleship-menus"
tags = ["code", "data"]
text = '''A battleship's list is a regiment (the amphibious regiment, or the Marines on `usa_battleship_marine`) and an amphibious Corps truck (`<nation>_truck_corps_amphibious`, or its `_dynamic` twin). Both name a water transport (`<nation>_transport_water` and `<nation>_transport_water_hq`), so both belong to Deploy to Location: the battleship has no Deploy button, and its Deploy to Location menu holds the regiment in slot 0 and the truck in slot 1.'''

[[topic.rule]]
id = "deploy-entry-press"
tags = ["code"]
text = '''Pressing an entry of a Deploy menu orders the recruit and leaves the menu open, so the same or another entry can be pressed again at once. The grid goes back to the building's commands only through the menu's Cancel or when nothing is selected. This holds for every building's Deploy menu, and whether the order is taken or refused (unaffordable, greyed, at a limit): a refused press changes nothing in the grid. The Research menu behaves the same.'''

[[topic.rule]]
id = "deploy-to-location-entry-press"
tags = []
text = '''Pressing an entry of a Deploy to Location menu instead closes the menu and starts aiming the delivery: [deliveries](deliveries.toml#aiming).'''

[[topic]]
title = "Build menu"
under = "Command grid"

[[topic.rule]]
id = "build-command"
tags = ["code", "data"]
text = '''`construct` (named "Build", tooltip "Opens the Build menu.", icon `IconConstruct.png`) prefers slot 4; its key in the standard set is B. A regiment offers it while it can build ([construction](construction.toml#who-builds-and-what)). Pressing it replaces the grid with the Build menu.'''

[[topic.rule]]
id = "build-menu-layout"
tags = ["code", "game"]
text = '''The menu lays out what the regiment can build in that list's order from slot 0, up to slot 10, with Cancel in slot 11, which goes back to the commands. An engineer regiment shows Bunker, Anti-Aircraft Battery and Artillery Battery in slots 0–2.'''

[[topic.rule]]
id = "build-entries-always-offered"
tags = ["code"]
text = '''Every entry is offered and none is greyed or hidden: not for its cost, limits, research, a map's restrictions, supply or combat. Those are only met when the regiment reaches the site.'''

[[topic.rule]]
id = "build-entry-button"
tags = ["code", "guess"]
text = '''A button shows the building's `name` and `icon`. Its tooltip is built as a recruit's is: the name, then the cost and upkeep, then what the building would recruit, upgrade to, provide and research, then its `description` where it has one.'''

[[topic.rule]]
id = "build-entry-keys"
tags = ["data"]
text = '''In the standard set, B, A and R pick the Bunker, the Anti-Aircraft Battery and the Artillery Battery of each nation, under the same rule as a recruit's key (the menu open, the entry showing).'''

[[topic.rule]]
id = "build-entry-press"
tags = []
text = '''Pressing an entry starts placing the building: [construction](construction.toml#placing).'''

[[topic.rule]]
id = "build-structure-menu"
tags = ["code", "data"]
text = '''Kohan II only: Build Structure (`build_structure`, "Opens the Build Structure menu.", slot 1) is a settlement's menu of what it can put up. AA never shows it.'''

[[topic.rule]]
id = "construction-cancel"
tags = []
text = '''Cancel on a site under construction is `construction_cancel` ("Cancel", slot 11, key C): [construction](construction.toml#cancelling-and-losing-a-site).'''

[[topic.rule]]
id = "menu-entry-keys"
tags = ["code", "data"]
text = '''A recruit's key (`ActorDataSelectCommand <template>` in the hotkey files) works only while its menu is open and the entry's button is showing. A key for an entry that isn't there does nothing. The amphibious regiment's key (`i`) is listed under Battleship. With an Infantry HQ selected it does nothing.'''

[[topic]]
title = "Hotkeys in tooltips"

[[topic.rule]]
id = "tooltip-key-mark"
tags = ["code"]
text = '''A button's tooltip marks the key that presses it. This goes for any button with a key mapped to it in the current context, the command grid's and the control panel's alike; a button with no key shows its tooltip unchanged.'''

[[topic.rule]]
id = "key-mark-first-line"
tags = ["code"]
text = '''Only the tooltip's first line, the name, is marked; the lines after the first line break are left alone.'''

[[topic.rule]]
id = "key-in-name"
tags = ["code", "data"]
text = '''A plain key that types a character (no Ctrl, Alt or Shift) is shown inside the name: the first place in the name where that character stands is coloured `UIColorHighlight` (1,1,0, yellow, in `UVars.tgi`). The name is searched twice from the left, first for the character in the same case and only then ignoring case, so an exact-case match later in the name wins over an other-case one earlier. One character is coloured and the text is otherwise unchanged: "Deploy" with D colours its D. Text inside colour or other markup isn't searched.'''

[[topic.rule]]
id = "key-in-brackets"
tags = ["code"]
text = '''Otherwise the key is put in front: an opening bracket, the key's name coloured the same yellow, a closing bracket, then the name straight after with no space. That covers a key that types no character (Delete), a key with Ctrl, Alt or Shift, and a letter the name doesn't contain. Delete on "Detach from HQ" gives "(Delete)Detach from HQ" with Delete in yellow.'''

[[topic.rule]]
id = "key-names"
tags = ["code", "data"]
text = '''A key's name comes from the `key_` strings (`key_delete = "Delete"`), with any modifiers first, each followed by `hotkey_modifier_separator` ("-"): Ctrl+S reads "Ctrl-S", so the control panel's supply border button shows "(Ctrl-S)Toggle Supply Border".'''

[[topic.rule]]
id = "no-key-on-button"
tags = ["code", "data"]
text = '''Nothing follows the name, and the button layouts hold no key label, so nothing about the key is drawn on the button itself.'''

[[topic]]
title = "Targeted commands"
intro = '''A targeted command is one whose button arms the cursor (Attack, Guard, Move and the like) and is then given with a left click in the world. The refusal lines' kind, audience and sound are in `messages.toml` (Other messages).'''

[[topic.rule]]
id = "command-targets"
tags = ["code"]
text = '''
What a command accepts is fixed per command, not in the data files:

| Command | A place | A thing | Refuses things that are |
|---|---|---|---|
| `kill` (Attack) | yes | yes | the player's own or an ally's |
| `bombard`, `air_attack` | yes | yes | the player's own or an ally's |
| `guard` | yes | yes | an enemy's |
| `move`, `retreat` | yes | yes | nothing |
| `repair` | no | yes | an enemy's; not repairable; not damaged |
| `explore`, `set_rally_point`, `air_recon`, `recruit_location` | yes | no | |

"The player's own or an ally's" is judged from the local player's side: own things, the selected regiment itself included, and things of sides allied to the player. Neutral things pass that test.
'''

[[topic.rule]]
id = "invalid-target-thing"
tags = ["code", "game"]
text = '''A click on a thing the command refuses posts `ui_error_command_target_actor` ("%s is an invalid target for %s"): the first `%s` is the clicked thing's name as lines show it, the second the command's `name` ("Attack", "Guard"). So Attack on one of the player's own regiments or buildings, or an ally's, gives "1st Infantry Regiment is an invalid target for Attack". The line's location is the clicked thing.'''

[[topic.rule]]
id = "one-error-per-click"
tags = ["code"]
text = '''It's one line per click, however many regiments are selected, and no order is given to any of them.'''

[[topic.rule]]
id = "attack-target-test"
tags = ["code"]
text = '''Attack has a second test once the first passes: at least one selected regiment must be able to attack the thing (it's alive, can be targeted, is an enemy of that regiment, and some unit has a weapon that can be used on it). If none can, the click posts `kill_error_invalid_target` ("Invalid target: %s", the thing's name), located at the thing, and gives no order. A neutral's regiment or building ends up here, since it isn't an enemy.'''

[[topic.rule]]
id = "repair-targets"
tags = ["code", "guess"]
text = '''For `repair`, "damaged" means below full health and not still under construction (for a regiment, any member), and "repairable" is a property of the thing itself (for a regiment, of any member), taken here to be what buildings have. A failure of either posts the same `ui_error_command_target_actor` line.'''

[[topic.rule]]
id = "invalid-target-ground"
tags = ["code"]
text = '''A command that takes only things, clicked on empty ground, posts `ui_error_command_target` ("Invalid target for %s", the command's name) with no location. A command that takes only places treats a click on a thing as a click on the ground under it.'''

[[topic.rule]]
id = "bombard-invalid-location"
tags = ["code"]
text = '''Bombard on a place none of the selected regiments can bombard posts `bombard_error_location` at that place; the order has still been given.'''

[[topic.rule]]
id = "click-ends-command"
tags = ["code"]
text = '''The click ends the command whether it was accepted or refused: the cursor goes back to normal and the button has to be pressed (or its hotkey used) again for another try. A right click while a command is armed calls it off without giving it.'''

[[topic.rule]]
id = "right-click-command"
tags = ["code", "data"]
text = '''A plain right click with regiments selected never arms Attack: it gives the first command, in the order `kill`, `bombard`, `guard`, `repair`, `move`, that the selection has, that allows right-click use on what was clicked (`can_hot_command_actor` for a thing, `can_hot_command_location` for a place) and whose demands the target meets. Stock data allows `move` on both and `repair` on things. So a right click on one of the player's own or an ally's regiments or buildings is a Move to it (or a Repair, for a selection that can repair and a damaged building), with no buzzer and no line; a right click on an enemy is also a Move, which the regiment turns into an attack (see `combat.toml`, Attack orders).'''

[[topic.rule]]
id = "queued-targeted-orders"
tags = []
text = '''Queued orders are under [Queued orders](#queued-orders).'''

[[topic.rule]]
id = "order-facing"
tags = ["code", "guess"]
text = '''**Facing.** An order on a place whose command takes a facing (fixed by the game, not the data: `move`, `guard`, `retreat`, `unpack`, `construct` and `kill`) isn't sent when the button goes down. While the button is held the player drags out a facing, from the point pressed towards the pointer, which the game shows as the drag goes; the order is sent on release, carrying that facing. Released without dragging, it's sent with no facing. A plain right click on the ground gives its Move the same way. What a facing does: a regiment turns to it when its move ends ([movement](movement.toml#members-routes)), a group lays out its regiments by it ([movement](movement.toml#groups)), and a lone unit ignores it.'''

[[topic.rule]]
id = "alt-right-click"
tags = ["code", "data"]
text = '''Alt + right click gives only the command named by the `HotkeyAltRightClickCommand` setting (stock `retreat`), under the same target rules; `SwapRightClickWithAltRightClick` swaps the two clicks. If no command fits, nothing happens and nothing is posted.'''

[[topic]]
title = "Queued orders"

[[topic.rule]]
id = "queueing-click"
tags = ["code"]
text = '''Holding Shift or Ctrl while clicking an order onto the map (a targeted command's click, or the click that places a building) marks it queued.'''

[[topic.rule]]
id = "queue-append"
tags = ["code"]
text = '''A queued order that has a target (a place, a thing, or a template picked from a menu, as Build has) goes on the end of each regiment's queue instead of replacing what it's doing. One with no target (Stop, Disband and the like) isn't queued: it's carried out at once like an unqueued order.'''

[[topic.rule]]
id = "unqueued-order-clears-queue"
tags = ["code"]
text = '''Any order that isn't queued throws the regiment's queue away and replaces its current order. So does the regiment routing or regrouping.'''

[[topic.rule]]
id = "queue-taken-when-idle"
tags = ["code"]
text = '''Whenever the regiment runs out of orders and is idle, it takes the queued ones in the order given, carrying out the first it can and dropping, silently, any before it that it can't. A queued order given to an idle regiment starts at once.'''

[[topic.rule]]
id = "engagement-keeps-queue"
tags = ["code"]
text = '''An engagement doesn't empty the queue: the regiment fights, finishes the order it was on, then goes on down the queue.'''

[[topic.rule]]
id = "queue-unlimited"
tags = ["code"]
text = '''There's no limit to how many orders a regiment can have waiting.'''

[[topic.rule]]
id = "queue-saved"
tags = ["code"]
text = '''Queued orders are kept in a saved game, with the order being carried out ([saved state](saved-state.toml#orders-and-minds)).'''

[[topic.rule]]
id = "queued-order-reply"
tags = ["code"]
text = '''Giving a queued order sounds like giving any other: the selection's reply follows the usual rule ([sounds](sounds.toml#unit-replies)), whether or not the order is queued.'''

[[topic.rule]]
id = "group-queue"
tags = ["code"]
text = '''With Group Behavior on and several regiments selected ([movement](movement.toml#groups)), a queued order goes to the group as a whole and waits in the group's own queue, not in the regiments'. When the group has finished its current order it takes the next one and its regiments carry it out together, timed as one, as they would an unqueued order to the group. A queued order given to a group that has no order starts at once. An unqueued order to the selection makes a fresh group, so whatever the old group had queued is dropped.'''

[[topic]]
title = "Order markers"
under = "Queued orders"

[[topic.rule]]
id = "whose-markers-show"
tags = ["code"]
text = '''What the map shows for a regiment's orders is drawn for the player's own and allied regiments (and lone units) while they're shown in the selection panel, alone or as one of several cards; nothing is drawn for an unselected regiment or an enemy's. A selection never holds more things than the panel has cards (six), so every selected thing shows its markers ([object display](object-display.toml#the-group-displays-cards-name-and-owner)).'''

[[topic.rule]]
id = "marker-per-order"
tags = ["code", "data"]
text = '''Each order the regiment has, the current one and every one waiting, gets a marker at its target: the order's `command_vfx_ids_actor` effect, whether the order is aimed at a thing or at a place (the `command_vfx_ids_location` effects are never shown). An order aimed at a thing the regiment can attack shows the attack order's marker (`waypoint_attack_actor`) instead, whatever the order is.'''

[[topic.rule]]
id = "place-marker"
tags = ["code"]
text = '''A marker for a place sits on the ground there; for a regiment moving with its group, at its own spot in the group's layout rather than the clicked point.'''

[[topic.rule]]
id = "thing-marker"
tags = ["code"]
text = '''A marker for a thing follows the thing while the player can see it, raised above it: by the height of the top of its model, times the camera's zoom factor (the one that keeps screen-sized effects the same size on screen).'''

[[topic.rule]]
id = "unseen-thing-marker"
tags = ["code"]
text = '''When the player can't see the thing, its marker still shows, at the place the player remembers it, if it's something that can't move right now (a building, or a unit set up or packing or unpacking in place) that the player has seen. Otherwise (a unit that can move and is out of sight, or a thing never seen) that order has no marker; the others keep their numbers, so the count skips it.'''

[[topic.rule]]
id = "marker-numbers"
tags = ["code", "data"]
text = '''When anything is waiting, each marker has its number shown above it, `UIWaypointNumberZOffset` (stock 1) higher: 1 for the current order, then 2, 3 and on for the waiting ones in the order they'll be taken. A lone current order has no number.'''

[[topic.rule]]
id = "markers-unjoined"
tags = ["code"]
text = '''Nothing joins the markers: no lines or path.'''

[[topic.rule]]
id = "markers-follow-orders"
tags = ["code"]
text = '''The markers follow the orders as they change: when an order is done its marker goes and the rest renumber from 1; an unqueued order clears them all but its own. Deselecting the regiment takes them all away.'''

[[topic.rule]]
id = "group-markers"
tags = ["code"]
text = '''A group's waiting orders are drawn once, with its lead regiment, after that regiment's current order; each regiment of the group shows its own marker for the order the group is carrying out.'''

