subject = "Multiplayer"
summary = '''How a match runs across machines: who is in charge, what is sent, how machines stay in step and what happens when they don't, the lobby, computer players, single-player as the same thing with one person, and recorded games ("films", the data files' word). The messages these rules post are in [messages](messages.toml); resigning and the end of a match are in [outcome](outcome.toml).'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "The model"

[[topic.rule]]
id = "orders-only"
tags = ["code"]
text = '''Every machine plays the whole match itself. Nothing about the world is sent during play: no positions, no health, no results. Machines exchange only orders, and each applies the same orders at the same step to an identical world.'''

[[topic.rule]]
id = "orders-through-host"
tags = ["code"]
text = '''One machine, the host, decides the order of everything. A player's order is not applied on their own machine when they give it: it goes to the host, the host places it in the next step it issues, and every machine (the sender included) applies it when it plays that step.'''

[[topic.rule]]
id = "steps-and-bundles"
tags = ["code"]
text = '''The match advances in steps, 16 a second of real time whatever the game speed. For each step the host issues one bundle holding every order it accepted since the last, taking the machines' orders in a fixed order of machines; a step with no orders still has an (empty) bundle. A machine can't play step N until it holds bundle N.'''

[[topic.rule]]
id = "host-plays-ahead"
tags = ["code"]
text = '''The host plays each step as it issues it, so the host is always the furthest ahead and never waits for anyone while all connections are alive. The others follow as bundles arrive.'''

[[topic.rule]]
id = "step-game-time"
tags = ["code", "data"]
text = '''Each step moves game time on by 2^`GameSpeed` / `GameTicksPerGameSecond` (stock 16) seconds: one sixteenth of a second at normal speed, four sixteenths at 400%. While paused, or frozen for loading or saving, steps still pass but game time stands still.'''

[[topic.rule]]
id = "order-sender-check"
tags = ["code"]
text = '''The host checks that an order for a player comes from the machine that player belongs to and ignores it otherwise. Orders also carry which phase of the session they were given in, and one given before the session moved on (lobby to loading, say) is dropped.'''

[[topic]]
title = "What is sent, and when"

[[topic.rule]]
id = "order-kinds"
tags = ["code"]
text = '''
Orders are small typed messages. Roughly 180 kinds exist, in these groups:
- Commands to the world: tell these things to move, attack, use an ability or do a command-grid command; use a special operation; resign or vote to resign; the cheats.
- A player's selection. Selecting, adding to, removing from and clearing the selection are orders too, and most commands are "tell my selection to do this", so each player's current selection is part of the shared match rather than private to their screen.
- Match control: set or toggle pause, set speed, speed up, speed down, save the game, skip a cutscene, become an observer.
- Chat: public, team and private.
- Session business: join, leave, kick, ban, vote to kick; everything the lobby changes; launch and its countdown; "I've finished loading"; a computer player taking over a side.
- Housekeeping: each machine's periodic checksum report (below).
'''

[[topic.rule]]
id = "order-delay"
tags = ["code"]
text = '''No fixed delay is added to an order. It takes effect one trip to the host and back after it's given: at most a step later for the host's own player, the round trip plus up to a step for everyone else.'''

[[topic.rule]]
id = "reliable-delivery"
tags = ["code", "data", "guess"]
text = '''Bundles and submitted orders are delivered reliably and in order: a machine keeps what it sent until it's acknowledged (the last 1,000 bundles on the host, the last 200 steps of its own orders on a client) and resends what's missing. How often packets go out, and their size, follow the connection type the player chose (`Game/connection_types.tgi`: `Modem` bandwidth 4000, `Broadband` 100000); the exact pacing isn't known.'''

[[topic.rule]]
id = "client-clock"
tags = ["code", "guess"]
text = '''A client keeps an estimate of the host's clock from the timing of recent packets and schedules its steps against that, so it runs a steady fraction of a second behind the host rather than in bursts as packets land.'''

[[topic]]
title = "Slow and lagging players"

[[topic]]
title = "Who listens to whom"
under = "Slow and lagging players"

[[topic.rule]]
id = "clients-hear-host-only"
tags = ["code"]
text = '''Clients don't talk to each other. Each sends only to the machine in charge (the host, or during a hold after losing the host, the backup host below), and hears only from it. The one exception is the moment after the host is lost, while the survivors settle on who takes charge (see When the host leaves).'''

[[topic.rule]]
id = "regular-traffic"
tags = ["code"]
text = '''Silence means trouble: a machine sends to the one in charge at least every tenth of a second even with nothing to say, and the one in charge sends to each client at least as often (up to every fiftieth of a second while it has steps or other news to pass on).'''

[[topic.rule]]
id = "hearing-from"
tags = ["code"]
text = '''"Hearing from" a machine is receiving a packet from it newer than the last one; nothing else counts.'''

[[topic.rule]]
id = "disconnect-timeout"
tags = ["code"]
text = '''Only the machine in charge judges the clients: one it hasn't heard from for 2 seconds is Disconnected. A client judges only the machine in charge, by its own clock: 3 seconds without a packet and it counts that machine lost (see When the host leaves).'''

[[topic.rule]]
id = "ping-smoothing"
tags = ["code"]
text = '''Ping comes from the same regular traffic: each packet freshens a smoothed round-trip time (a quarter of the new sample, three quarters of the old). There are no separate ping messages.'''

[[topic]]
title = "Status"
under = "Slow and lagging players"

[[topic.rule]]
id = "status-broadcast"
tags = ["code"]
text = '''The machine in charge works out every player's status and ping and, once a second, sends everyone the lot: each player's status and ping, each machine's drop vote, the vote count and the countdown. Other machines show what they're sent; they don't work any of it out themselves. This goes on throughout a match, not only during a hold.'''

[[topic.rule]]
id = "ping-shown"
tags = ["code"]
text = '''So every ping shown is the one the machine in charge measured: a client's own slot shows the host's measure of its link, and the slot of the machine in charge always shows 0, having no link of its own to measure.'''

[[topic.rule]]
id = "player-status"
tags = ["code", "guess"]
text = '''
A player's status is the first of these that applies:
- Disconnected: not heard from for 2 seconds.
- Out of Sync: its checksum report disagreed with the host's (see Disagreement between machines). It stays so.
- Low CPU: the machine reports itself short of time: while it has steps due, frame after frame has left it less than a fifth of its time spare (measured over the last tenth of a second), more than 5 frames running on the host or 30 on a client. It clears as soon as the machine is no longer short. for the exact measure.
- Low Bandwidth: more than 32 steps (two seconds) the machine in charge has sent it are still unacknowledged, or the machine reports that more than 32 of its own sends are. During a hold the limits are 64 and 32 on the hold's own traffic.
- Catching Up: only at the end of a hold (below), while the player still hasn't acknowledged every step issued.
- Otherwise ok, which shows no icon and no text.
'''

[[topic.rule]]
id = "lag-backlog"
tags = ["code"]
text = '''A little lag holds nobody up: the host keeps issuing steps and a machine that falls behind plays its backlog as fast as it can.'''

[[topic]]
title = "The hold"
under = "Slow and lagging players"

[[topic.rule]]
id = "hold-statuses"
tags = ["code"]
text = '''The match is held whenever any player is Disconnected, Out of Sync, Low CPU or Low Bandwidth, not only when a machine is lost. The host's own Low CPU holds it too.'''

[[topic.rule]]
id = "hold-stops-steps"
tags = ["code"]
text = '''While held, the machine in charge issues no steps. The others play the steps they already hold, then wait, so everyone stops at the same step and game time stands exactly still. A step is never half-played.'''

[[topic.rule]]
id = "hold-end-catching-up"
tags = ["code"]
text = '''The hold ends once nobody has any of those statuses and every player has acknowledged every step: until then the ones still behind show Catching Up. Play then resumes with nobody dropped.'''

[[topic.rule]]
id = "chat-during-hold"
tags = ["code"]
text = '''Chat goes on during a hold through the connection dialog: the machine in charge passes it on at once, outside the steps. The chat bar's lines wait for the hold to end, like other orders (see Chat in a match).'''

[[topic.rule]]
id = "orders-during-hold"
tags = ["code"]
text = '''Other orders given during a hold aren't lost: each machine keeps collecting its players' orders, and they go to the host and into a step as soon as stepping resumes, so they take effect just after the hold.'''

[[topic.rule]]
id = "hold-passes-no-time"
tags = ["code"]
text = '''Time spent held passes no game time, so it counts nowhere: the on-screen elapsed time, timers and everything else measured in game time leave it out, and so does the score screen, whose graph samples each side's statistics once a minute of game time (plus at the start and the end of the match).'''

[[topic]]
title = "The allowance, the vote and the drop"
under = "Slow and lagging players"

[[topic.rule]]
id = "allowance"
tags = ["code"]
text = '''Each player has an allowance: it starts at 15 seconds, drains by a second for every second they have any of the hold's statuses, and refills by a tenth of a second for every second they're clear, to at most 15. A player who keeps causing holds gets less grace each time. The machine in charge keeps the allowances; one that takes charge starts everyone at 15 again.'''

[[topic.rule]]
id = "drop-vote"
tags = ["code"]
text = '''Dropping takes a vote. Each machine has one drop vote, observers' and the host's included, set and taken back with the Kick toggle in the connection dialog's lower panel. It's a vote against everyone holding the match at once, not against one player, and it posts no line.'''

[[topic.rule]]
id = "drop-conditions"
tags = ["code"]
text = '''
The players holding the match are dropped together when both:
- enough machines vote: more than half of the machines that aren't Disconnected (half of them, rounded down, plus one), counting the machine in charge and any that are only slow; and
- the allowance of every one of them has run out (the most any of them has left is a tenth of a second or less). Without enough votes the hold lasts until it ends by itself or people leave. Votes stand until a drop clears them all.
'''

[[topic.rule]]
id = "drop-countdown"
tags = ["code"]
text = '''The countdown is the largest allowance left among the players holding the match: the one who runs out last decides when they all go.'''

[[topic.rule]]
id = "slow-players-dropped"
tags = ["code"]
text = '''A player who is only slow (Low CPU, Low Bandwidth) or Out of Sync is dropped this way just like a lost one, and reads the same: "Player %s quit the game" (see Leaving). The machine in charge itself is never dropped.'''

[[topic.rule]]
id = "lobby-drop"
tags = ["code"]
text = '''In the lobby there's no allowance and no vote: the host's own Kick toggle drops whoever is lost at once.'''

[[topic]]
title = "The connection dialog"
under = "Slow and lagging players"

[[topic.rule]]
id = "connection-dialog-opens"
tags = ["code", "data"]
text = '''`UI/Game/connection_status_dialog.tgi`. It opens by itself once a hold has lasted 2 seconds, so a blip doesn't flash it, and closes by itself when the hold ends. A player can also open it any time from the game menu's Connection Status entry; opened that way it stays until closed.'''

[[topic.rule]]
id = "connection-dialog-while-loading"
tags = ["code", "game"]
text = '''In multiplayer it is also open throughout the loading screen, on every machine (the host's included, and a person's whose only opponents are computer players), from when loading starts until play begins (see Loading). It shows there what it shows in play: no slot says whether that player is still loading or has finished; only each machine's own status line says how far it has got.'''

[[topic.rule]]
id = "connection-dialog-title"
tags = ["code", "data"]
text = '''Its title: "Hosting" on the host, "Backup Host" on a machine in charge that isn't the host, "Connected to %s" naming the machine in charge on everyone else (`csd_title_*`).'''

[[topic.rule]]
id = "connection-dialog-slots"
tags = ["code", "data"]
text = '''
One slot per human player, kept up to date while the dialog is open:
- The host icon, shown on the host's slot only.
- The status icon for the status above (`status_icon_*`), hidden while the status is ok.
- The player's name as the game shows it elsewhere (side glyph and colour, see [messages](messages.toml)).
- The ping: a coloured ping glyph then whole milliseconds. Green below `ServerBrowserLowPingCutoff` (stock 200), yellow below `ServerBrowserMediumPingCutoff` (stock 500), red otherwise; the glyphs are `PingIconGreenGlyphInfo`, `PingIconYellowGlyphInfo` and `PingIconRedGlyphInfo`.
- A Kick toggle and "%d/%d Votes" (that player's kick votes, then votes needed): the ordinary vote to kick that one player, with its lines (see Pause, speed, chat, votes). Both show only outside a hold and only when more than two players have sides; the toggle isn't on your own slot, works only if you have a side, and stays down while your vote against that player stands.
- Its tooltip shows "Host" for the host, then the ping, how well packets are getting through, and the status's text.
'''

[[topic.rule]]
id = "connection-dialog-lower-panel"
tags = ["code", "data"]
text = '''
The lower panel shows only during a hold:
- Status, the Kick toggle for the drop vote, and "%d/%d Votes" (votes so far, then votes needed).
- "Disconnecting in %d seconds", the countdown in whole seconds, once enough have voted and there's time left on it.
'''

[[topic.rule]]
id = "connection-dialog-close"
tags = ["code"]
text = '''Close shows only when the player opened the dialog themself, no hold is on and it isn't the loading screen. On the multiplayer loading screen Leave Game is hidden, not greyed out, unless a hold is on.'''

[[topic.rule]]
id = "connection-dialog-leave"
tags = ["code"]
text = '''Leave Game asks "Exit the game?" (`csd_leave_game_confirm`) and then leaves as the game menu's leave does: from a match through the same request, from the lobby straight out of the session. From the loading screen it leaves as from the lobby, with no debriefing.'''

[[topic.rule]]
id = "connection-dialog-loading-controls"
tags = ["code"]
text = '''Everything else in it works on the loading screen as in play: the chat panel, the Kick toggles and votes on the slots (same conditions), and during a hold the lower panel.'''

[[topic.rule]]
id = "connection-dialog-at-play-start"
tags = ["code"]
text = '''When play begins the loading screen no longer keeps it open: it closes then, unless a hold has been on for 2 seconds, when it stays until the hold ends, as in play.'''

[[topic.rule]]
id = "connection-dialog-chat"
tags = ["code", "data"]
text = '''A chat panel (message log, edit box, Send) lets players talk during the hold (see Chat in a match).'''

[[topic]]
title = "The machine that's cut off"
under = "Slow and lagging players"

[[topic.rule]]
id = "host-lost-timeout"
tags = ["code", "guess"]
text = '''A machine that loses its link sees the same from its side: after 3 seconds without the host it counts the host lost and takes charge of a hold itself, as every survivor does at first. Within a moment the survivors settle on the best-ranked of them each can still reach, half a second per place in the ranking, and the rest follow it.'''

[[topic.rule]]
id = "cut-off-machine"
tags = ["code", "guess"]
text = '''Cut off from everyone, it stays in charge of its own hold ("Backup Host"), with everyone else Disconnected. Being the only machine connected, its vote alone is a majority: if its player votes, then 15 seconds on (everyone's allowance restarted when it took charge) it drops everyone else, takes over as host and plays on with computer players on every other side. The others do the same to it, so the match splits in two. If its player doesn't vote, it stays held until they leave.'''

[[topic.rule]]
id = "link-comes-back"
tags = ["code", "guess"]
text = '''If its link comes back before it's dropped the hold ends for everyone and play resumes. Once it has been dropped there's no way back: a match under way refuses joins ("Game is already in progress").'''

[[topic]]
title = "Leaving"

[[topic.rule]]
id = "ways-to-leave"
tags = ["code"]
text = '''A player leaves by choosing to (the game menu's leave entry, see [outcome](outcome.toml)), by being kicked, or by being dropped after holding the match (lost, slow or out of sync). Every remaining machine removes them at the same step and posts one line; the lines and their kinds are in [messages](messages.toml). A drop reads exactly like choosing to leave ("Player %s quit the game"): nothing tells the others the player was lost rather than gone by choice, beyond the connection dialog they saw while the match was held.'''

[[topic.rule]]
id = "side-kept-on-leave"
tags = ["code"]
text = '''In a match the side isn't removed: a computer player takes it over (see Taking over a side, below).'''

[[topic.rule]]
id = "leaving-on-purpose"
tags = ["code"]
text = '''A machine that leaves on purpose, host or not, says so to the others as it goes, and is then dropped at once: there's no hold, countdown or vote for it, as there is for a machine that is merely lost.'''

[[topic.rule]]
id = "host-ended-game-notice"
tags = ["code"]
text = '''When the host leaves a match that is over, the other machines are told first ("The host has ended the game."). That notice is all it does: it doesn't move anyone to the debriefing or stop their match.'''

[[topic.rule]]
id = "host-departure-after-notice"
tags = ["code"]
text = '''The host's own departure then follows straight away, the same as any host leaving on purpose (below): the others see "Player %s quit the game" for the host, a survivor takes over as host ("%s has taken over as host."), and a computer player takes the old host's side. Everyone else stays in the match, which carries on as before. Each goes to their own debriefing only when they leave themselves; the new host's leave entry now reads End Mission, and when it leaves the rest are told again in the same way.'''

[[topic.rule]]
id = "host-leaves-mid-match"
tags = ["code"]
text = '''A host who leaves before the match is over sends no notice; the others just see them quit, with the same handover.'''

[[topic.rule]]
id = "handover-lines"
tags = ["code", "guess"]
text = '''The lines that handover posts on each survivor: "%s has taken over as host." naming the new host, then "Player %s quit the game" naming the old host, then (if the old host had a side) "%s taken over by %s" for its computer player. There's no countdown or vote, so no quit line waits on one; the connection dialog may show for a moment while the new host gathers any steps it missed, and the quit line comes as that ends. for the order of the first line on survivors other than the new host.'''

[[topic.rule]]
id = "observer-host-leaves"
tags = ["code"]
text = '''A host who only watches (an observer, with no side) still gets the quit line, its name marked with the observer glyph; there's no side, so no computer player takes anything over.'''

[[topic.rule]]
id = "machine-takes-its-players"
tags = ["code"]
text = '''A leaving machine takes all its players with it: its person and every computer player it added in the lobby (see Computer players in the lobby). Only the person gets a line; the computer players go without one.'''

[[topic.rule]]
id = "orders-around-leave"
tags = ["code"]
text = '''
Orders and the leave:
- Every order in a step issued before the one the leave is in is carried out, on every machine, the leaver's own orders and its computer players' included. A step, once issued, is never taken back, and nothing is issued ahead for later steps: each step's orders are only those the host accepted before issuing it.
- From the leave's step on, nothing from the leaver's machine is carried out. Orders it gave that the host hadn't yet put in a step (still on their way, or collected during the hold before a drop) are dropped: their players no longer exist, and the host only accepts a player's orders from that player's own machine.
'''

[[topic.rule]]
id = "leave-doesnt-end-match"
tags = ["code"]
text = '''A leave doesn't end the match, whoever is left: the last person on a team leaving, or every person but the host, changes nothing about how it is won or lost. The taken-over sides play on as computer players, and the match goes on until it's won or the host ends it (see [outcome](outcome.toml)).'''

[[topic.rule]]
id = "leave-changes-person-counts"
tags = ["code"]
text = '''What it can change is what counts persons: a taken-over side counts as a computer's from then on. So "No human opponents remain." can follow (once no two persons still in the match, and not yet lost, are on different sides of the fight, as [outcome](outcome.toml#after-a-side-has-lost) says for a loss), and the host's leave entry can turn to "Abort Mission" (its only opponents left being computers).'''

[[topic]]
title = "Taking over a side"
under = "Leaving"

[[topic.rule]]
id = "takeover-computer-player"
tags = ["code"]
text = '''Whenever a player leaves a match under way, every side that is still in the match (not yet lost) and has no player left gets a new computer player. That is the leaver's own side and the side of each computer player that left with it; a side that has already lost gets none, nor does an independent side. Sides that won stay in the match, so they do get one.'''

[[topic.rule]]
id = "takeover-belongs-to-host"
tags = ["code"]
text = '''Every new computer player belongs to the host and thinks on the host's machine, whichever machine the side's earlier player belonged to.'''

[[topic.rule]]
id = "takeover-lines"
tags = ["code"]
text = '''Lines, on every machine: the leaver's line ("Player %s quit the game", or the kick line) comes first, then one "%s taken over by %s" (`sai_midgame_name_change`, `GENERIC_EVENT`) per side taken over, in the order of the map's sides (its player numbers), not the leaver's own side first. The takeover lines come a step or two after the leaver's line: the host makes the new computer players in a step after the leave, and announces them in a later one.'''

[[topic.rule]]
id = "takeover-line-names"
tags = ["code", "data"]
text = '''In that line the first %s is the new computer player's name, shown like a person's in a line (its side's gem and colour, see [messages](messages.toml)), and the second is its profile's `name` as a computer player at launch would be named: "Bob AI taken over by Kesselring AI".'''

[[topic.rule]]
id = "takeover-name"
tags = ["code", "data"]
text = '''Its name is the side's name as it stood, with `sai_midgame_name_postfix` (" AI") added, made unique among the session's players like any other name (see Player names). That name is the player's in the player list and everything else that shows players, and outside a campaign mission the side is renamed to it as well, so the side's things, lines and panel read "Bob AI" from then on. A computer side that left with its person was named after its profile, so it becomes, say, "Kesselring AI AI".'''

[[topic.rule]]
id = "leaver-name-gone"
tags = ["code", "guess"]
text = '''The leaver's name doesn't stay on anything that names the side or its player: it's gone from the player list, and the side carries the new name. Screens after the match that name sides show the new name.'''

[[topic.rule]]
id = "takeover-profile"
tags = ["code"]
text = '''Its profile: the one the map's setup names for that side, if it names one that exists (campaign maps do); otherwise drawn as at launch for a computer player left on "Random" (see Choosing a profile at launch): public, not the easiest difficulty, fitting the side's nation and general, with the same fallback, from the host machine's own random numbers. A profile chosen in the lobby for a computer side that left is not kept.'''

[[topic.rule]]
id = "takeover-handicap"
tags = ["code"]
text = '''Its handicap: none is added or changed. A side's handicap does its work at the start of the match only (see [players](players.toml)), so the side keeps whatever that gave it and the takeover makes no difference to it.'''

[[topic.rule]]
id = "what-carries-over"
tags = ["code", "guess"]
text = '''What carries over is everything that belongs to the side rather than to its player: its things, stockpiles, technologies, its queues of recruits and research, its team and how it stands with other sides, the flares placed for it, gifts already carried out. The new computer player takes command of all its things as they are and doesn't clear the queues it finds; its own recruiting adds to them only within its usual limit (see [computer players](computer-players.toml#recruiting)).'''

[[topic.rule]]
id = "what-doesnt-carry-over"
tags = ["code", "guess"]
text = '''What doesn't: nothing the earlier player was doing or planning. A computer player that left takes its plans with it, and requests allies made of the side before the takeover aren't remembered (a computer player notes requests as they come). Standing flares do count, as they do for any computer player (see [computer players](computer-players.toml#flares-and-allies)). A pause the leaver held ends at once (see Pause, speed, chat, votes). A person's control groups and selection are of no use to it: it gives orders by selecting things itself.'''

[[topic]]
title = "When the host leaves"

[[topic.rule]]
id = "host-loss-continues"
tags = ["code", "data"]
text = '''A host who leaves or is lost doesn't end the match. If it was lost, one of the remaining machines takes charge of the hold described above (its dialog is titled "Backup Host"); if it left on purpose there's no hold. When the old host is dropped that machine becomes the host: "%s has taken over as host." (`networking_new_host`).'''

[[topic.rule]]
id = "new-host-collects-bundles"
tags = ["code"]
text = '''Before it issues anything, the new host collects from the other survivors any bundles they received from the old host that it didn't, so the match continues from the latest step any survivor reached and no one has to undo anything.'''

[[topic.rule]]
id = "host-ranking"
tags = ["code"]
text = '''Which survivor takes charge follows a fixed ranking that all of them agree on: the order in which they joined the session, the original host first. Each player in the session, person or computer, is numbered as it's added, and a machine ranks by its person's number, so the survivor that joined earliest takes charge. A machine ignores a claim to take charge from one ranked below itself.'''

[[topic.rule]]
id = "machine-addresses"
tags = ["code"]
text = '''Every machine knows every other machine's address from the start: when a machine joins, the host tells everyone the address it sees that machine's packets come from (its IP address and port), and tells the joiner the address of each machine already there. Nothing is sent between those addresses while the host is there.'''

[[topic.rule]]
id = "settling-new-host"
tags = ["code"]
text = '''Settling on the new one in charge, when the host is lost: every survivor first takes charge of its own hold. Each then offers itself as a client to every survivor ranked above it, starting half a second per place of that survivor's number after the loss (so the best-ranked is tried first) and repeating a few times a second. A survivor in charge that hears such an offer from one ranked below it starts serving it, and a survivor that hears from one in charge ranked above it follows that one and stops being in charge. So they end up following the best-ranked survivor that each can reach, at the address the old host had given for it.'''

[[topic.rule]]
id = "new-host-reachability"
tags = ["code", "guess"]
text = '''So every survivor has to be able to reach the new host directly at that address, and the new host them: on a LAN each machine's own address. A machine that can't reach the best-ranked survivor follows the best one it can, and the match can split (see The machine that's cut off). for the split.'''

[[topic.rule]]
id = "original-host-gone-closed"
tags = ["data"]
text = '''A game whose original host has gone is no longer open to join: "Since the original host has left, the game is no longer public." (`staging_not_original_host`).'''

[[topic]]
title = "Disagreement between machines"

[[topic.rule]]
id = "running-checksum"
tags = ["code"]
text = '''Every machine keeps a running checksum of its match. It isn't a hash of the world taken at intervals: each time the simulation passes certain points it folds one value into the sum (checksum = checksum x 37 + value, kept to 16 bits) and counts it. Values folded in include the random number generator's state each time it's used in several places, the id, position and creation time of each thing created, unit steering, game time at each step, the next-id counters, and the kind and size of every order applied.'''

[[topic.rule]]
id = "checksum-reports"
tags = ["code"]
text = '''Once a second (every 16 steps) each client reports its count and checksum to the host, as an order like any other. The host compares the report with its own checksum at the same count, which it can do although it's further ahead because it keeps a window of past values.'''

[[topic.rule]]
id = "out-of-sync"
tags = ["code"]
text = '''On a mismatch the host marks that player Out of Sync, and, unless another player is already out of sync, tells every machine, each of which writes its recent history of folded values (with a label for each) to a log file so the two can be compared afterwards.'''

[[topic.rule]]
id = "out-of-sync-holds"
tags = ["code"]
text = '''Nothing is corrected or resent. Being Out of Sync holds the match like being lost (see Slow and lagging players): it stays held until the others vote the player out and their allowance runs out, when they're dropped. Players can also vote to kick them.'''

[[topic.rule]]
id = "host-checksum-recorded"
tags = ["code"]
text = '''The host also records its own checksum once a second in the stream of orders, which is what lets a film detect that playback has diverged (below).'''

[[topic]]
title = "Pause, speed, chat, votes"

[[topic.rule]]
id = "multiplayer-pause"
tags = ["code", "data", "guess"]
text = '''
Pause, in multiplayer:
- Pausing and unpausing are orders, applied by every machine at the same step, so every line below is posted on every machine, observers' included, as `GENERIC_EVENT`.
- The pause key (`gamepause`, bound to Pause) and the control panel's pause button toggle: when the game isn't paused they ask to pause, when it is they ask to unpause, which for anyone but the pauser is a vote (below). `gamepause 1` and `gamepause 0` ask for one or the other, and asking for the state the game is already in does nothing.
- Only a person with a side can pause or unpause. An observer's pause key does nothing: no order, no line, no sound. A player whose side is defeated keeps it, and so keeps pausing and voting, until they choose Observe; resigning takes it at once (see [outcome](outcome.toml)).
- Pausing posts "%s has paused the game" (the pauser's name). Then, if three or more people are in the session, "Votes needed to unpause %d, current votes %d" follows at once: the votes needed, then the votes already standing (usually 0; see below for when earlier votes are kept).
- The pauser can unpause at any time: "%s has unpaused the game".
- People in the session, for the three-person test: everyone who isn't a computer player, observers included, sides or not.
- With fewer than three people, only the pauser can unpause. Anyone else's unpause does nothing and shows nothing.
- With three or more, anyone else's unpause is a vote and posts "%s votes to unpause the game (%d/%d)" (voter, votes now, votes needed). Asking again takes the vote back: "%s has retracted vote to unpause (%d/%d)", same values. Each press flips that player's vote.
- Votes needed: half the people with sides, rounded down, plus one. Votes now: the people with sides who have voted. Computer players don't count and never vote. The pauser counts towards the number needed but never has a vote, since their own unpause just unpauses. So with three players with sides both others must vote, with four all three others, with five three of the four. An observer's earlier vote stops counting once they have no side.
- Once votes now reach votes needed (checked after each press, a vote taken back included) the game unpauses at once: "Game unpaused". All votes are cleared.
- A consequence: with three or more people but too few of them holding sides (two players and an observer, say), the vote can never succeed, and only the pauser can unpause.
- The pauser whose pause was voted down can't pause for 5 minutes after the vote: their pause posts "%s attempted to pause but failed due to recent votes" and the game stays running. Anyone else may pause in that time.
- Votes are cleared when a pause begins, except when the same player who last ended a pause themself pauses again within 5 minutes of that unpause: then the votes given during their earlier pause still stand, and the "Votes needed" line shows them. Even if they already reach the number needed, the game unpauses only at the next vote or vote taken back. Votes aren't cleared by the pauser's own unpause.
- Both 5-minute periods are real time, unaffected by pause and game speed, and they keep running through holds. Each machine times them on its own clock, so right at the 5-minute mark two machines can disagree about the outcome.
- If the pauser leaves while the game is paused (quits, is dropped or is kicked), the game unpauses at once, with no line of its own (the leave line is all that's posted). Their votes go with them; the others' votes are cleared by the next pause, since the leaver can't be the one pausing again.
- If the pauser loses their side while paused (resigning or choosing Observe), they can no longer unpause. With three or more people the others can still vote, counting against the reduced number of sides; with fewer, nothing short of the pauser leaving unpauses the game.
- A hold for a slow or lost player doesn't change the pause: the match stays paused or running as it was, and pause orders given during the hold take effect when stepping resumes, like any order.
- The pause key is part of the match's key bindings, so it does nothing on the multiplayer loading screen.
'''

[[topic.rule]]
id = "single-player-pause"
tags = ["code"]
text = '''Single-player has no lines and no limits: the pause key toggles (see Single-player).'''

[[topic.rule]]
id = "game-speed-range"
tags = ["code", "data"]
text = '''Game speed is the host's alone to change, and not during a cutscene. It runs from `GameSpeedMin` to `GameSpeedMax` (stock -2 to +2: 25% to 400%), and every player is told: "Game speed changed to %.0f%%".'''

[[topic.rule]]
id = "speed-steps"
tags = ["code"]
text = '''Speed up and speed down first round `GameSpeed` to the nearest half, then add or take 0.5, then keep it within the limits; so each press moves by a factor of about 1.41, two presses double or halve it, and stock speeds run from -2 to +2 in nine steps. Each change of value posts the message.'''

[[topic.rule]]
id = "speed-keys"
tags = ["code", "data"]
text = '''The speed keys (`SpeedUp` on plus, `SpeedDown` on minus, in `hotkeys_core.txt`) and the control panel's speed buttons step speed this way. `GameSpeed` (bound to backslash) sets `GameSpeed` to the value given, kept within the limits; with no value, as the binding has it, it sets 0, normal speed (100%).'''

[[topic.rule]]
id = "speed-host-only"
tags = ["code"]
text = '''Any machine sends these orders, but only the host's take effect. A non-host's press changes nothing and shows nothing: no line and no refusal sound.'''

[[topic.rule]]
id = "speed-change-while-paused"
tags = ["code"]
text = '''A speed change while paused takes effect at once, and its line is posted at once; the new speed shows when play resumes.'''

[[topic.rule]]
id = "chat-channels"
tags = ["code"]
text = '''Chat is public, to the team, or private to one player, and is an order through the host like everything else, in the lobby and in the match. In a match: see Chat in a match.'''

[[topic.rule]]
id = "resign-orders"
tags = []
text = '''Resigning and the team's vote to resign are orders: see [outcome](outcome.toml).'''

[[topic.rule]]
id = "kicking"
tags = ["code", "data"]
text = '''Kicking: in the lobby the host removes a player outright (see Kicking and banning; banning is for internet games only). In a match there's no outright kick, only a vote.'''

[[topic.rule]]
id = "vote-kick"
tags = ["code"]
text = '''
The vote to kick, in a match:
- Its target is a person: the human player of some machine, the host's own player included. Computer players can't be targeted.
- Votes belong to machines, not sides: each machine has at most one vote against each other player, and a machine gives the orders of only one person, so one person, one vote. Computer players never vote.
- A machine can cast a vote whether or not its player has a side, but only votes from machines whose player has a side count. In the dialog the toggle only works for a player with a side.
- Casting a vote posts "%s has voted to kick %s (%d/%d)" and taking it back posts "%s has retracted vote to kick %s (%d/%d)" (voter, target, votes now, votes needed). Like every vote line these go to every machine, the target's and observers' included (`GENERIC_EVENT`).
- Needed: more than half of the players with sides (half, rounded down, plus one), the target among them. It's worked out afresh each time it's checked, from who has a side then.
- It's checked after every vote cast or taken back, and against every player after anyone leaves the match (quitting, being kicked or dropped). So votes already cast can carry a kick once the count needed falls, but only at one of those moments; nothing else, not a side losing, triggers a check.
- Taking a vote back removes that vote only. Votes stand otherwise, through holds (a vote given during a hold takes effect when stepping resumes, like any order), until the voter leaves (its votes go with it) or the target goes (every vote against them is cleared).
- A player whose side is defeated keeps it, and so keeps counting, until they choose Observe on the defeat message: that takes their side away, so from then on their votes don't count and they drop out of the count needed (from the next check). Resigning takes the side away at once (see [outcome](outcome.toml)).
- When the count is reached the target is removed at once: "Player %s was kicked from the game" on every other machine, and a computer player takes the side (see Leaving).
'''

[[topic.rule]]
id = "kicked-machine"
tags = ["code", "guess"]
text = '''
The kicked machine:
- Its own line reads "You were kicked from the game", and every other player vanishes from its view without a line, each side taken over by a computer player.
- A client is also told by the host, which brings up a message box with "You were kicked from the game" (`networking_disconnect_kicked`) whose OK leaves the session for the menus. for where it lands.
- It can't come back: a match under way refuses joins ("Game is already in progress").
'''

[[topic.rule]]
id = "host-player-kicked"
tags = ["code"]
text = '''
If the host's own player is kicked, the match breaks:
- The host machine sees the above but gets no message box (no one tells it), and plays on alone as host of its own match against computer players.
- The others see "Player %s was kicked from the game" for the host and cut their link to it, but nothing takes its place: no one takes over as host, there's no hold, and the connection dialog doesn't open by itself. The host stops sending to them and ignores what they send.
- So their match freezes at the last step they received, for good. Chat goes nowhere. Each can only leave from the game menu.
'''

[[topic.rule]]
id = "saving-host-only"
tags = ["code"]
text = '''Saving is the host's alone. Every machine freezes while the host writes the file, and the others see "The host is saving the game."; only the host ends up with the save.'''

[[topic.rule]]
id = "observers"
tags = ["code", "data"]
text = '''A player who has lost can stay as an observer, and the lobby can allow observers from the start; observers have their own chat filter.'''

[[topic]]
title = "Chat in a match"

[[topic]]
title = "The chat bar"
under = "Chat in a match"

[[topic.rule]]
id = "chat-bar"
tags = ["data"]
text = '''`UI/Game/chat_panel.tgi`: a filter dropdown, an edit box of at most `max_characters` (stock 128) and Send, at the bottom middle of the screen (stock at 318, 496, 461 wide, at 1024 by 768). It's hidden until opened.'''

[[topic.rule]]
id = "chat-bar-keys"
tags = ["code", "data"]
text = '''Enter on the map opens it (`ChatActivate`, `Localization/Hotkeys/ hotkeys_ui.txt`), and Enter again while it's open closes it. In the edit box, Enter sends (`ChatSend`), PageUp and PageDown step the filter back and forward (wrapping round), and Up and Down recall earlier lines. Escape isn't bound to close it: the stock line is commented out.'''

[[topic.rule]]
id = "sending-closes-bar"
tags = ["code"]
text = '''Sending closes the bar.'''

[[topic.rule]]
id = "chat-bar-takes-keys"
tags = ["code", "guess"]
text = '''While the bar is open, keys go to the edit box, so the map's hotkeys don't act on them.'''

[[topic.rule]]
id = "chat-in-single-player"
tags = ["code", "guess"]
text = '''Nothing limits it to multiplayer: in single-player it opens and sends the same way, and the only one to hear is the player.'''

[[topic]]
title = "Who hears what"
under = "Chat in a match"

[[topic.rule]]
id = "chat-filter-choices"
tags = ["code", "data"]
text = '''The dropdown offers, for a player with a side: "All", "Allies", then the name of each other side that a person holds (computer-run sides aren't offered). For an observer (no side): "All" and "Observers" only.'''

[[topic.rule]]
id = "chat-filter-default"
tags = ["code"]
text = '''It keeps the last choice while that's still on offer. With none yet, it starts on "Allies" when the player has at least one ally among the other sides, otherwise "All".'''

[[topic.rule]]
id = "all-chat"
tags = ["code"]
text = '''All: every machine shows it, observers' included, from anyone, players and observers alike.'''

[[topic.rule]]
id = "team-chat"
tags = ["code"]
text = '''Allies and Observers are one channel, team chat. A machine shows it when its player's side and the sender's are allied (the sender's own side counts), or when neither has a side. So Allies reaches the sender's allies and not observers, and Observers reaches only observers.'''

[[topic.rule]]
id = "whisper"
tags = ["code", "data"]
text = '''A side's name in the dropdown whispers to the person holding it. Only their machine shows it; the sender sees their own line at once, as "Whispering to %s: %s" (`ui_lobby_whispering_to`, `CHAT_PRIVATE`), rather than the usual line. In a match a whisper between a player with a side and an observer isn't shown at all.'''

[[topic.rule]]
id = "whisper-problems"
tags = ["code", "data"]
text = '''
Whisper problems, each a warning line (`GENERIC_WARNING`) and nothing sent:
- The chosen side no longer exists: "The person you were attempting to chat with was not found" (`private_chat_warning_unrecognized_chat_target`).
- It exists but no person holds it any more (their player left and a computer took over): "%s is not a valid chat target" (`private_chat_warning_bad_kingdom`).
- The same two warnings come up if the dropdown's saved choice has gone when the list is next rebuilt, and the bar then closes.
'''

[[topic.rule]]
id = "chat-lines"
tags = []
text = '''The lines themselves (their format, colours, kinds and the chat sound) are in [messages](messages.toml).'''

[[topic]]
title = "How it travels"
under = "Chat in a match"

[[topic.rule]]
id = "chat-as-orders"
tags = ["code"]
text = '''The chat bar's three kinds are ordinary orders: through the host, into a step, recorded in films and so shown again when one is played back. Like any order a line takes a round trip to the host to arrive, and during a hold it waits until stepping resumes.'''

[[topic.rule]]
id = "connection-dialog-chat-path"
tags = ["code"]
text = '''The connection dialog's chat panel is separate (see The connection dialog): its edit box always sends to everyone, by the hold's own path, so it arrives at once, hold or not, isn't part of any step and isn't in films. It posts the plain "%s: %s" line (`public_chat`) as `GENERIC_EVENT`, uncoloured and without the chat sound.'''

[[topic.rule]]
id = "connection-dialog-message-log"
tags = ["code"]
text = '''The dialog's message log is the player's ordinary message log shown again (every kind of line, chat bar and dialog chat alike), without fading, up to `MessageLogMaximumLines`. So it's one conversation, seen from both places.'''

[[topic]]
title = "The LAN screen"
intro = '''Multiplayer > LAN (`UI/Menus/lobby.tgi`, shared with the internet lobby, whose room list, chat, Quick and Stats are internet only).'''

[[topic.rule]]
id = "lan-screen-buttons"
tags = ["code", "data", "guess"]
text = '''Under the game list are Refresh and Game Info; beside it Create, Join, Join Direct, Options and Exit. Exit asks "Exit Lobby?" (`ui_lobby_confirm_exit`) and goes back to the multiplayer menu.'''

[[topic.rule]]
id = "lan-screen-entering"
tags = ["code"]
text = '''On entering, the nickname prompt comes up if the player has never set one (see Player names), and the list is searched for at once.'''

[[topic.rule]]
id = "game-list-columns"
tags = ["code", "data"]
text = '''Columns, each with a header tooltip: a password column (tooltip "Password"), "Game Name", "Players" ("Num Players / Max Num Players"), "Ping", "Map Name". Clicking a header sorts by that column. Each field is cut to its column's width.'''

[[topic.rule]]
id = "game-list-row"
tags = ["code", "data"]
text = '''
A row shows:
- A lock glyph (`ch_passworded`) in the password column if the game has a password, otherwise nothing.
- The game's name, coloured by its state: `ServerBrowserServerColorStaging` (stock white) while its host is in the lobby, `ServerBrowserServerColorPlaying` (stock grey 0.6) once its match is under way, `ServerBrowserServerColorIncompatible` (stock red 1, 0.2, 0.2) when its version differs from the player's.
- "%d/%d": people in the game, then its most players, in white. A full game looks like any other open one; only this column shows it's full.
- Ping as a glyph alone, no number: green below `ServerBrowserLowPingCutoff` (200 ms), yellow below `ServerBrowserMediumPingCutoff` (500), red otherwise (the `PingIcon*GlyphInfo` glyphs).
- The map's name, in white.
'''

[[topic.rule]]
id = "finding-games"
tags = ["code"]
text = '''Finding games: a host advertises its game on the local network and answers queries on `GameSpyQueryPort` (8850); the LAN screen broadcasts a query and lists the answers. A host reports its game's name, people and most players, whether it has a password, the map and its size, its version, whether it's in the lobby, playing or closing, what's being played (map, saved game, random map or film), the elapsed game time, the world rules, locale and language, the team setup, whether observers are allowed, whether it's an internet game, and its players' names. A game that reports it's closing, or a most players of 0 or less, is taken off the list.'''

[[topic.rule]]
id = "game-list-refresh"
tags = ["code"]
text = '''
The list searches again by itself `GameSpyLANLobbyRefreshTime` (stock
15) seconds after the last search ended, unless the player is joining a game. That search keeps the rows, updating each game that answers in place and dropping those that don't. Refresh stops any search under way, empties the list and searches afresh.
'''

[[topic.rule]]
id = "game-info"
tags = ["code", "data", "guess"]
text = '''
Game Info (or right-clicking a row, which selects it first) asks the selected game for its details and opens `UI/Menus/server_info_dialog.tgi`, with Close and three panels; with nothing selected it does nothing.
- Main: game name, ping in ms, status ("Open", "Closed" while playing, "Incompatible", `ui_server_info_status_*`), version, map and map size, players "%d/%d", the mod if any, game time as h:mm:ss, locale, language, team setup, "Password: Required" only if it has one, and Allow Observers only if it allows them. Labels are the `server_info_dialog_text_*` strings.
- World Rules: each rule and its value ("true"/"false" for flags).
- Players: each player's name, a line each.
'''

[[topic.rule]]
id = "selecting-joining-game"
tags = ["code", "data"]
text = '''A click selects a row. Join with a game selected joins it; with none it shows an OK box "Please choose a game to connect to" (`ui_lobby_select_server`). Double-click selects and joins. The screen doesn't stop a join to a game that's playing or incompatible: its host refuses it (below).'''

[[topic]]
title = "Joining a game"

[[topic.rule]]
id = "joining-box"
tags = ["code", "data"]
text = '''While joining, a box shows "Joining '%s', please wait ..." and under it "Timeout in %d seconds", counting down from `JoinTimeout` (stock 60), with Cancel, which gives up the join. %s is the game's name from the list, or for Join Direct (and a retry with a password) the address typed; a listed game without a name shows its address as "a.b.c.d:port". What happens when the count reaches 0 isn't settled (see Open questions).'''

[[topic.rule]]
id = "join-request"
tags = ["code"]
text = '''A joining machine sends its person's LAN nickname, the password (empty on the first try), its version, and checksums of its game archives and of its data. On success the box closes and the joiner is on the multiplayer lobby screen. A name already in use gets a number after it (see Player names).'''

[[topic.rule]]
id = "join-direct"
tags = ["code", "data"]
text = '''Join Direct opens `UI/Menus/join_direct_dialog.tgi`: an "IP Address" box (up to 512 characters), a "Port" box (digits only, up to 5), Join and Cancel; Enter in either box joins. They start with the last address and port joined directly, the port `HostPortDefault` (7290) if none yet, and both are remembered with the player's preferences when a join starts.'''

[[topic.rule]]
id = "join-direct-address"
tags = ["code", "data"]
text = '''The address may be a host name or a dotted address. Join closes the dialog and shows "Resolving address for %s" (`ui_lobby_join_direct_resolve`) with Cancel while the name is looked up; if that fails, an OK box "Could not resolve %s to an IP address" (`ui_lobby_join_direct_failed`) leaves the player on the LAN screen. Otherwise the join goes ahead as above.'''

[[topic]]
title = "Passwords"
under = "Joining a game"

[[topic.rule]]
id = "password-prompt"
tags = ["code", "data", "guess"]
text = '''The first try always sends no password. If the game has one, the host refuses it and the joiner is asked for it: a prompt "Enter Game Password" (`networking_disconnect_prompt_password`) with an edit box, OK and Cancel. OK tries again with what was typed, showing the joining box again. A wrong one brings the prompt back as "Incorrect Game Password. Enter Game Password" (`networking_disconnect_prompt_incorrect_password`), as often as it takes. Cancel closes the prompt, leaving the player on the LAN screen. A fresh join (Join, double-click, Join Direct) starts again with the first wording.'''

[[topic.rule]]
id = "password-match"
tags = ["code"]
text = '''The match is exact, case included. A game with no password accepts any.'''

[[topic]]
title = "Refusals"
under = "Joining a game"

[[topic.rule]]
id = "join-refusals"
tags = ["code", "data"]
text = '''
The host checks a joiner in this order and refuses at the first that fails, each with its line:
1. The game's original host has gone: "Cannot join a game where the current host is different from the original host".
2. An internet game joined from the LAN screen, or the reverse: "Cannot join internet games from LAN lobby".
3. Its match is under way or its launch countdown is running: "Game is already in progress".
4. A different version or build: "Incorrect Version".
5. A wrong or missing password: the password prompt above, not a line.
6. Banned: "You are currently banned from this game". Only internet games check this, so a LAN game never turns anyone away as banned.
7. Different game archives: "Bad Depot Checksums - Versions Incompatible".
8. A mod the joiner lacks: "The game is using a mod you do not have".
9. Different data: "Bad Data Checksums - Versions Incompatible".
10. Then, as the join is taken in: "Game is full". Full is when the people in the game (observers counted, computer players not) have reached its most players, or when observers aren't allowed and no open side slot is left for the newcomer.
'''

[[topic.rule]]
id = "join-refusal-box"
tags = ["code", "guess"]
text = '''Each refusal but the password reaches the joiner as an OK box with its line, in place of the joining box; OK leaves them on the LAN screen.'''

[[topic]]
title = "Creating a game"

[[topic.rule]]
id = "create-game-dialog"
tags = ["data"]
text = '''Create opens `UI/Menus/create_game_dialog.tgi`: Game Name and Password boxes (up to 512 characters each), a Max Players dropdown, an Observers toggle, Create and Cancel.'''

[[topic.rule]]
id = "create-game-defaults"
tags = ["code"]
text = '''
Each starts as last chosen, kept with the player's preferences:
- Game Name: the name last entered, or else "%s's Game" with the player's nickname (`ui_lobby_default_game_name`). A name left at that default isn't kept, so it follows later nickname changes, and a name left empty becomes the default.
- Password: the last one entered (stock none).
- Max Players: `MultiplayerMinNumPlayers` to `MultiplayerMaxNumPlayers` (2 to 12), stock 2. The connection type doesn't shorten the list.
- Observers: stock on.
'''

[[topic.rule]]
id = "create-hosts-game"
tags = ["code"]
text = '''Create hosts the game and takes the player to the multiplayer lobby as its host.'''

[[topic.rule]]
id = "host-port"
tags = ["code", "data"]
text = '''The host listens on `HostPortDefault` (7290), or if that's taken the next free port, trying `NetworkNumPortsToTry` (10) in all, so a second game on one machine is on 7291 (the LAN list carries each game's port; Join Direct must name it). If none is free, "Unable to bind to port %d" (`networking_unable_to_bind`, naming the first) and no game is made.'''

[[topic]]
title = "The multiplayer lobby"
intro = '''The staging screen (`UI/Menus/staging.tgi`) where people gather before a match.'''

[[topic.rule]]
id = "lobby-orders"
tags = ["code"]
text = '''Everything in the lobby is an order through the host, applied on every machine, so all see the same lobby: what to play (a map, a saved game, a film or a random map and its settings), each player's side, team, nation and colour, ready or not, computer players and their handicaps, renames. The host's choices are the host's alone; a player's own choices are theirs.'''

[[topic.rule]]
id = "joining-lobby"
tags = ["code", "data"]
text = '''What the host chose on creating the game can be changed here (see Who controls what). Someone joining posts "%s has joined the game" on every machine (`networking_player_joined`, `PLAYER_JOINLEAVE`).'''

[[topic.rule]]
id = "lobby-same-as-custom-game"
tags = ["code"]
text = '''It's the same screen as the single-player custom game. What differs is whether the game is multiplayer and whether the player is its host; in single-player the one person is the host, with every host control.'''

[[topic.rule]]
id = "multiplayer-only-lobby-items"
tags = ["code", "data"]
text = '''Only in multiplayer: the game's name, "%d/%d Players" (`staging_players_label`), the lock when the game has a password (tooltip "Game is password protected"), and the ping marks on slots. The players label counts people (observers included, computer players not) out of the most players; with observers off, the second number drops to the people present plus the sides still free, if that's fewer.'''

[[topic]]
title = "Who controls what"
under = "The multiplayer lobby"

[[topic.rule]]
id = "host-only-settings"
tags = ["code", "data"]
text = '''
The host's alone (greyed out or hidden for everyone else, and refused by the host if sent anyway):
- What to play: the Scenario Map, Saved Game, Film and Random Map buttons, greyed for others.
- The Teams dropdown ("Select Team Structure"; its Custom entry opens the team management dialog), greyed for others.
- Game Settings (the action panel's button, and clicking the game's name): it opens the multiplayer options (game name, password, most players, observers, as when creating the game) for the host in multiplayer only, and does nothing for anyone else. Turning observers off moves no one who's observing, and lowering the most players removes no one.
- Launch and Abort, in place of the Ready toggle (see Ready).
- Kick on the slots, and in an internet game Ban (see Kicking and banning).
'''

[[topic.rule]]
id = "slot-settings-owner"
tags = ["code", "guess"]
text = '''A slot's nation, general and (for a computer player) handicap are set by the machine its player belongs to: each person sets their own, and the host the computer players it added. The dropdowns show on every slot in use, but a choice on a slot that isn't the player's own is never sent.'''

[[topic.rule]]
id = "slot-dropdowns"
tags = ["code"]
text = '''A dropdown shows only when there's a choice: where the map fixes a side's nation or general, the slot shows it as text. The nation list is "Random" and then every playable nation.'''

[[topic.rule]]
id = "handicap-computer-only"
tags = ["code"]
text = '''Handicap is offered only on computer players' slots, and not for a saved game or a film; people have no handicap in the lobby.'''

[[topic.rule]]
id = "slot-colour-team"
tags = ["code"]
text = '''There's no colour control: each side's colour is the map's, shown as a coloured mark at the start of its slot. A slot's team is the team it's listed under (see Moving).'''

[[topic.rule]]
id = "film-slots-fixed"
tags = ["code"]
text = '''Nothing on a slot can be changed when a film is chosen.'''

[[topic.rule]]
id = "lobby-refusals"
tags = ["code", "data"]
text = '''A refusal shows only on the machine that asked, as an error line: "Session Order Failed", "Set Player Side Failed", "Set Side Nation Failed", "Set Side General Failed", "Set Max Players Failed", "Set Allow Observers Failed", "Set Game Name Failed", "Set Game Password Failed", and during the countdown "Cannot issue command while launch is counting down".'''

[[topic]]
title = "Slots"
under = "The multiplayer lobby"

[[topic.rule]]
id = "slot-list"
tags = ["code", "data"]
text = '''Slots are listed under a header row for each of the map's teams, sides without a team under "Independent", then one row per observing person; there are no empty observer rows.'''

[[topic.rule]]
id = "empty-slot"
tags = ["code", "data"]
text = '''An empty slot reads "Open" or "Closed", or "Open (Required)" and "Closed (Required)" when the map requires that side. Closed is the map's setting for that side; the lobby doesn't open or close slots.'''

[[topic.rule]]
id = "person-slot"
tags = ["code", "data"]
text = '''
A person's slot shows their name, the side's colour mark, nation and general, and:
- In multiplayer a ping mark: a green, yellow or red icon only, by the same cutoffs as the connection dialog (200 and 500 ms); its tooltip "Ping: %d" gives the milliseconds. It's the host's measure, so the host's slot is always green. Observers' rows have one too.
- A ready mark on every person's slot but the host's, which shows the host icon ("Game Host") instead. Observers have no ready mark.
- While a file is being sent to that person, "%d%%" in place of the ready mark (see Changing what's played and sending files).
- The swap mark ("Slot Swap Offer Pending") while that person and the viewer have a swap offer between them.
'''

[[topic.rule]]
id = "computer-player-slot"
tags = ["code", "data"]
text = '''A computer player's slot shows, on the machine it belongs to, its profile dropdown in place of a name; elsewhere its name, as "%s (%s)" with the person whose machine it belongs to (`staging_ainame_clientname`). It has no ping, ready mark or host icon.'''

[[topic]]
title = "Computer players in the lobby"
under = "The multiplayer lobby"

[[topic.rule]]
id = "adding-computer-player"
tags = ["code"]
text = '''An empty open slot's name is a dropdown: "Open", "Random", then the computer player profiles. Picking a profile adds a computer player there; "Random" adds one whose profile is left to launch (see Choosing a profile at launch). On a computer player's slot, on the machine it belongs to, the same dropdown changes its profile, or with "Open" removes it. Changing the profile replaces the computer player with a new one in the same slot.'''

[[topic.rule]]
id = "profile-sets-nation-general"
tags = ["code", "guess"]
text = '''Picking a profile also sets the slot's nation and general to the profile's: the first `[Nation]` and the first `[Faction]` it lists. Picking "Random" sets both back to "Random", whatever they were before; nothing remembers the slot's earlier choice. Where the map fixes the side's nation or general, the map's stays (see Which sides have a general in [special operations](special-ops.toml)).'''

[[topic.rule]]
id = "computer-player-nation-general"
tags = ["code"]
text = '''The nation and general dropdowns stay open after a profile is picked. On the computer player's own machine, the entries its profile doesn't list (and "Random", when any entry is unlisted) are drawn in red, but they can still be chosen: the computer player then keeps its profile and plays the nation and general it was given. A computer player on "Random" has no red entries.'''

[[topic.rule]]
id = "guest-computer-players"
tags = ["code", "game"]
text = '''Any person, not only the host, gets that dropdown on open slots, and a computer player they add belongs to their machine: they can change and remove it, it thinks on their machine, and it goes when they leave.'''

[[topic.rule]]
id = "computer-player-open-slots-only"
tags = ["code"]
text = '''Only open slots offer it, so a computer player never goes in a closed slot from the lobby. Adding is refused during the countdown.'''

[[topic]]
title = "The slot action panel"
under = "The multiplayer lobby"

[[topic.rule]]
id = "slot-action-panel"
tags = ["code", "data", "guess"]
text = '''
A row of buttons beside a slot offers what the viewer may do there:
- Name ("Change player name"): on their own slot or observer row, in a LAN game only; it prompts "Change Name" (see Player names).
- Kick: the host, on any other person's slot or any computer player's.
- Ban: the host, in an internet game, on another person's slot.
- Whisper: on another person's slot or observer row (see Lobby chat).
- Swap ("Switch to this slot"): on an empty open slot, for anyone, observers too.
- Observer ("Switch to observer"): on their own slot while they have a side, if observers are allowed.
- Swap ("Offer to swap slots with player") on another person's slot, becoming Cancel ("Cancel offer to swap slots") once offered; Accept and Reject there when that person has offered to them.
- Swap ("Swap slots with AI player"): on a computer player's slot that belongs to their machine.
- The offer buttons also show to a joined player on a computer player's slot that isn't theirs; nothing ever answers such an offer.
'''

[[topic.rule]]
id = "team-header-buttons"
tags = ["code", "data"]
text = '''Each team's header has Join Team ("Switch to this team"), greyed unless the team has an open side nobody holds and the viewer isn't already on it. On the observers' header it's enabled while the viewer has a side.'''

[[topic]]
title = "Moving"
under = "The multiplayer lobby"

[[topic.rule]]
id = "swap-join-team"
tags = ["code"]
text = '''Swap on an empty open slot moves the viewer there, from a side or from observing. Join Team moves them to that team's first open side nobody holds; only their own machine can do that, not the host. Observer (or Join Team on the observers' header) takes them off their side, only while observers are allowed.'''

[[topic.rule]]
id = "dragging-slots"
tags = ["code"]
text = '''Dragging: a person can drag their own slot (the host also a computer player's it owns) onto an empty open slot to move there, onto a team's header to join that team, or onto another slot of their machine's to swap the two.'''

[[topic.rule]]
id = "swap-offer"
tags = ["code"]
text = '''Swapping with another person is by offer. Offer marks it on both their screens; the other's Accept swaps them at once; their Reject or the offerer's Cancel withdraws it. Two people offering to each other just leaves both offers standing until one accepts. Swap with AI trades places with a computer player of their own machine at once.'''

[[topic.rule]]
id = "swap-what-moves"
tags = ["code"]
text = '''A swap trades the two players' places, and each takes their nation and general along; the side's team, colour and handicap stay with the slot. All offers to and from both are cleared.'''

[[topic.rule]]
id = "side-reset-when-left"
tags = ["code"]
text = '''When a person leaves a side that nobody else then holds, its nation and general go back to unchosen and its handicap to none. A person taking a side clears its handicap; a computer player keeps the handicap of the side it came from.'''

[[topic.rule]]
id = "putting-player-in-side"
tags = ["code", "data"]
text = '''A player can be put in a side by the host or by their own machine, if nobody holds it and, for a person, the map lets people take it; otherwise "Set Player Side Failed" on the machine that asked. Every move is refused during the countdown.'''

[[topic]]
title = "Ready"
under = "The multiplayer lobby"

[[topic.rule]]
id = "ready-toggle"
tags = ["code", "data"]
text = '''Ready belongs to each person, set with the Ready toggle ("Ready", tooltip "Change Ready Status"); each press flips it. Only the person's own machine can set it ("Set Player Ready Failed" otherwise). The toggle shows the state by its pressed look; it keeps the text "Ready" (the `ready_label` and `not_ready_label` strings are unused).'''

[[topic.rule]]
id = "host-launch-abort"
tags = ["code"]
text = '''The host has no Ready toggle: Launch is in its place, and Abort while the countdown runs. Everyone else has the toggle and no Launch or Abort.'''

[[topic.rule]]
id = "always-ready"
tags = ["code"]
text = '''The host and every computer player are always ready. An observer counts as ready, and their toggle is greyed out.'''

[[topic.rule]]
id = "ready-for-launch"
tags = ["code"]
text = '''Ready as launching tests it is the mark and, when what's chosen needs a file (a map, saved game or film), holding the host's copy of it, by checksum. So someone marked ready whose copy is missing, still arriving or can't be sent counts as not ready, and their slot's ready mark shows so. For a random map their random-map data has to match the host's.'''

[[topic.rule]]
id = "ready-cleared"
tags = ["code"]
text = '''Nothing in the lobby clears the mark: not the host changing what's played, the team setup or any slot, nor a player moving. It's cleared, for every person, only when everyone comes back to the lobby after a match. A change of map still leaves people not ready in effect until they hold the new file.'''

[[topic.rule]]
id = "auto-ready"
tags = ["data"]
text = '''The auto-ready option behind `StagingSetAutoReady` has no control in the stock interface (its toggle is commented out of `staging.tgi`).'''

[[topic]]
title = "Launch and the countdown"
under = "The multiplayer lobby"

[[topic.rule]]
id = "launch"
tags = ["code", "data"]
text = '''
Launch is the host's. Pressing it:
- For a random map with more players in slots than the map recommends, first a box "Number of players exceeds map recommendation.  Map may fail to generate.  Continue anyway?" (`ui_staging_recommended_num_players_message_box`, button "Continue").
- While a countdown runs, it does nothing.
- If anyone isn't ready, there's no countdown: that press is the "ask everyone to become ready", and there's no other control for it. Every machine posts a line. The host: "Requesting that all players become ready." (`host_requested_players_ready`, `GENERIC_EVENT`), then for each person whose machine lacks the file, "%s does not have %s. File cannot be transferred." (person, file; for a film "%s does not have the source file for %s. File cannot be transferred.") as warnings, whether or not the file is on its way. Everyone else, by their own state: "Host has requested that all players become ready." if ready or holding the file (`GENERIC_EVENT`); "Host has requested that all players become ready. You must wait until the file transfer is complete." while their file is still coming; "Host has requested that all players become ready. You do not have the file and cannot select ready." if it can't be sent (both warnings). Observers count as ready and get the plain line.
- If everyone is ready, every machine posts "Beginning Launch Countdown" (`launch_countdown_begin`, `GENERIC_EVENT`) and the countdown starts.
'''

[[topic.rule]]
id = "launch-countdown"
tags = ["code", "data"]
text = '''The countdown lasts `LaunchCountdownTime` seconds (stock 5). Every machine posts each number as a `GENERIC_EVENT` line, "5" at once and then "4" to "1" a second apart by the host's clock; when it would reach 0 the match launches, with no "0" line. The lines appear in the lobby's message log.'''

[[topic.rule]]
id = "countdown-abort"
tags = ["code", "data"]
text = '''Abort (host only) stops it, and every machine posts "Launch Countdown Aborted" (`launch_countdown_abort`). It stops by itself, with the same line, when anyone stops counting as ready (un-readying, someone joining who isn't ready, a file going missing), when a hold starts (see The hold), or when anyone leaves, is kicked or dropped.'''

[[topic.rule]]
id = "changes-during-countdown"
tags = ["code", "data"]
text = '''While it runs, lobby changes are refused to whoever tried, with "Cannot issue command while launch is counting down" (`session_order_rejected_currently_counting_down`): choosing what to play, changing slots, kicking, banning and the other settings. Ready isn't refused (and so un-readying stops it). Joins are refused too ("Game is already in progress").'''

[[topic]]
title = "Changing what's played and sending files"
under = "The multiplayer lobby"

[[topic.rule]]
id = "choosing-what-to-play"
tags = ["code"]
text = '''The host chooses a map, saved game, film or random map. Every machine checks its own copy against the host's checksum and reports what it found.'''

[[topic.rule]]
id = "file-transfer"
tags = ["code", "data"]
text = '''A machine without the file (a map, saved game or film) is sent it by the host. While it arrives, that person's slot shows the share received, "%d%%" (`staging_percent_downloaded`, tooltip "File Transfer Progress"), where the ready mark goes, and everyone sees it.'''

[[topic.rule]]
id = "different-copy-overwrite"
tags = ["code", "data"]
text = '''A machine with a different copy is asked "A different version of this map exists - overwrite it?" (`overwrite_map_confirm`), with "Overwrite", which deletes its copy and has the host send its own, and "Leave Game", which leaves the lobby as Exit does. A file whose name contains ".." gets neither: nothing is asked and nothing sent.'''

[[topic.rule]]
id = "files-never-sent"
tags = ["code", "data"]
text = '''
Some things are never sent:
- A film's source map: every machine must already have it. Missing or different: "Source map for film '%s' missing. File cannot be transferred."
- Random-map data: "You do not have %s. File cannot be transferred.", or "Your version of %s is different from the host's version. File cannot be transferred."
- Those lines are warnings on that machine; the host gets "%s does not have %s. File cannot be transferred." (for a film "%s does not have the source file for %s. File cannot be transferred."). That person can't count as ready while the choice stands.
'''

[[topic]]
title = "Kicking and banning"
under = "The multiplayer lobby"

[[topic.rule]]
id = "lobby-kick-button"
tags = ["code", "data"]
text = '''Each slot's action panel has Kick ("Kick", tooltip "Kick player from the game"). Only the host's Kick does anything, and not during the countdown.'''

[[topic.rule]]
id = "kick-computer-player"
tags = ["code"]
text = '''Kicking a computer player just removes it and its slot empties, as closing its slot does.'''

[[topic.rule]]
id = "kick-person"
tags = ["code", "data", "guess"]
text = '''Kicking a person removes them at once: every other machine posts "Player %s was kicked from the game"; the kicked machine gets an OK box "You were kicked from the game" (`networking_disconnect_kicked`) whose OK leaves the lobby for the LAN screen.'''

[[topic.rule]]
id = "ban"
tags = ["code", "data"]
text = '''Ban ("Ban", tooltip "Ban player from the game") works only in internet games; on a LAN it does nothing, and a LAN game never refuses a joiner as banned. (In an internet game the host's ban removes the person, who reads to the others as quitting, and refuses their account later, with a clickable line on the host's screen to lift it.)'''

[[topic]]
title = "Lobby chat"
under = "The multiplayer lobby"

[[topic.rule]]
id = "lobby-chat-panel"
tags = ["code", "data"]
text = '''The chat panel runs along the bottom of the lobby screen (stock at 39, 464, 716 by 278, at 1024 by 768): the message log, an edit box (512 characters) and Send on the left; on the right a sorted list of the people in the game (computer players aren't listed) where several can be selected, the filter toggles All, Whisper and Team, and a Buddies button (internet only).'''

[[topic.rule]]
id = "lobby-message-log"
tags = ["code", "guess"]
text = '''The log is the ordinary message log, so join, quit and kick lines, countdown lines and warnings show in it along with chat.'''

[[topic.rule]]
id = "lobby-chat-channels"
tags = ["code"]
text = '''All sends to everyone. Team sends team chat. Whisper sends a private line to each person selected in the list, several at once. A slot's Whisper button selects just that person, turns Whisper on and puts the cursor in the edit box.'''

[[topic.rule]]
id = "lobby-team-chat"
tags = ["code", "guess"]
text = '''They're the same orders as in a match (through the host, recorded), but who hears team chat differs: in the lobby it reaches the people whose slots are on the same team in the lobby's team setup, and observers reach only observers; someone on no team reaches no one, themselves included. A whisper between an observer and someone with a slot is delivered in the lobby.'''

[[topic]]
title = "Leaving the lobby"
under = "The multiplayer lobby"

[[topic.rule]]
id = "exit-lobby"
tags = ["code", "data", "guess"]
text = '''Exit asks "Exit Staging?" (`ui_staging_confirm_exit`); yes leaves the game for the LAN screen. Others see "Player %s quit the game". A leave of any kind stops a running countdown.'''

[[topic.rule]]
id = "host-leaves-lobby"
tags = ["code"]
text = '''The host leaving doesn't end the lobby. As in a match, the best-ranked survivor takes over at once ("%s has taken over as host.", then "Player %s quit the game" for the old host; see When the host leaves). The old host's computer players go with it and their slots empty; nothing replaces them in the lobby.'''

[[topic.rule]]
id = "lobby-no-longer-public"
tags = ["code"]
text = '''Then every machine posts the warning "Since the original host has left, the game is no longer public.  Please host a new game to enable players to join." (`staging_not_original_host`). From then on the new host's Launch only repeats that warning, joiners are refused ("Cannot join a game where the current host is different from the original host"), and no files are sent. The others stay on the lobby screen until they leave.'''

[[topic.rule]]
id = "host-lost-in-lobby"
tags = ["code", "guess"]
text = '''A host that's lost rather than leaving holds the lobby as in play, but with no allowance: the Kick toggle of the machine in charge drops it at once (see The allowance, the vote and the drop), and the same handover follows.'''

[[topic]]
title = "Starting the match"

[[topic.rule]]
id = "launch-settings-frozen"
tags = ["code"]
text = '''At launch the settings are frozen, a computer player is created for each player side the map marks `required` that nobody holds, every other side nobody holds leaves the match (Closed and empty Open slots alike; see [outcome](outcome.toml)), and the match's random seed is fixed: players don't choose it, and every machine ends up with the same one. The seed isn't sent at launch: the session carries a random number generator whose state the host sends each machine as it joins, and every machine draws the seed from it at the same moment, so all draw the same value. A seed can instead be fixed beforehand by an order (not while the countdown runs); nothing in the lobby offers it. Each machine then builds the world from the same map and seed (see Loading).'''

[[topic.rule]]
id = "agreed-before-play"
tags = ["code"]
text = '''So what is agreed before play: game version, archive and data checksums, mods (all at joining); the map file by checksum; every lobby setting; the seed; and the list of players with their sides.'''

[[topic]]
title = "Loading"

[[topic.rule]]
id = "loading-screen"
tags = ["code"]
text = '''From launch every machine shows the loading screen (`UI/Loading/loading_screen.tgi`) while it builds the world and loads what it needs. The match is frozen from launch: steps keep passing between machines, so orders, votes and holds work as in play, but no game time passes.'''

[[topic.rule]]
id = "slow-loading"
tags = ["code", "guess"]
text = '''Loading goes on alongside the machine's link, so a machine that is only slow to load keeps talking to the host and shows no status of its own; the others just wait for it.'''

[[topic.rule]]
id = "loading-status-line"
tags = ["code", "data"]
text = '''The screen's status line shows only that machine's own progress ("Loading Data", "Generating Map", "Loading Objects", "Loading Resources" and the like, `app_status_*`). How far other machines have got isn't sent anywhere.'''

[[topic.rule]]
id = "waiting-on-other-players"
tags = ["code", "data"]
text = '''When a machine has finished it tells the others, and in multiplayer its status line then reads "Waiting on Other Players" (`app_status_waiting_on_other_players`) until play begins.'''

[[topic.rule]]
id = "no-continue-in-multiplayer"
tags = ["code", "data"]
text = '''Multiplayer has no Continue. The loading screen's Continue button ("Continue", with "Finished Loading", `app_status_finished`) shows only in single-player, once loading is done, and play waits for it there.'''

[[topic.rule]]
id = "play-begins"
tags = ["code"]
text = '''Play begins as soon as every machine has finished: each machine learns it at the same step, leaves the loading screen and starts the match (what shows first: [match start](match-start.toml#what-the-player-sees-as-play-begins)).'''

[[topic.rule]]
id = "hold-while-loading"
tags = ["code"]
text = '''A hold on the loading screen is a hold as in play (see Slow and lagging players), with the same statuses, allowance, drop vote and countdown: a machine that goes quiet before it has finished shows Disconnected after 2 seconds.'''

[[topic.rule]]
id = "leaving-while-loading"
tags = ["code"]
text = '''A player who leaves, is dropped or is kicked while loading goes as in play: "Player %s quit the game" (or the kick line) at once. The computer player that takes their side is made only when play begins, so its "%s taken over by %s" line comes then. The others stop waiting for that machine: if everyone left has finished, play begins at once.'''

[[topic.rule]]
id = "load-failure"
tags = ["code"]
text = '''If any machine fails to load, play doesn't begin anywhere: once every machine has reported, finished or failed, each learns that one failed and stays on the loading screen. The host is told "Failed to create map" (`failed_to_create_map`), or the loading error itself when there is one, and sends that text on to every machine. Where it's shown and where each machine goes next isn't settled (see Open questions).'''

[[topic]]
title = "Player names"

[[topic.rule]]
id = "every-player-named"
tags = ["code"]
text = '''Every player in a session has a name: people, computer players and observers alike. A person's name is their LAN nickname, in single-player as well as on a LAN; in an internet game it's their online nickname instead. The host takes its own name when it creates the game, and a joining machine sends its name with the request to join.'''

[[topic.rule]]
id = "setting-nickname"
tags = ["code", "data"]
text = '''The LAN nickname is set in the Options dialog's Network tab (the Nickname box), from the lobby's Change Name button, or at the "Enter a nickname" prompt (`ui_lobby_prompt_lan_nickname`). That prompt comes up on entering the LAN lobby for as long as the player has never set a nickname, filled in with the current one.'''

[[topic.rule]]
id = "default-nickname"
tags = ["code", "data"]
text = '''Until one is set the nickname is `default_lan_name` ("Player"). It is kept with the player's preferences (`UserPreferencesFilename`, `User/Preferences.rup`), along with whether it has ever been set. The commented-out `NetworkLanNickname` line in `UVars.tgi` plays no part.'''

[[topic.rule]]
id = "nickname-length"
tags = ["code"]
text = '''A nickname entered anywhere is cut to `LANNicknameMaxLength` characters (18; no data file sets it), then has spaces trimmed from both ends. If nothing is left, the entry is ignored: the old name stays and doesn't count as set. No characters are refused. The Options box and the Change Name prompt stop typing at that length; the first-time prompt doesn't, and the cut happens afterwards.'''

[[topic.rule]]
id = "unique-names"
tags = ["code", "data"]
text = '''Names are unique within a session. Whenever a player gets a name (the host on creating the game, a machine joining, a rename, a computer player being created) and another player already has exactly that name, the name becomes "%s (%d)" (`networking_duplicate_name_formate`) with 1, then 2 and so on, until no other player has it. The number is always added to the name as given, so a third Bob is "Bob (2)", not "Bob (1) (1)". Matching is exact: "bob" and "Bob" don't clash.'''

[[topic.rule]]
id = "name-numbering"
tags = ["code"]
text = '''So the first holder of a name keeps it and the newcomer is numbered. The host, as the first player in its own game, isn't numbered unless it renames itself to a name already taken. Computer players take part too: two computer players on the same profile are "Kesselring AI" and "Kesselring AI (1)", and a person called "Kesselring AI" would make the computer player the numbered one.'''

[[topic.rule]]
id = "renaming"
tags = ["code", "data"]
text = '''A player can rename themselves in a LAN game, in the lobby or during the match. Everyone sees "%s changed name to %s" (`networking_player_changed_name`), the old name shown as below and the new one plain, and the new name is made unique as above. Only the player themselves or the host can rename a player. An internet game refuses renames.'''

[[topic.rule]]
id = "name-display"
tags = ["code"]
text = '''How a name is shown in lines and the connection dialog: see [messages](messages.toml). An observer's name appears like anyone else's, with the observer glyph in white: in their chat lines, their join and quit lines, and their slot in the connection dialog, which has a slot for each person's machine, observers' included.'''

[[topic]]
title = "Single-player"

[[topic.rule]]
id = "single-player-session"
tags = ["code"]
text = '''A single-player match is the same machinery with one person in it: the player's machine hosts a session of one, and their orders pass through the same host step as they would with others present. That is why single-player matches can be recorded and played back as films.'''

[[topic.rule]]
id = "single-player-differences"
tags = ["code", "data", "guess"]
text = '''
What differs:
- The `Multiplayer` world rule is false, which is what the rest of the game tests.
- Pause is a plain toggle with no votes or messages, and opening the game menu or the objectives, technology or message log window pauses; in a multiplayer game, hosted or joined, they pause nothing (see [interface](interface.toml#windows-over-the-match)). The game probably also stops while its window isn't in front.
- Cheats work only when `AllowCheats` is on and the match isn't multiplayer. They are orders, so a film shows them.
- Speed, saving and ending the match are the host's, and the one player is the host, so all three are simply available.
- There's no one to wait for, lose or vote with.
'''

[[topic.rule]]
id = "campaign-skips-lobby"
tags = ["guess"]
text = '''Campaign missions go straight to loading without the lobby screen, but run the same way once started.'''

[[topic]]
title = "Computer players"

[[topic.rule]]
id = "computer-player-in-session"
tags = ["code", "data"]
text = '''A computer player is a player in the session like a person: it has a name, a side and a place in the player list, and the lobby shows which machine it belongs to ("%s (%s)", `staging_ainame_clientname`).'''

[[topic.rule]]
id = "computer-player-machine"
tags = ["code"]
text = '''It belongs to one machine, and only that machine thinks for it. One added in the lobby belongs to the machine whose person added it, host or guest (see Computer players in the lobby); one made at launch for a required side nobody took, and one that takes over a side mid-match, belongs to the host.'''

[[topic.rule]]
id = "computer-player-on-guest"
tags = ["code"]
text = '''A computer player on a guest's machine plays exactly as one on the host's: the same thinking on the same schedule, in game time. Its orders go to the host as that guest's orders, with the same round trip as the guest's own (see What is sent, and when), and the host checks them as it checks anyone's: an order for a player is accepted only from the machine that player belongs to.'''

[[topic.rule]]
id = "computer-player-during-hold"
tags = ["code", "guess"]
text = '''While the match is held (see The hold), no computer player starts a new think, its owner's machine lagging or not: its thinking runs to game time, which stands still. Orders from a think already under way still leave over the next moments of real time, and like everyone else's orders they wait and take effect just after the hold.'''

[[topic.rule]]
id = "computer-player-real-time"
tags = ["code"]
text = '''It doesn't run inside the simulation. It thinks on one machine, in real time (a share of each frame, not a fixed amount per step), and what it decides goes out as orders exactly as a person's do: it sets its selection, then tells the selection what to do, and those orders go through the host's step and reach every machine. The other machines don't think for it at all.'''

[[topic.rule]]
id = "host-computer-players-leave"
tags = ["code"]
text = '''When the host is dropped or leaves, everything that belonged to its machine goes with it, its computer players included, as for any machine that leaves; the new host gives each of their sides a new computer player (see Taking over a side).'''

[[topic.rule]]
id = "computer-player-start"
tags = ["code"]
text = '''A computer player only starts thinking once the map has been analysed for it, a moment after play starts, and not while the match is frozen.'''

[[topic.rule]]
id = "computer-player-not-repeatable"
tags = ["code"]
text = '''Because its thinking depends on real time, the same match played twice wouldn't get the same decisions; only its recorded orders make a film repeatable, and during a film no computer player thinks.'''

[[topic]]
title = "Choosing a profile at launch"
under = "Computer players"

[[topic.rule]]
id = "profile-at-launch"
tags = ["code"]
text = '''A computer player with no profile (a lobby slot left on "Random", or one made at launch for a required side) is given one when it's created at launch, after every side's nation and general have been settled: the map's, the lobby's, or drawn at random for those left on "Random". So the profile is picked to fit the side, never the other way round.'''

[[topic.rule]]
id = "profile-draw-pool"
tags = ["code", "data"]
text = '''It's drawn from the profiles in `SAI/` that are public (`public` not `false`), whose `difficulty_level` isn't the easiest (`sai_difficulty_level_easy`), and that list the side's nation among their `[Nation]` entries and its general among their `[Faction]` entries. A profile with no `[Nation]` entries fits any nation, and one with no `[Faction]` entries any general; a side without a general skips that test. Each profile that fits is equally likely. With the shipped data that is the general's own profile (`chuikov_sai` for a Chuikov side): the per-nation profiles aren't public.'''

[[topic.rule]]
id = "profile-draw-fallback"
tags = ["code"]
text = '''If none fits (a modded general no public profile lists, say), it's drawn from every profile in `SAI/`, public or not and whatever its nation, general or difficulty, each equally likely.'''

[[topic.rule]]
id = "profile-draw-machine"
tags = ["code"]
text = '''The draw is made only on the machine the computer player belongs to (a guest's, for one that guest added in the lobby), from that machine's own random numbers (started from the clock when the program starts), not from the match's seed: machines needn't agree on it, since only that machine thinks for the computer player, and the same match launched twice can get different profiles. That machine then renames its computer player after the profile, and the rename goes to every machine as an order like any other, the same way whichever machine made the draw; each machine renames the side from it (see [players](players.toml)). No line is posted for it.'''

[[topic]]
title = "Films"

[[topic.rule]]
id = "every-match-recorded"
tags = ["code", "guess"]
text = '''Every match is recorded as it's played, single-player included, except a test play from the map editor and one other kind of match not yet identified.'''

[[topic.rule]]
id = "film-rotation"
tags = ["code", "data"]
text = '''Recording starts when the world is ready for play. Films rotate through `FilmRotationQueueSize` (stock 5) files in `PathFilms` (stock `Films/`), named from the `last_film_filename` string (stock "LastFilm"; if empty, `LastFilmName`) with the slot number and the extension added: `LastFilm_0.RFM` to `LastFilm_4.RFM`. Each recorded match takes the next slot after the one used last, wrapping to 0, and overwrites what was there; if a slot's file can't be opened it tries the next, up to one round. The last slot used is remembered as `LastFilmIndex`.'''

[[topic.rule]]
id = "save-film"
tags = ["data"]
text = '''The debriefing and scoring screens offer "Save Film" to keep the current one under a name.'''

[[topic.rule]]
id = "film-contents"
tags = ["code"]
text = '''A film holds: what it was recorded with (version and build) and what it was played on (the source map or saved game, by name and checksum, and the launch settings with the seed); the list of players (id, name, person or computer, side); and then, for every step, the bundle of orders the host issued for it. It holds nothing of the world.'''

[[topic.rule]]
id = "film-playback"
tags = ["code"]
text = '''Playing a film is launching the same map with the same settings and seed and feeding each step its recorded bundle in place of a host. Selections, chat, pauses, speed changes and the checksum reports are all in there, since all were orders.'''

[[topic.rule]]
id = "film-refused"
tags = ["data"]
text = '''A film from a different version or build is refused ("Film is from a different version (%s)."), as is one whose source map is missing. In the multiplayer lobby a film can be chosen and watched together, each machine needing the source map.'''

[[topic.rule]]
id = "film-out-of-sync"
tags = ["code", "data"]
text = '''The recorded checksums are compared with the viewer's own as playback runs. A mismatch stops the film with "Out of Sync with Film"; otherwise it runs to "End of Film", with Exit to Scoring or Keep Watching.'''

[[topic.rule]]
id = "watching-film"
tags = ["code", "data"]
text = '''While watching, orders that would change the match are refused. The viewer can pause and change speed, over a wider range than a match: `GameSpeedFilmMin` to `GameSpeedFilmMax` (stock -4 to +4: 6% to 1600%). Speeding up or down steps as in a match (see Pause, speed, chat, votes).'''

[[topic.rule]]
id = "saved-game-vs-film"
tags = ["code", "guess"]
text = '''A saved game is different: it's the world as it stood, with no orders in it (see [saved state](saved-state.toml)). A match resumed from a save records a film whose source is the save.'''

