subject = "Triggers"
summary = '''How a map's triggers run: when each one is tested, how its events, conditions and effects combine, how a parameter gets its value, and what each event, condition and effect the shipped maps use does, multiplayer and campaign. How a campaign's missions follow one another is in [campaigns](campaigns.toml). What a trigger holds is the TRIGGERS section as `rmp.ksy` lays it out (a list of triggers, each with `all_conditions`, `active`, `repeats`, `activation_time`, and lists of `events`, `conditions` and `effects`, each an element naming a template with its `parameters`; then the section's `variables`).'''
games = '''traced in AA and Kohan II, which share the trigger engine; the element and source numbering in this spec is by name, which both games' data (`Game/trigger_elements.tgi`) and maps use. Kohan II adds the hero elements; AA's has the game counter.'''

[[topic]]
title = "When triggers are tested"

[[topic.rule]]
id = "tested-every-tick"
tags = ["code"]
text = '''Every trigger that is `active` is tested once on every simulation tick, during the tick, after the tick's game time has moved on. So the first test is on the first tick of the match, a tick after game time 0.'''

[[topic.rule]]
id = "list-order"
tags = ["code"]
text = '''Triggers are tested in the order the TRIGGERS section lists them. A trigger's effects take hold at once, so a trigger later in the list sees what an earlier one did in the same tick (a variable it set, a trigger it switched on or off).'''

[[topic.rule]]
id = "inactive-never-tested"
tags = ["code"]
text = '''A trigger that isn't `active` is never tested, whatever its events or conditions, until an effect switches it on (Switching triggers, below).'''

[[topic]]
title = "Testing a trigger"

[[topic.rule]]
id = "events-any-one"
tags = ["code"]
text = '''With events: the trigger goes ahead only if at least one of its events happened since the last tick (Events, below); events are always "any one". With no events it always goes ahead.'''

[[topic.rule]]
id = "all-conditions"
tags = ["code"]
text = '''Conditions: with none, the effects run. Otherwise every condition is evaluated; when `all_conditions` is 1 all must hold, when it's 0 any one is enough. There's no negation: a condition is either true or false, and the "not" forms are separate templates (`actor_does_not_have_state` beside `actor_has_state`).'''

[[topic.rule]]
id = "effects-in-order"
tags = ["code"]
text = '''Effects run in their listed order, every one of them, even if one fails (an effect fails when a parameter names nothing, a missing kingdom say); a failed effect simply does nothing.'''

[[topic.rule]]
id = "repeats"
tags = ["code"]
text = '''After the effects have run, a trigger with `repeats` stays active and its activation time is set to the current game time; one without is switched off for good (unless an effect switches it on again). A trigger whose conditions fail stays as it was and is tested again next tick.'''

[[topic.rule]]
id = "activation-time"
tags = ["code", "data"]
text = '''A trigger's activation time is the game time it was last switched on or, for a repeating one, last fired. The map's saved value (0 in every shipped map) is the starting value, so a trigger active from the start counts from game time 0. `activation_time` conditions compare against it (below).'''

[[topic.rule]]
id = "map-init-triggers"
tags = ["code", "data"]
text = '''So the shipped "Map Init" triggers (active, not repeating, no events, no conditions) run their effects once, on the first tick, and switch off. The ambient-sound triggers (active, repeating, one condition "activation_time >= N") fire N seconds into the match and then about every N seconds, each firing restarting the count.'''

[[topic]]
title = "Areas"
intro = '''An area is a region placed in the map (an `area` record in DYNAMIC_THINGS) that triggers test things against. Its own template (`Template Area`) makes it invisible, not blocking and not targetable.'''

[[topic]]
title = "Its shape"
under = "Areas"

[[topic.rule]]
id = "area-shape"
tags = ["code", "data"]
text = '''The area's `shape` is 1 for a circle or 3 for a box; the shipped maps use only these. Other values are the other shape kinds (0 a point, 2 a square) and aren't used.'''

[[topic.rule]]
id = "circle-radius"
tags = ["code", "data"]
text = '''A circle is `radius` around the area's position. The bounds are kept in the record but play no part (some shipped circles carry left-over bounds from being a box once).'''

[[topic.rule]]
id = "box-bounds"
tags = ["code", "data"]
text = '''A box is its four bounds (min x, min y, max x, max y) measured from the area's position, not absolute. The shipped boxes are centred, the min bounds the negatives of the max ones, and their `radius` is half the box's diagonal (a 76.2 by 4 box has `radius` 38.15).'''

[[topic.rule]]
id = "area-ignores-height"
tags = ["code"]
text = '''Everything is measured flat, by x and y; height plays no part.'''

[[topic]]
title = "Who is in an area"
under = "Areas"

[[topic.rule]]
id = "area-list"
tags = ["code"]
text = '''The area keeps a list of the things in it, rechecked every tick. The check runs as part of the tick's world update, before that tick's trigger pass, so an entry is heard on the tick it happens ([Events](#events)).'''

[[topic.rule]]
id = "who-can-be-in-area"
tags = ["code", "data"]
text = '''
A thing can be in an area when it is an actor that can be targeted (its template's `targetable` flag) and has health or is a regiment:
- Units, buildings and building sites count, whoever owns them, independents included.
- A regiment counts as a thing of its own, apart from its units (the regiment template is `targetable`).
- Aircraft in flight count like any other unit, the delivery transport among them, as do men coming down under parachutes.
- Things whose template isn't `targetable` never count: areas themselves, scenery, trailers, ambient animals (`AAAmbientUnit`).
- A regiment still on its way in a transport doesn't exist yet, so it can't be in an area until the transport starts putting it down ([deliveries](deliveries.toml#special-operations-and-triggers)).
- A dying thing stops being targetable the moment it starts to die, so it leaves the list on the next check and can't enter one. A thing taken off the map is gone from it too.
'''

[[topic.rule]]
id = "in-area-test"
tags = ["code", "guess"]
text = '''
The test for being in it is looser than the area's outline. A thing is in the area when both hold:
- its centre is no further from the area's position than the area's `radius` plus the thing's soft radius (the bounding radius of its soft shape, [objects](objects.toml#shapes)); and
- its soft shape covers some map tile the area covers. For a circle those are the tiles under the square from its position minus `radius` to plus `radius`; for a box the tiles under the box, taken square to the map (the area's facing doesn't turn it).
- So a thing near a box's corner, or just outside a circle, can count without its shape touching the area.
'''

[[topic.rule]]
id = "regiment-place"
tags = ["code", "data"]
text = '''A regiment's place is its own position, which follows its leader's ([movement](movement.toml)), with its soft radius of 1 (the regiment template's `soft_radius`). So a regiment is in an area by where its position is, not by its units: its first units can be inside before it is, and its stragglers outside after it is.'''

[[topic]]
title = "Entering"
under = "Areas"

[[topic.rule]]
id = "entering-area"
tags = ["code"]
text = '''A thing enters an area when a check finds it in the area and it isn't on the area's list yet. It's added to the list and an entry is posted for `actor_enters_area`.'''

[[topic.rule]]
id = "leaving-area"
tags = ["code"]
text = '''A thing on the list that a check doesn't find is dropped from it. So a thing that leaves and comes back enters again, each time.'''

[[topic.rule]]
id = "units-enter-separately"
tags = ["code"]
text = '''A regiment and each of its units are separate things: each enters on its own, when its own place first counts.'''

[[topic.rule]]
id = "lists-empty-at-start"
tags = ["code", "data"]
text = '''At the start of a match the lists are empty (the editor saves them empty), so everything standing in an area enters it on the first tick, heard by that tick's triggers. A saved game keeps each list, so loading it posts no entries for things already inside.'''

[[topic.rule]]
id = "id-handover-keeps-place"
tags = ["code"]
text = '''A thing that changes into another and hands over its id (a truck unpacking into its building, a building packing into its truck, an upgrade) is the same thing to an area. The new thing takes the old one's place on the list, so it doesn't enter again if it's still in the area at the next check. If the change takes it out of reach (the building stands at an offset from the truck, and its size differs), it leaves; if it brings it into reach, it enters then, as the new thing.'''

[[topic]]
title = "Events"

[[topic.rule]]
id = "events-since-last-pass"
tags = ["code"]
text = '''An event element is true when what it names happened since the last trigger pass.'''

[[topic.rule]]
id = "happenings-list"
tags = ["code"]
text = '''The game keeps one list of the happenings an event can name: a thing destroyed, a thing captured, a thing entering an area, a building begun or finished, a recruit made, a listened-for script command run. Each is added as it happens. The list is emptied once per tick, at the end of the trigger pass. So every trigger tested in a pass sees everything that happened since the previous pass.'''

[[topic.rule]]
id = "happenings-before-pass"
tags = ["code"]
text = '''Most happenings come before the pass: the tick's orders, movement, combat, recruiting and construction run first, and things that died that tick are finished off just before it. So a trigger hears of them on the same tick.'''

[[topic.rule]]
id = "happenings-during-pass"
tags = ["code"]
text = '''Something a trigger's effect causes during the pass (a building site made, say) is heard only by triggers later in the list, that same pass. Triggers earlier in the list never hear of it. A thing an effect kills dies after the pass, so its destruction is heard on the next tick.'''

[[topic.rule]]
id = "events-while-off-lost"
tags = ["code"]
text = '''An event happening while its trigger is switched off isn't kept for later.'''

[[topic.rule]]
id = "every-event-tested"
tags = ["code"]
text = '''Every event element in a trigger is tested, not just up to the first one that holds, so the event things from all of them are gathered.'''

[[topic.rule]]
id = "actor-id-or-any"
tags = ["code"]
text = '''An event can name a particular thing (`mi_actor_id`) or any thing (`mi_actor_any`). With "any", every thing that matched becomes one of the trigger's event things; with a particular one, that thing does.'''

[[topic.rule]]
id = "run-per-event-thing"
tags = ["code"]
text = '''The trigger is then run once for each event thing, in turn: conditions are tested and effects run with `mi_actor_event` meaning that thing. A trigger that doesn't repeat stops after the first run whose conditions pass.'''

[[topic.rule]]
id = "actor-enters-area"
tags = ["code", "data"]
text = '''
`actor_enters_area` (`ma_actor`, `ma_area`): the thing entered the area (by its id `mi_area`) since the last pass, as [Entering](#entering) says. Used by AA's `(2v2)Moscow` and `(4FFA)TropicalCruise`, and by the tutorial.
- A named thing fires only on its own entry. Naming a regiment (Tutorial 1's) waits for the regiment's position to come in; its units entering first doesn't fire it.
- With `mi_actor_any`, every thing that entered becomes an event thing, each once. A regiment walking in gives the regiment and each of its units, as each enters, usually over several ticks.
- Ownership plays no part: things of any side enter. Test the owner with a condition on `mi_actor_event`.
'''

[[topic.rule]]
id = "actor-captured-by-kingdom"
tags = ["code", "data", "guess"]
text = '''
`actor_captured_by_kingdom` (`ma_actor`, `ma_kingdom`): the thing changed hands to that kingdom by capture since the last pass: taken by damage, or a city taken by presence ([buildings](buildings.toml)). A change of side by `actor_transfer_control_to_kingdom`, or by any other effect, doesn't count.
- The thing must be named (`mi_actor_id`, `mi_actor_named`); there's no "any thing" form, and `mi_actor_any` never fires. The event thing is the captured thing.
- If the same thing changed hands twice in one tick, only its latest capture is looked at: it fires only if that one was by the named kingdom.
- Kohan II: a capturable structure that belongs to a settlement counts as its settlement being captured.
- The shipped campaigns use it more than any other event (over 300 times), always with `mi_actor_id` and `mi_kingdom_named`.
'''

[[topic.rule]]
id = "actor-destroys-actor"
tags = ["code"]
text = '''
`actor_destroys_actor` (`ma_actor` the killer, `ma_actor` the destroyed): a thing died since the last pass. Every death counts, regiments' included (a regiment dies with its last unit). The killer is whatever last damaged the dying thing; a death with no damager (no one ever hit it) has no killer.
- Destroyed named, killer any (the form the campaigns use): fires if the named thing is now dying or gone and it was killed by something; the event thing is the killer.
- Both named: fires if the destroyed thing is dying or gone, the named killer still exists, and the killer was that thing or, when it's a regiment, one of its units.
- Killer named, destroyed any: fires if the named thing killed anything; the event thing is the killer itself (not what it killed). Here a regiment doesn't stand for its units: the kill must be credited to exactly that thing.
- Both any: fires on any death; every killer and every destroyed thing of the tick become event things.
'''

[[topic.rule]]
id = "kingdom-begins-construction"
tags = ["code"]
text = '''`kingdom_begins_construction_on_actor` (`ma_kingdom`, `ma_actor_data`): a building site of that template (`mi_actor_data_named`, e.g. `usa_bunker`) was placed for that side. `mi_actor_data_any` matches any template. The template must be the site's own, exactly. There's no event thing.'''

[[topic.rule]]
id = "kingdom-finishes-construction"
tags = ["code", "data"]
text = '''`kingdom_finishes_construction_on_actor` (`ma_kingdom`, `ma_actor_data`): a thing of that template was finished for that side: a building site completed, an upgrade completed, or a packed building finished unpacking (so `rus_hq_infantry` fires when a Corps HQ unpacks from its truck). The side is the thing's owner. No event thing.'''

[[topic.rule]]
id = "kingdom-recruits-actor"
tags = ["code"]
text = '''`kingdom_recruits_actor` (`ma_kingdom`, `ma_actor_data`): that side recruited something of that template (a regiment such as `regiment_rus_infantry`, or a truck such as `rus_truck_ammo`): heard once per recruit, when the recruit is made. For one that arrives by transport that's when the transport is made and sets off, not when it lands: the delivery isn't heard again, and a recruit whose transport can't be made (and is refunded) isn't heard at all. Things made by triggers don't count. No event thing.'''

[[topic.rule]]
id = "event-script-heard"
tags = ["code", "data", "guess"]
text = '''
`event_script_heard` (`ma_script_command`, `mi_script_command`): the player ran that interface command since the last pass, while the map was listening for it.
- A map listens with `effect_ui_script_listen` (the command, and on or off); the commands listened for are kept with the saved match.
- The command is the text an interface button or key runs (`ActorCommand move`, `ActorDataSelectCommand regiment_rus_infantry`, `FormationChange 0 1`, `MessageLogToggle`, `UseFactionAbility 0`). It must match the listened text whole, ignoring case.
- A listened-for command is sent to every machine as an order before it's heard, so it's heard on the tick that order is carried out. It still runs as usual.
'''

[[topic.rule]]
id = "cutscene-complete"
tags = ["code", "guess"]
text = '''`cutscene_complete` (`mi_cutscene`): the named video, started by `play_cutscene`, has finished playing (players' machines report it as an order). No shipped AA map uses it.'''

[[topic]]
title = "Parameter values"

[[topic.rule]]
id = "parameter-source"
tags = ["code", "data"]
text = '''A parameter's `source` decides where its value comes from; `set` (whether the map author filled it in) makes no difference to the game, which uses the stored value either way. Shipped maps leave `ma_compare` unset at 3, which the game reads as "at least".'''

[[topic.rule]]
id = "number-parameters"
tags = ["code"]
text = '''Numbers (`ma_value` and the like): `mi_int` is the stored whole number, `mi_fixed` the stored decimal, `mi_variable` the current value of the named trigger variable (0 if there's none of that name). Any other source gives 0.'''

[[topic.rule]]
id = "mi-compare"
tags = ["code"]
text = '''`mi_compare` is how two numbers are compared: 0 less than, 1 at most, 2 equal, 3 at least, 4 more than, 5 not equal. A comparison given by any other source means "equal".'''

[[topic.rule]]
id = "kingdom-parameters"
tags = ["code", "data"]
text = '''
Kingdoms (`ma_kingdom`):
- `mi_kingdom_named`: the kingdom of that name in the map (`kingdom_0`, `independent_2`).
- `mi_kingdom_id`: the kingdom whose thing id is stored.
- `mi_kingdom_event` and `mi_kingdom_condition`: a kingdom an earlier parameter picked (below).
- `mi_kingdom_any`, `mi_kingdom_all` and the ally, enemy and team sources aren't read by any of the elements traced here, apart from `kingdom_gains_technology` with `mi_kingdom_all` ([Technologies](#technologies)): they give no kingdom, so the element fails. No shipped map uses them.
'''

[[topic.rule]]
id = "thing-parameters"
tags = ["code"]
text = '''
Things (`ma_actor`): `mi_actor_event`, the trigger's current event thing (Events); `mi_actor_condition`, the thing a condition picked. `mi_actor_any` only means something to events.
- `mi_actor_id`: the thing whose `id` (the one in its own saved record) is stored. A regiment is a thing with an id of its own, as is each of its units, so the id names exactly one of them. It's found as long as the thing is still in the world, even while it's dying; once it has been taken off the map the parameter names nothing ([combat](combat.toml#leaving-the-map) says when that is). A new thing takes over an old one's id only by packing, unpacking or upgrading into it.
- `mi_actor_named`: the thing that bears that name: the `name` in its saved record (empty for most things), or the one an effect such as `actor_create_transported_named` gave it as it was made. Names match regardless of case. When two things bear the same name, the one that came into being last (later in the map's list, or made later in play) is the one found. Only actors are found (units, regiments, buildings; not areas or cameras), dying or not, until taken off the map like an id. A name nobody bears names nothing. `actor_create_named` won't give a name that a thing in the world already bears ([Making and removing things](#making-and-removing-things)).
- A thing that hasn't come into being yet can't be named either way: a regiment still on its way in a transport exists only once the transport starts putting it down ([deliveries](deliveries.toml#special-operations-and-triggers)).
'''

[[topic.rule]]
id = "event-and-condition-kingdom"
tags = ["code"]
text = '''A kingdom picked by an event's parameter becomes the event kingdom (`mi_kingdom_event`); one picked by a condition's parameter becomes the condition kingdom (`mi_kingdom_condition`). Kingdoms that effects pick aren't remembered.'''

[[topic.rule]]
id = "picked-values-persist"
tags = ["code"]
text = '''Each is overwritten only by the next parameter of its kind. Nothing clears it between triggers or ticks. So a trigger whose events name no kingdom sees, as `mi_kingdom_event`, the last one another trigger named.'''

[[topic.rule]]
id = "condition-kingdom-order"
tags = ["code"]
text = '''Conditions are tested in order, so a condition's `mi_kingdom_condition` is the kingdom an earlier condition named. In effects, it's the one named by the last condition tested.'''

[[topic.rule]]
id = "condition-thing"
tags = ["code"]
text = '''A thing a condition's parameter names becomes the condition thing (`mi_actor_condition`), as does the thing `actor_inside_area` finds with "any". It's forgotten once the trigger has been tested, so it doesn't carry to the next trigger.'''

[[topic.rule]]
id = "hero-parameters"
tags = ["code"]
text = '''Heroes (`ma_hero`, Kohan II): `mi_hero_named` names a hero by its id; `mi_hero_random` asks the effect to pick one (below).'''

[[topic.rule]]
id = "named-parameters"
tags = ["code"]
text = '''Templates (`mi_actor_data_named`), sounds (`mi_sound`), objectives (`mi_objective`), suns (`mi_sun`) and other named things are looked up by their id; a name that matches nothing makes the element fail.'''

[[topic.rule]]
id = "location-and-trigger-parameters"
tags = ["code", "data"]
text = '''`mi_location` is a stored map position; `mi_trigger` the stored id of another trigger in the map.'''

[[topic]]
title = "Conditions the shipped maps use"

[[topic.rule]]
id = "activation-time-condition"
tags = ["code", "data"]
text = '''`activation_time` (`ma_compare`, `ma_value`): game time since this trigger's activation time, compared with the value. Every shipped Kohan II multiplayer map uses it, always as "at least".'''

[[topic.rule]]
id = "true-condition"
tags = ["code"]
text = '''`true`: always holds.'''

[[topic.rule]]
id = "value-compare-value"
tags = ["code"]
text = '''`value_compare_value` (`ma_value`, `ma_compare`, `ma_value`): compares two numbers, usually a variable with a constant.'''

[[topic.rule]]
id = "actor-is-type-actor-data"
tags = ["code", "data"]
text = '''`actor_is_type_actor_data` (`ma_actor`, `ma_actor_data`): the thing is of that template (`mi_actor_data_named`, e.g. `ger_depot_oil`). AA's `(4FFA)TropicalCruise` uses it on the event thing.'''

[[topic.rule]]
id = "kingdom-has-primary-resource"
tags = ["code", "data"]
text = '''`kingdom_has_compare_value_primary_resource` (`ma_kingdom`, `ma_compare`, `ma_value`): the kingdom's stockpile of the primary resource (AA's `money`), rounded to the nearest whole number, compared with the value. `(4FFA)TropicalCruise` wins a side at 2000.'''

[[topic]]
title = "Effects the shipped multiplayer maps use"
intro = '''Kohan II's multiplayer maps use only the first three; the rest are AA's.'''

[[topic.rule]]
id = "kingdom-gains-hero"
tags = ["code", "guess"]
text = '''
`kingdom_gains_hero` (`ma_kingdom`, `ma_hero`), Kohan II:
- with `mi_hero_named`, the side gets that hero in its pool, unless it already holds it (then the effect fails);
- with `mi_hero_random`, the side gets one hero picked at random, all equally likely, from every hero whose `random_hero` is set, that the side doesn't hold, and, if the side has a faction, whose factions include it. If there's none, it gets nothing and the effect fails. The pick uses the match's shared random numbers, so every machine picks the same.
- The hero goes into the pool, not onto the map ([companies](companies.toml#heroes)).
'''

[[topic.rule]]
id = "kingdom-loses-hero"
tags = ["code", "guess"]
text = '''
`kingdom_loses_hero` (`ma_kingdom`, `ma_hero`), Kohan II:
- with `mi_hero_named`, the hero leaves the side's pool, but only while it's in the pool (available, or dead and healing); a hero leading a company on the map isn't taken and the effect fails;
- with `mi_hero_random`, one hero is picked at random from the side's `random_hero` heroes that are in the pool, as above, and taken.
'''

[[topic.rule]]
id = "play-sound"
tags = ["code", "data"]
text = '''`play_sound` (`ma_sound`): plays that sound (`mi_sound`, an `[Audio]` id such as `arctic_bed`) for every player.'''

[[topic.rule]]
id = "play-sound-at-location"
tags = ["code"]
text = '''`play_sound_at_location` (`ma_sound`, `ma_location`): the same, placed at that point on the map.'''

[[topic.rule]]
id = "sounds-heard-by-all"
tags = ["code", "data"]
text = '''Either way every player hears it, whatever the sound's `who_flags`: a trigger's sound belongs to no side. How loud it is follows the sound's own definition ([sounds](sounds.toml)): one without `WORLD` in its `control_flags` (the shipped ambient beds, `company_engaged_sfx`) plays at its volume for everyone, wherever they look; a `WORLD` sound at a place is heard only by a player whose view is within the far end of its `range` of that place, quieter with distance, unless its `world_flags` has `GLOBAL`.'''

[[topic.rule]]
id = "objective-gain-effects"
tags = ["code"]
text = '''`kingdom_gains_objective` and `objective_complete_for_kingdom`: in [objectives](objectives.toml). `kingdom_mission_won`: in [outcome](outcome.toml#triggers).'''

[[topic.rule]]
id = "global-set-sun-colors"
tags = ["code", "data", "guess"]
text = '''`global_set_sun_colors` (`ma_sun`, `ma_value`): changes the map's lighting to that sun definition (`sun_night`, `sun_dusk`), over the value in seconds (0 at once; AA's maps use 3600 to change slowly through an hour); see [lighting](lighting.toml#changes-during-play).'''

[[topic.rule]]
id = "actor-moves-to-location"
tags = ["code", "data", "guess"]
text = '''
`actor_moves_to_location` (`ma_actor`, `ma_location`, `ma_value`): the thing, if it can move (it moves itself or is a regiment), is given a move order there, as in [Orders](#orders). The value is the speed to move at, as a fraction of the thing's top speed (0.5 = half speed); 0 means top speed, and a regiment never goes faster than its top speed. The multiplayer maps give 0; two campaign intros move slower (`allies01_el_alamein` 0.5, `allies09_battle_of_the_bulge` 0.8).
- The fraction is of the top speed at the moment of the order: a lone unit's own, a regiment's (its slowest member's, [movement](movement.toml#a-regiments-speed)). A regiment hands the slower speed to every member, as for any move that carries a speed, so the whole regiment keeps formation at it.
- It holds for the whole of that move: through every fight on the way (the move resumes at the same speed when a fight ends) until it arrives or a new order replaces the move. Any later order, a person's or a trigger's, brings its own speed: a person's is always top speed.
- Fails if the thing names nothing or can't move, or if the order is refused (below); otherwise succeeds.
'''

[[topic.rule]]
id = "actor-transfer-control"
tags = ["code"]
text = '''`actor_transfer_control_to_kingdom` (`ma_actor`, `ma_kingdom`): the thing changes side to that kingdom, as a capture does.'''

[[topic.rule]]
id = "sai-disabled-multiplayer"
tags = []
text = '''`sai_disabled_for_kingdom` and `sai_disabled_for_actor`: in [Computer control](#computer-control).'''

[[topic]]
title = "Morale and experience"

[[topic.rule]]
id = "morale-effects-anywhere"
tags = ["code"]
text = '''Both games. Neither effect cares where the thing is or what it's doing: on the move, fighting, routing or aboard a transport. A regiment whose last unit has died is gone before the triggers are next tested ([combat](combat.toml#leaving-the-map)); one killed during the trigger pass itself is still found by later triggers that tick, and while dying can still gain morale and experience (passing the experience on to its side) but loses no morale.'''

[[topic.rule]]
id = "actor-modify-morale"
tags = ["code"]
text = '''
`actor_modify_morale` (`ma_actor`, `ma_value`): adds the value to a regiment's morale; a negative value takes it away.
- The regiment is the thing itself, or, for a unit (or an unpacked building, or a Kohan II hero) that is a member of one, its regiment. Changing a unit's morale changes its whole regiment's.
- A thing that is neither a regiment nor in one (a lone building, a bunker) has no morale: the effect fails and nothing changes. So does a value of exactly 0, or a parameter that names nothing.
- A gain or loss then follows the rules for any other gain or loss ([morale](morale.toml#losing-morale)): kept within 0 and the maximum, routing at once on falling to or below the breakpoint, the fall-straight-to-0 rule, no loss while unpacked. BERSERK doesn't stop it.
'''

[[topic.rule]]
id = "actor-gains-experience"
tags = ["code"]
text = '''
`actor_gains_experience` (`ma_actor`, `ma_value`): the value is added to the regiment's experience as a gain earned in play would be, with all that follows: new levels and their message, the side's share in AA, and in Kohan II the company's hero ([morale](morale.toml#a-regiments-experience), [special operations](special-ops.toml#earning-experience)).
- Only a regiment itself takes it. Naming one of its units (a Kohan II hero included), or a thing in no regiment, gives nothing to anyone.
- A value below 0.0001, negatives included, gives nothing: a trigger can't take experience away.
- The effect fails only when the parameter names nothing; a thing that takes nothing still counts as success.
'''

[[topic.rule]]
id = "actor-set-experience-max"
tags = ["code", "data"]
text = '''`actor_set_experience_max` (`ma_kingdom`, `ma_hero`, `ma_value`), Kohan II's maps only, though both games have it: sets a ceiling on the named hero's experience (`mi_hero_named`, one of the side's heroes, in its pool or leading a company). A value of 0 or less means no ceiling, which is where every hero starts. While the hero leads a company, each gain it gets is cut back to the ceiling, so experience already above it is cut only at its next gain. It fails with `mi_hero_random`, or when the side doesn't hold that hero. It has nothing to do with regiments or the side's own experience.'''

[[topic]]
title = "Technologies"
intro = '''How a side holds a technology, from one grant or several, is under [research](research.toml#how-a-side-gets-and-loses-technologies).'''

[[topic.rule]]
id = "technology-parameters"
tags = ["code", "data"]
text = '''These elements take a kingdom or a thing, then the technology (`ma_technology`), named by its id. Any property can be named, not only one marked `is_technology`; restrictions bar only technologies. Each succeeds whenever both parameters name something, whether or not anything changed.'''

[[topic.rule]]
id = "kingdom-gains-technology"
tags = ["code"]
text = '''`kingdom_gains_technology` (`ma_kingdom`, `ma_technology`): gives the side a grant of the technology, as research would, but saying "technology gained" when it's new to the side. Already having it adds a silent grant; a technology barred for the side isn't given and nothing is said. With `mi_kingdom_all` every side but the independent ones gets a grant, each told for itself.'''

[[topic.rule]]
id = "kingdom-loses-technology"
tags = ["code"]
text = '''
`kingdom_loses_technology` (AA; `ma_kingdom`, `ma_technology`): takes away one of the side's grants of the technology that came from research or from `kingdom_gains_technology`. Those grants are alike, so which of them makes no difference; one is taken per run, so a side given it twice by trigger needs two. Start technologies, the handicap's and buildings' grants are never taken. So:
- the side loses the technology, with "technology lost", only when the grant taken was its last;
- with another grant left (a crate standing, a second trigger grant) it keeps the technology and nothing is said;
- with no research or trigger grant (none at all, or only a start technology or a building's), nothing happens.
- `mi_kingdom_all` gives no kingdom here, so it fails.
'''

[[topic.rule]]
id = "actor-gains-technology"
tags = ["code"]
text = '''
`actor_gains_technology` (`ma_actor`, `ma_technology`): gives the thing the property for itself, as if its own `[PropertiesComponent]` listed it: it counts for that thing alone, not its side, and doesn't appear in the technology display. Nothing is posted, and restrictions aren't checked: a technology barred for its side is given too.
- Nothing happens to a thing with no `[PropertiesComponent]`, or one that doesn't meet the property's `required_properties`. A regiment meets them when it or any of its members does, as for terrain properties ([terrain](terrain.toml#terrain-properties)).
- On a regiment it goes on the regiment, and its members get it as they get any of the regiment's properties, unless it's `pass_down_members = false` ([movement](movement.toml#a-units-top-speed)).
- A thing that already has the property, from its side or anywhere else, keeps it once: copies are held apart as a side's grants are, and the effects come once.
- It stays through a change of hands: the side's technologies come and go with the side, this one stays with the thing. It lasts until `actor_loses_technology` or the thing is gone.
'''

[[topic.rule]]
id = "actor-loses-technology"
tags = ["code", "guess"]
text = '''`actor_loses_technology` (`ma_actor`, `ma_technology`): takes away one of the thing's copies of the property, any but those its side's buildings, start technologies, handicap or general put on it: one given by `actor_gains_technology`, a `LOCAL` research result, one its template lists, or the copy its side's research or trigger grant put on it. So it can strip a side's researched technology from one thing while the side keeps it; the thing goes without until it joins another side that has it. A thing with another copy left keeps the effect. Nothing is posted.'''

[[topic.rule]]
id = "kingdom-has-technology"
tags = ["code"]
text = '''`kingdom_has_technology` (AA condition; `ma_kingdom`, `ma_technology`): true while the side holds any grant of the technology, from any source: research, the map's start technologies, the handicap, a building (a crate counts while it stands, its remains included) or a trigger. A barred technology is never held. Things' own copies (`actor_gains_technology`, `LOCAL` research, a template's own properties) don't count, nor do an ally's technologies.'''

[[topic]]
title = "Variables and switching triggers"

[[topic.rule]]
id = "set-variable"
tags = ["code"]
text = '''Trigger variables are the TRIGGERS section's named numbers (none in any shipped multiplayer map). `set_variable` (`ma_variable`, `ma_value`) sets one, making it if there's none of that name (a variable needs a name: an empty one fails). `incr_variable` and `decr_variable` add or take away the value from an existing one, and fail if it doesn't exist. A number parameter with `mi_variable` reads one.'''

[[topic.rule]]
id = "delays"
tags = ["code", "data"]
text = '''There are no timers of their own: a delay is a trigger switched on at the right moment with an `activation_time` condition.'''

[[topic.rule]]
id = "switching-triggers"
tags = ["code"]
text = '''`trigger_active` (`ma_trigger`, `mi_trigger`): switches on the trigger with that id and sets its activation time to now; it fails, changing nothing, if that trigger is already on or doesn't exist. `trigger_deactive` switches one off; it fails if it's already off. A trigger switched on is tested from the next trigger in list order on, so if it comes later in the list it's tested in the same tick.'''

[[topic.rule]]
id = "variables-campaign-only"
tags = ["data"]
text = '''No shipped multiplayer map uses variables or switches triggers; campaign maps do both.'''

[[topic]]
title = "Conditions the campaign maps use"

[[topic.rule]]
id = "missing-thing-false"
tags = ["code"]
text = '''Where a condition names a thing that doesn't exist (gone, or never made), it's false. The only exception is `actor_is_dead`. Both `actor_has_state` and `actor_does_not_have_state` are false for a thing that isn't there.'''

[[topic.rule]]
id = "actor-is-dead"
tags = ["code"]
text = '''`actor_is_dead` (`ma_actor`): true once the thing is dying (from the moment it dies, while its body lies there) or is no longer on the map. A parameter naming nothing (a name nobody bears, an id that's gone) also counts as dead.'''

[[topic.rule]]
id = "actor-owned-by-kingdom"
tags = ["code"]
text = '''`actor_owned_by_kingdom` (`ma_actor`, `ma_kingdom`): the thing belongs to that side now.'''

[[topic.rule]]
id = "actor-comparison-life"
tags = ["code", "data"]
text = '''`actor_comparison_life` (`ma_actor`, `ma_compare`, `ma_value`): the thing's health against the value as a percentage of its maximum (`at least 99` means at least 99% health). A thing with no health of its own, a regiment included, is false. The campaigns' "at least 0" is a test that the thing still exists.'''

[[topic.rule]]
id = "actor-comparison-morale"
tags = ["code"]
text = '''`actor_comparison_morale` (`ma_actor`, `ma_compare`, `ma_value`): the same for a regiment's morale against its maximum. Anything but a regiment itself is false. Both games have it; only Kohan II's maps use it.'''

[[topic.rule]]
id = "actor-has-state"
tags = ["code", "data"]
text = '''
`actor_has_state` (`ma_actor`, `ma_state`): the thing is in that state now; `actor_does_not_have_state` is its opposite. Only the thing's own states count: a regiment's are its own, not its units'.
- `mi_state` is a number, fixed by the game. The states, by number: 0 `mind_attacking`, 1 `mind_bombard`, 2 `mind_building`, 3 `mind_chasing`, 4 `mind_engaged`, 5 `mind_exhausted`, 6 `mind_guarding`, 7 `mind_joining`, 8 `mind_moving`, 9 `mind_reattaching`, 10 `mind_regrouping`, 11 `mind_repairing`, 12 `mind_resting`, 13 `mind_retreating`, 14 `mind_routing`, 15 `mind_reforming`, 16 `mind_exploring`, 17 `mind_rampaging`, 18 `mind_razing`, 19 `out_of_supply`, 20 `under_siege`, 21 `construction`, 22 `organization_entrenched`, 23 `dead`, 24 `falling`, 25 `structure_packing`, 26 `structure_unpacking`, 27 `structure_normal`, 28 `structure_researching`, 29 `structure_upgrading`, 30 `structure_razing`, 31 `structure_recruiting`, 32 `active_construction`, 33 `summoning`, 34 `unpacked`, 35 `mind_packing`, 36 `mind_unpacking`, 37 `missing_primary`, 38 `unloading`, 39 `disabled`, 40 `targeted`, 41 `hq_attached`. The names are the `IDS` of `Game/actor_states.tgi`, whose own order differs.
- The campaigns test attacking (0), engaged (4), moving (8), retreating (13), routing (14), out of supply (19) and attached to an HQ (41).
'''

[[topic.rule]]
id = "actor-inside-area"
tags = ["code", "data"]
text = '''
`actor_inside_area` (`ma_actor`, `ma_area`): tested now, not from the area's list.
- A named thing: true when its soft shape, placed at its position and turned to its facing, overlaps the area's own outline, turned to the area's facing; touching counts. This is the exact outline, stricter than [who is in an area](#who-is-in-an-area): a thing can have entered without being inside by this test. A named regiment is tested by its position with its soft radius of 1. A thing that names nothing makes it false.
- With `mi_actor_any`: true if anything counts as in the area by the looser test of [who is in an area](#who-is-in-an-area), regiments included, of any side.
- The first one found becomes the condition thing (`mi_actor_condition`); the others are ignored. The search goes over the map's tiles under the area row by row, from the lowest y and, within a row, the lowest x; the first tile holding such a thing gives it. Which of several things in that one tile comes first isn't defined, so a regiment or one of its units can be the one. Ownership isn't considered.
- The one shipped use, Hawaii's spy, tests "anything in the area" and then that the condition thing belongs to the player's side, so a thing of another side found first makes it false that tick.
'''

[[topic.rule]]
id = "actor-selected-by-kingdom"
tags = ["code", "guess"]
text = '''`actor_selected_by_kingdom` (`ma_actor`, `ma_kingdom`): the thing is in the current selection of the player playing that side. Clicking a unit selects its regiment ([selection](selection.toml)), so name the regiment. A side with no player selecting things is never true. `actor_data_selected_by_kingdom` (`ma_actor_data`, `ma_kingdom`): any thing of that exact template is in that selection. The selection is the one every machine knows, kept in step by the player's selection orders.'''

[[topic.rule]]
id = "actor-visible-to-kingdom"
tags = ["code"]
text = '''`actor_visible_to_kingdom` (`ma_actor`, `ma_kingdom`): the side can see the thing now, under the [fog](fog.toml) rules: allies' sight shared, everything visible with the fog off, and a regiment visible when any of its units is (a unit, when any unit of its regiment is). No shipped AA map uses it.'''

[[topic.rule]]
id = "actor-explored-to-kingdom"
tags = ["code", "guess"]
text = '''Kohan II: `actor_explored_to_kingdom` (`ma_actor`, `ma_kingdom`): the ground the thing stands on has been explored by the side (or, the same way, any of its regiment's).'''

[[topic.rule]]
id = "difficulty-compare"
tags = ["code", "data", "guess"]
text = '''
`difficulty_compare_difficulty` (`ma_difficulty_level` twice, `ma_compare`): compares two difficulty levels. `mi_difficulty_level_map` is the match's difficulty (the `DifficultyLevel` rule), and `mi_difficulty_level_specified` names a level (`easy`, `medium`, `hard`). Each level is its place in `Game/difficulty_level.tgi`'s list (easy 0, medium 1, hard 2), on both sides of the comparison, so they rank in that order.
- The campaigns only test "equal" against `easy` and `hard`, nearly always to give a side technologies at that level.
- Nothing else in a mission reads the difficulty: not the computer players, nor handicaps ([campaigns](campaigns.toml#difficulty)). Outside triggers it's read only when a random map is made.
'''

[[topic.rule]]
id = "objective-conditions"
tags = []
text = '''`objective_succeeded` and `objective_failed` (`ma_objective`, `ma_kingdom`): in [objectives](objectives.toml).'''

[[topic.rule]]
id = "kingdom-default-lose"
tags = ["code", "data"]
text = '''`kingdom_default_lose` (`ma_kingdom`): true while the side meets the default defeat rule's test ([outcome](outcome.toml#the-default-defeat-rule)): it has nothing that keeps it alive and, with `TeamVictory` on, neither does any team-mate. The rule's switch and timing make no difference. The campaigns use it on several sides.'''

[[topic.rule]]
id = "kingdom-has-no-settlements"
tags = ["code", "data"]
text = '''`kingdom_has_no_settlements` (`ma_kingdom`): Kohan II's test that the side holds no settlement. In AA, where no side holds settlements, it's always true. No shipped map uses it.'''

[[topic]]
title = "Scripted scenes"

[[topic.rule]]
id = "mission-intros"
tags = ["data"]
text = '''Every campaign mission's intro is built the same way (Map Init / "Intro - Begin" triggers, then "Intro - Step" triggers chained by `trigger_active` and `activation_time`, then "Intro - End"): screen fade and letterbox on at once, cutscene mode on, camera pans and speech, then letterbox off over 3–5 seconds, fade off over 1–3 seconds, cutscene mode off.'''

[[topic.rule]]
id = "cutscene-mode"
tags = ["code", "game", "data", "guess"]
text = '''
`global_toggle_cutscene_mode` (`ma_boolean`):
- On: the game speed goes to normal (100%), whatever the player had set, and the speed the player had is remembered; off: that speed is restored. Switching to the state it's already in changes nothing.
- While on: the player can't change the game speed or pause; computer players don't think (they give no new orders; their things carry on with what they were doing and still fight for themselves); no game events are raised, so no alert lines or event sounds ([game-events](game-events.toml)); visual effects marked `show_in_cutscene = false` (the speed and resupply decals) are hidden; the camera is free of its usual height limits.
- Switching it off also puts the camera back to its default zoom and angle, keeping where it looks.
- While on, the player's input goes to the cutscene alone: clicks on the map or the interface and every key do nothing, except Esc (skip), Print Screen (screenshot) and Pause, which does nothing because pausing isn't allowed. So the player can't give orders during a cutscene, letterbox or not.
- Esc skips a scripted cutscene: the game runs at its fastest film speed (`GameSpeedFilmMax`, ×16), and instead of the map the screen shows only "Please wait while advancing cutscene..." (`ui_skipping_cutscene`). Esc again stops skipping and goes back to the remembered speed. Skipping ends when the map switches cutscene mode off, which restores the remembered speed. It only hurries the scene on: even after the match is decided it doesn't end the mission (in every shipped map; the map type that would is never used).
- While skipping with the letterbox on, speech isn't played (other sounds are); each line's subtitle is shown at once instead.
- If the player's side wins or loses while cutscene mode is on, alone or as host, no outcome dialog opens: the mission ends at once, as End Mission would ([outcome](outcome.toml#what-the-player-sees)).
'''

[[topic.rule]]
id = "letterbox"
tags = ["code", "game", "data"]
text = '''
`global_toggle_letterbox` (`ma_boolean`, `ma_value` seconds): two black bars across the full width of the screen, one at the top and one at the bottom. Fully in, each bar is `LetterboxHeightRatio` (AVars, 0.22222) of the whole screen's height, so the middle 56% of the screen still shows the map (171 of 768 pixels each at 1024×768).
- On: both bars grow out from the screen's top and bottom edges at a steady rate, from nothing to full height over the seconds (0: at once). Off: they shrink back into the edges at a steady rate over the seconds.
'''

[[topic.rule]]
id = "letterbox-interface"
tags = ["code", "data"]
text = '''
The letterbox hides the interface from the moment it's switched on, as the bars start to grow, until the bars have gone completely after it's switched off; then the interface is back as it was.
- What it hides is every widget whose `render_threshold` is below 20: the whole in-match interface (unset, so 10), banner text and message log lines included, and the map view (`VWorld`, 15). The map view widget draws nothing itself: it's what takes clicks on the map. Hidden widgets take no clicks or hotkeys either, so while the letterbox is on, clicks on the map do nothing and the hotkeys bound to the map view (pause, game speed, chat) don't work.
- What stays: the subtitle panel, game menu, message boxes and console (20).
'''

[[topic.rule]]
id = "letterbox-map"
tags = ["code", "game"]
text = '''Between the bars the map is drawn as usual: the scene, its things moving and its effects playing. The letterbox itself hides nothing in the scene. Health bars and selection marks are hidden by cutscene mode, not by the letterbox ([object-display](object-display.toml#bars-hidden-states)), which is why the intros show none.'''

[[topic.rule]]
id = "screenfade"
tags = ["code", "data"]
text = '''`global_toggle_screenfade` (`ma_boolean`, `ma_value` seconds): a black layer over the whole screen. On: its opacity rises at a steady rate from clear to fully black over the seconds (0: at once); off: it falls back to clear the same way. Missions start with it on at 0 so the first frame is black. It hides no interface and blocks no input of its own.'''

[[topic.rule]]
id = "bars-fade-draw-order"
tags = ["code", "data"]
text = '''Bars and fade are drawn over the whole map, everything in the scene included (health bars, text floating over the map), and the fade over the bars. Everything the interface is showing is drawn over both: the subtitle panel (which sits over the bottom bar), the game menu, message boxes and console, and, once the letterbox has gone, the in-match interface with its banner text and message lines. So when the letterbox goes before the fade, as in the intros, the interface comes back over a still-black screen and the map fades in under it.'''

[[topic.rule]]
id = "bars-fade-retoggle"
tags = ["code"]
text = '''
Bars and fade each restart from the moment the effect runs, wherever they were:
- On while already on, fully or still coming in or going out: it starts again from nothing, so the bars vanish and grow again, or the screen jumps clear and darkens again. Run again in the same tick with the same seconds, it changes nothing.
- Off while on, fully or still coming in, or while still going out: it jumps to full (bars fully in, screen fully black) and goes out from there over the new seconds.
- Off while already off: the same, so with seconds above 0 the bars appear at full height and shrink away (the interface hidden until they've gone), or the screen goes black and clears.
- Only the last toggle of each in a tick counts.
'''

[[topic.rule]]
id = "bars-fade-game-time"
tags = ["code"]
text = '''Both bars and fade count game time, the match's clock as the player's screen shows it, from the moment the effect runs. They stand still while the game is paused and go faster with the game speed: while a cutscene is being skipped at ×16, a 4-second slide is over in a quarter of a second. While skipping, the screen shows only the wait message, so they aren't seen, but they move on underneath.'''

[[topic.rule]]
id = "play-speech"
tags = ["code", "data"]
text = '''
`play_speech` (`ma_speech`, an `AudioCutscene` `[Audio]` id such as `t1l02_tutor`): plays the line for every player, not placed on the map. Its subtitle is under [Subtitles](#subtitles).
- Only one speech line plays at a time, and lines don't wait for one another: a new line cuts off the one playing (speech is `INTERRUPT`) and plays from its start in its place. The line cut off stops at once (`AudioSpeech` has no fade, `fade_time_s` 0).
- The same line asked for again while it plays starts over from the beginning; it never plays twice at once.
- When no line is playing yet but one is waiting to start, a new line takes the waiting one's place: the waiting line is dropped without playing and without its subtitle. So when several lines are asked for in one tick, only the last plays.
- Speech never cuts off music or other sounds, nor they speech; they are counted apart.
- While a line plays, music, interface sounds and world sounds are turned down (speech is `CAUSEFADE`; how far and how fast is in [music](music.toml#causefade-ducking)). A line that hasn't started within `AudioDropTimeout` (5 s) of being asked for is dropped.
- While skipping a cutscene with the letterbox on, the line playing stops at once and new lines aren't played.
'''

[[topic.rule]]
id = "speech-paused"
tags = ["code"]
text = '''Speech pauses with the game: a line playing when the game pauses stops where it is and carries on from there when the game runs again, and a line started while paused waits, paused, until then. (Music doesn't pause: [music](music.toml).) The game's speed doesn't change how fast a line plays.'''

[[topic.rule]]
id = "speech-unknown-id"
tags = ["code"]
text = '''A `play_speech` whose id names no `[Audio]` entry is reported as an error in the game's log when the map loads, and does nothing when it runs: no sound, no subtitle, nothing turned down. The effect still counts as carried out.'''

[[topic.rule]]
id = "banner-text"
tags = ["code", "data"]
text = '''`display_banner_text_fade` (`ma_localized_string`, `ma_value` seconds): shows the map's string (its id, such as `trigger_63_element_2`, names a string the map carries) in the banner panel (`UI/Shared/display_banner.tgi`: yellow text on the `TextBackDrop.tga` backdrop, lower left of centre). It has no side: every player sees it, on every machine. It posts nothing to the message log. A string with no text takes away the banner showing and shows nothing.'''

[[topic.rule]]
id = "banner-fade"
tags = ["code", "data"]
text = '''
The banner appears at once, fully opaque, with no fade in. It stays for the seconds, then text and backdrop fade out together, steadily, from opaque to clear over `BannerFadeDurationMS` (`AVars.tgi`, 1000: one second), and it's gone.
- The seconds and the fade are counted in real time, so game speed doesn't change them, but both stand still while the game is paused and carry on from where they were when it's unpaused. A banner shown during a pause waits for the unpause before its time starts.
- The seconds count to the thousandth, any finer part dropped. 0 shows the banner and starts the fade straight away. A negative value never runs out: the banner stays, unfaded, until another replaces it.
- The time runs on while the letterbox hides the banner, so a banner whose time and fade are over by the time the letterbox goes isn't seen at all.
'''

[[topic.rule]]
id = "banner-replaced"
tags = ["code"]
text = '''One banner shows at a time. A new one replaces the one showing at once, opaque again and with its own seconds, whether the old one was still waiting or already fading.'''

[[topic.rule]]
id = "banner-size"
tags = ["code", "data"]
text = '''
The panel keeps its layout's left (68), top (420) and width (545, on the 1024 by 768 layout) and fits its height to the text: the text is wrapped over as many lines as it needs at the label's width (535, 5 pixels in from the left and top), and the panel, backdrop included, is made as tall as those lines plus 10 pixels. So a short banner is a one-line strip and a long one grows downwards; the layout's 65 is never used.
- The label itself keeps its layout height (50), about two lines: a text longer than that probably draws past it, over the grown backdrop, rather than being cut off.
'''

[[topic.rule]]
id = "display-message"
tags = []
text = '''`kingdom_display_message`: in [messages](messages.toml).'''

[[topic.rule]]
id = "play-cutscene"
tags = ["code", "data", "guess"]
text = '''
`play_cutscene` (`ma_string`, a video path such as `/Video/Campaign/AxisVictory.bik`): plays the video full screen over the match, which carries on underneath, unpaused; when it ends, a `cutscene_complete` event naming it is raised. The two final missions use it after victory and wait out its length with `activation_time` (58 seconds) before `kingdom_mission_won`.
- Esc stops the video early, which counts as its end and raises the event too. A mission that waits by `activation_time` still waits the full time after a skipped video.
'''

[[topic.rule]]
id = "game-speed-set"
tags = ["code", "data"]
text = '''`game_speed_set` (`ma_value`): sets the game speed to the value times normal (2 = double, 0.5 = half), held within `GameSpeedMin` and `GameSpeedMax` (25% to 400%; while cutscene mode is on, the film limits). A value of 0 or less fails. No shipped map uses it.'''

[[topic.rule]]
id = "sun-dimmer"
tags = []
text = '''`global_adjust_sun_dimmer`: in [lighting](lighting.toml#changes-during-play).'''

[[topic.rule]]
id = "change-weather"
tags = ["code", "guess"]
text = '''`change_weather` (`ma_weather`, `snow_heavy` or `rain_heavy`): switches the map's weather to that one (falling snow or rain); it only changes the look. Always succeeds.'''

[[topic.rule]]
id = "vfx-at-location"
tags = ["code", "data"]
text = '''`vfx_at_location` (`ma_vfx`, `ma_location`) plays the effect once at the place; `vfx_at_location_with_rotation` adds `ma_value`, degrees to turn it about the vertical. Used for explosions (`water_explosion_3`, `v1_explosion`).'''

[[topic]]
title = "Subtitles"
under = "Scripted scenes"
intro = '''A speech entry's `[Subtitle]` (`duration`, `text`, `portrait_IDS`, `ldf_speaker`; `Templates/template_audio.tgi`) is the text shown while its line plays.'''

[[topic.rule]]
id = "subtitle-when"
tags = ["code", "data"]
text = '''
A line's subtitle starts when the line starts playing, not when it's asked for, as long as `ViewShowSubtitles` is on and the subtitle's length (below) is above 0.
- A line that can't be played (while skipping with the letterbox on) shows its subtitle at once instead, for the entry's `ldf_length` seconds.
- A line dropped while waiting to start shows no subtitle.
'''

[[topic.rule]]
id = "subtitle-length"
tags = ["code", "data"]
text = '''A subtitle lasts its `duration` in seconds. A `duration` of 0, which every shipped entry has, means the length of the line's sound file, measured when the data loads; so the subtitle lasts exactly as long as the speech. `ldf_length` is used only for a line that can't be played (above).'''

[[topic.rule]]
id = "subtitle-parts"
tags = ["code", "data"]
text = '''
The text is shown a part at a time, each part replacing the last:
- A part is as much of the text still to show as fits the text box, all its lines filled; if a full stop falls within that, the part ends after the last full stop that fits, so parts break between sentences where they can.
- Each part is shown for its share of the subtitle's length, by characters: the length × the part's characters ÷ the whole text's characters. When the last part's time is up, the subtitle goes.
- The time is counted in real time, standing still while the game is paused, so the parts keep pace with the speech whatever the game speed.
'''

[[topic.rule]]
id = "subtitle-replaced"
tags = ["code"]
text = '''One subtitle shows at a time. When a new line starts playing, its subtitle replaces the one showing at once, starting from its first part. A line cut off by another loses its subtitle as the new line starts, which is straight away. When skipping starts with the letterbox on, the subtitle showing goes with the line.'''

[[topic.rule]]
id = "subtitle-panel"
tags = ["code", "data"]
text = '''
The subtitle shows in the `Subtitles` panel of `UI/Game/game_interface.tgi`: 615 to 725 pixels down and 20% to 80% across a 768-high screen, so inside the bottom letterbox bar. It has no backdrop: just the text, small, centred and wrapped over as many lines as the box holds (`SharedSmallCenteredLabelVE`).
- With no portrait, which is every shipped line (none sets `portrait_IDS`), the text uses `LabelNoModel`, the panel's whole width, and the `Model` slot is hidden.
- A line with a `portrait_IDS` would show that model in the `Model` slot at the left (75 pixels wide) and the text beside it in `Label`.
- `ldf_speaker` is never shown: it's a note for translators. No speaker's name appears with the text.
'''

[[topic.rule]]
id = "subtitle-outside-letterbox"
tags = ["code", "data"]
text = '''
A line that starts while the letterbox is off is subtitled in the same panel and, as well:
- by one line in the message log with the whole text, posted once as the line starts: kind `TUTORIAL` (white, `IconGenericEvent.png`), with no speaker or other prefix and no location. It's posted like any other line, so it stays in the message log's history and fades from the screen as other lines do ([messages](messages.toml)); with the Tutorial message filter (`UIMessageFilterTutorial`) off it isn't posted at all.
- by the banner panel (where `display_banner_text_fade` shows), which shows the same text, opaque, a part at a time in step with the panel, for as long as the letterbox stays off. Its parts are cut to fit the banner's label (535 by 50), so they can be shorter and more than the panel's, each still shown for its share by characters, and the banner fits its height to each part as it does any text.
'''

[[topic.rule]]
id = "subtitle-banner-end"
tags = ["code", "data"]
text = '''
How the banner's copy of a subtitle ends:
- When the subtitle ends, its last part goes from the banner at once, with no fade. If the panel's parts run out a moment (a few thousandths of a second) before the banner's, the banner shows out that moment and then fades over `BannerFadeDurationMS`, as a trigger's banner does.
- A subtitle taken away early with nothing in its place (`ViewShowSubtitles` turned off) leaves its part in the banner for what remained of that part's time, then it fades the same way. One replaced by a new subtitle gives the banner straight to the new one's first part.
- The letterbox coming on stops the banner's copy where it is: the part showing keeps what remained of its time and its fade, hidden by the letterbox, and the copy picks up again, at the subtitle's current part, if the letterbox goes while the subtitle still runs.
'''

[[topic.rule]]
id = "subtitle-banner-and-trigger-banner"
tags = ["code"]
text = '''While a subtitle is in the banner it holds it: a trigger's `display_banner_text_fade` showing then is replaced by the subtitle's part on the next frame, so it isn't seen, and doesn't come back when the subtitle ends. A subtitle starting while a trigger's banner shows replaces that banner at once.'''

[[topic.rule]]
id = "subtitle-panel-under-control-panel"
tags = ["guess"]
text = '''Outside the letterbox the `Subtitles` panel lies where the control panel is, at the bottom of the screen, and is probably hidden under it; the banner and the message log line are what the player reads.'''

[[topic.rule]]
id = "subtitles-option"
tags = ["code", "data"]
text = '''`ViewShowSubtitles` (`UVars.tgi`, true) isn't in the options window. It can be changed only as a user setting: `ViewShowSubtitles=false` on the command line, in `User/UVars.tgi`, or with the console's `set` or `ToggleUVar`. Off, no subtitle shows in any form (panel, banner or message log line). Turning it off while one shows takes it from the panel at once; its part in the banner stays out that part's time and fades ([above](#subtitle-banner-end)).'''

[[topic]]
title = "The camera"

[[topic.rule]]
id = "camera-per-side"
tags = ["code", "guess"]
text = '''Each of these is for one side (`ma_kingdom`): only the player of that side sees it.'''

[[topic.rule]]
id = "camera-pan"
tags = ["code", "data"]
text = '''`camera_pans_to_camera_over_time` (`ma_kingdom`, `ma_camera`, `ma_value` seconds, `ma_boolean`): the view moves from where it is to the camera object's (one placed in the map, by its id): the point it looks at, its zoom and its angle, over the seconds (0 jumps). The boolean eases the move in and out (slow start and stop) instead of a steady glide. The seconds are game time.'''

[[topic.rule]]
id = "camera-pan-realtime"
tags = ["code"]
text = '''`camera_pans_to_camera_over_time_in_realtime` (`ma_kingdom`, `ma_camera`, `ma_value`): the same, never eased, timed in real time, so game speed doesn't change it.'''

[[topic.rule]]
id = "camera-return-default"
tags = ["code", "data"]
text = '''`camera_returns_to_default_over_time` (`ma_kingdom`, `ma_location`, `ma_value` seconds): the view moves over the seconds to look at the place with the default zoom and angle, not eased.'''

[[topic.rule]]
id = "camera-failures"
tags = ["code"]
text = '''Fails when the side or camera names nothing.'''

[[topic]]
title = "Pointing things out (the tutorial)"

[[topic.rule]]
id = "flash-actor"
tags = ["code", "data"]
text = '''`flash_actor` (`ma_actor`): the thing flashes as an order's target does when picked ([commands](commands.toml)); on a regiment, its units flash too. Fails if it names nothing. Tutorial 1 repeats it every second on its infantry regiment until it's selected.'''

[[topic.rule]]
id = "flash-ui-button"
tags = ["code", "data"]
text = '''`flash_ui_button` (`ma_script_command`, a button's script command such as `ActorCommand recruit`, `MessageLogToggle`, `GoToTeamCommands`, `UseFactionAbility 0`, `ShowFloater 2`): makes the in-match interface button that carries that command flash. Fails when no button on the interface carries it (for an action button, when nothing selected shows it).'''

[[topic.rule]]
id = "ui-script-listen"
tags = ["code", "data", "guess"]
text = '''`effect_ui_script_listen` (`ma_script_command`, `ma_boolean`): true starts listening for that interface command, false stops (and fails if it wasn't being listened for). While it's listened for, each time the player uses it (by button or key) a script event naming it is raised for `event_script_heard`; the command still does what it always does. The command must match in full, ignoring case (`ActorCommand recruit` doesn't match `ActorCommand recruit_location`). What's listened for is kept in a saved game.'''

[[topic.rule]]
id = "team-command-flare"
tags = ["code", "data", "guess"]
text = '''`team_command_flare_on_position` (`ma_flare_data_location`, `ma_kingdom`, `ma_location`, `ma_value` seconds) and `team_command_flare_on_actor` (`ma_flare_data_actor`, `ma_kingdom`, `ma_actor`, `ma_value`): place a team-command flare (`attack_location_flare`, `defend_actor_flare`; [team commands](team-commands.toml)) for that side as its player would, lasting the seconds (maps use 300 to 10⁹, in effect for good; a negative value takes the flare's own). Computer players of that side's team take it as a request at priority `SAITriggerTeamCommandPriority` (20000), above their own plans; this is how missions point computer allies at a goal.'''

[[topic]]
title = "Making and removing things"

[[topic.rule]]
id = "actor-create-named"
tags = ["code", "data"]
text = '''`actor_create_named` (`ma_actor_data`, `ma_kingdom`, `ma_location`, `ma_string` name): makes the template for the side at the nearest clear spot within 8 of the place, with the name (empty for none). `organization_create_named`, `unit_create_named` and `building_create_named` are the same effect, the editor offering only that kind of template (their template parameter is `ma_unit_data` with `mi_unit_data`, or `ma_organization_data` with `mi_organization_data`, looked up by id as `mi_actor_data_named` is). Campaigns mostly make objective markers (`thing_objective_primary01`) and sight-givers (`thing_visibilityactorsmall`) this way, and remove them by name later.'''

[[topic.rule]]
id = "create-failures"
tags = ["code"]
text = '''
It fails, making nothing, when:
- the template names nothing (an empty template, say; the place it gives doesn't matter);
- the side names nothing. That includes `mi_kingdom_id` with id 0: no thing ever has id 0. A side is needed even for a template that can't be owned (below);
- no clear spot is found;
- the name isn't empty and a thing still in the world already bears it (matched regardless of case; a dying thing still bears it). A name whose last bearer has been taken off the map is free again.
'''

[[topic.rule]]
id = "clear-spot-search"
tags = ["code", "data"]
text = '''
The clear spot: up to 65 points are tried, in order, and the first clear one is taken; none clear and the effect fails.
- First the place itself, then 8 rings, at 1, 2 and on to 8 world units from the place (a ring every half tile), 8 points to a ring. These are exact points, not tile centres.
- Each ring's first point is straight out from the place in the direction (0, −1); each next one is turned a further 45° the same way, (0, −1) to (−0.71, −0.71) to (−1, 0) and on round, as a summon's are ([special operations](special-ops.toml#where-and-how-it-arrives)).
- A point is clear by the test of [room to stand](objects.toml#room-to-stand) for the template's own blocking shape there, never grown by padding: the shape's bounding box on the map, every tile it overlaps passable for it (land, or water for a `water_based` thing) and not already blocked by a building or other standing thing, and no `blocking` thing's shape overlapping it. Units and regiments' units count as obstacles.
- The test is the same whatever the template's own flags: unlike room to stand, a thing that isn't `blocking`, or is `ethereal`, still needs such a point. So a sight-giver or objective marker is never made on top of a unit or a building: it goes to the nearest clear point, and one aimed at water lands on the nearest land. They block nothing themselves, so any number can be made at the same point, and units can be made on them.
- The thing faces (0, −1) when made at the place itself, and otherwise faces away from the place, along the ring's direction to its point.
'''

[[topic.rule]]
id = "regiment-spot-search"
tags = ["code", "data"]
text = '''
A regiment is searched for in two steps, never as a whole formation:
- first the search above, for the regiment's own blocking shape (the `Organization` template's default circle of radius 0.2), giving a point and a facing;
- then from that point, its leader's own blocking shape is placed as a summoned regiment's leader is ([special operations](special-ops.toml#where-and-how-it-arrives)): the point, else up to 10 rings spaced by the leader's blocking radius (at least a quarter tile), 8 points to a ring, the first along the facing from the first step and each next turned 45° as above. No point for the leader and the effect fails. The regiment stands where its leader is placed, facing the way the first step gave;
- each other unit is then placed on its own, as there: out of a nearby friendly building that recruits its kind, else its place in the formation, else the nearest clear point to it. A unit that finds no room isn't made, and the regiment is made without it.
'''

[[topic.rule]]
id = "created-thing"
tags = ["code", "guess"]
text = '''
What's made:
- A thing comes into the world at once, bearing its name, so a later effect in the same trigger, or a condition in the same tick, can name it. Its `WhenCreated` effects play (an objective marker's minimap blip).
- It's made from its template as it stands: full health, already built (a building isn't put under construction), and none of the effect's parameters change anything else about it.
- A regiment template comes with its units, placed as above.
- A single unit's template (not a regiment) gives a bare unit, in no regiment: a loose unit, like one left over when its regiment is gone.
- Experience and stance are those of any newly made thing of its kind.
'''

[[topic.rule]]
id = "created-owner"
tags = ["code", "data"]
text = '''Whose it is: a template that can be owned (`ownable`, the default) belongs to the effect's side. One with `ownable = false` belongs to nobody, whatever side the effect names, as does one placed in a map. So objective markers (`ObjectiveObject`) and `objective_compass` never have an owner, and sight-givers (`AAVisibilityActor`, ownable) belong to their side.'''

[[topic.rule]]
id = "sight-givers-and-markers"
tags = ["code", "data"]
text = '''
Sight-givers, objective markers and `objective_compass`:
- A sight-giver sees for its side, and that side's allies, as any other thing does ([fog](fog.toml)): `thing_visibilityactorsmall`, `medium` and `large` see 15, 30 and 45, with remote ranges the same. One placed in a map belongs to the side it was saved with.
- Objective markers have no sight. `objective_compass` has 25, and 12 remote, but with no owner it shows nothing to anyone.
- None of them is `targetable`, so none can be attacked, kept selected ([selection](selection.toml)), or counted as in an area by `actor_enters_area` or by `actor_inside_area` with `mi_actor_any`. A named one is still found by `actor_inside_area` by name.
- `actor_owned_by_kingdom` is true of a sight-giver for its side, and of an objective marker or the compass for no side.
- None of them keeps a side alive ([outcome](outcome.toml)): they have neither of the components that do.
'''

[[topic.rule]]
id = "actor-create-transported"
tags = ["code", "data"]
text = '''`actor_create_transported_named` (`ma_actor_data`, `ma_kingdom`, `ma_location` from, `ma_location` to, `ma_string` name): the template's transport (`transport_actor`; a template with none fails) appears at the first place, at its flying height if it flies, or else on the nearest clear ground, and delivers to the second place as in [deliveries](deliveries.toml#special-operations-and-triggers); a boat lands at the shore point nearest the second place, and fails if there's none. The delivered thing bears the name.'''

[[topic.rule]]
id = "object-destroyed"
tags = ["code", "data"]
text = '''`object_destroyed` (`ma_actor`): the thing dies as if killed (its death, remains and "lost" line; no one is credited). `invulnerable` doesn't stop it. A thing with no health of its own (an objective marker, a sight-giver) is taken off the map straight away, leaving no remains. One with health lies dead for its `rot_time` and `sink_time` as [combat](combat.toml) describes: `objective_compass`'s are 9999 and 5 seconds, so its remains stay for the rest of any mission. The "lost" line goes only to the thing's owner, so a thing with no owner posts none. Destroying a thing that's already dead does nothing more.'''

[[topic.rule]]
id = "object-removed"
tags = ["code"]
text = '''`object_removed` (`ma_actor`): the thing is taken off the map at once, with no death, no remains and no line.'''

[[topic.rule]]
id = "destroy-remove-failures"
tags = ["code"]
text = '''Both fail if the parameter names nothing.'''

[[topic]]
title = "Orders"

[[topic.rule]]
id = "orders-unlock"
tags = ["code"]
text = '''Each of these gives the order straight to the thing, and first unlocks it if `actors_lock` had locked it (the thing and, for a regiment, its units; a unit named alone is unlocked alone).'''

[[topic.rule]]
id = "orders-reach-any-side"
tags = ["code"]
text = '''
How a trigger's order differs from a person's:
- It reaches any side's things, the enemy's and neutrals' included: no owner test, and none of the click's target refusals ([commands](commands.toml#targeted-commands)) apply. The thing's side doesn't need a computer player, or a person.
'''

[[topic.rule]]
id = "unavailable-command-refused"
tags = []
text = '''It's refused, silently, when the thing doesn't offer that command right then: the same set of commands its grid would show ([commands](commands.toml#command-grid)), so a routing or Exhausted regiment refuses them all ([morale](morale.toml#the-players-orders)), a truck at its unpacking spot refuses everything, and a thing with no such command at all (Bombard for a regiment with no artillery, Unpack for anything but a truck or the regiment it leads, Air Attack for anything but an airfield) refuses it. A refused order changes nothing: the thing carries on with what it was doing.'''

[[topic.rule]]
id = "orders-never-queued"
tags = []
text = '''It's never queued: it replaces whatever the thing was doing and throws its queue away, as an unqueued order of a person's does ([queued orders](commands.toml#queued-orders)).'''

[[topic.rule]]
id = "orders-no-facing"
tags = []
text = '''It carries no facing, so the thing ends as for a person's order given without one ([commands](commands.toml#targeted-commands), Facing).'''

[[topic.rule]]
id = "regiment-stays-in-group"
tags = ["code"]
text = '''A regiment that is in a person's group isn't taken out of it, as a person's order would take it. What the group does with it afterwards is open.'''

[[topic.rule]]
id = "orders-play-as-person"
tags = ["code"]
text = '''Once given, the order plays exactly as a person's would: the same moves, the same engagements on the way, the same arrival ([movement](movement.toml), [combat](combat.toml)). Nothing in the order remembers that a trigger gave it.'''

[[topic]]
title = "The effects"
under = "Orders"

[[topic.rule]]
id = "actor-performs-command"
tags = ["code", "data"]
text = '''
`actor_performs_command_on_actor` (`ma_actor`, `ma_command`, `ma_actor` target) and `actor_performs_command_at_location` (`ma_actor`, `ma_command`, `ma_location`): orders the thing to carry out the command (`ma_command_actor` or `ma_command_location`, `mi_command`, by its id: `kill`, `bombard`, `air_attack`, `guard` on a thing; `move`, `unpack`, `air_attack` at a place) on the target or at the place. Fail if the thing names nothing, or the target or place is missing; otherwise they succeed, whether the thing takes the order or refuses it.
- Shipped uses: on a thing, `kill` 57, `air_attack` 17, `bombard` 10, `guard` 1; at a place, `unpack` 3, `air_attack` 2, `move` 1.
'''

[[topic.rule]]
id = "who-takes-order"
tags = ["code", "guess"]
text = '''
Who takes the order:
- A regiment takes it as a regiment, as a person's order to it.
- A unit named alone, one in a regiment included, takes it itself; its regiment isn't ordered. A move sends it off on its own, out of formation, under the same rules as a unit moved by `kingdom_actors_in_area_move_to_location` (below): it may give up and go back to its regiment. An attack or bombard order sends it after the target on its own. A unit doesn't take up `guard`. What it does instead is open.
- A building, or any other thing that can't take orders of that kind, refuses it, except that an order a settlement's central building can't take passes to its settlement. Nothing in a settlement is known to take the commands triggers use, so the end is the same.
'''

[[topic.rule]]
id = "kill-thing"
tags = ["code"]
text = '''
`kill` on a thing is a person's Attack on it ([combat](combat.toml#attack-orders)):
- on an enemy regiment, unit or building, the regiment goes after that very thing (a unit of an enemy regiment is the target itself, not its regiment). A regiment that bombards instead of attacking bombards it ([combat](combat.toml#bombard-orders)); AA has none;
- on a thing that isn't an enemy of the regiment's side (its own, an ally's, a neutral's), or that none of its units can attack, it moves to the thing instead, as a move onto it would. The effect still succeeds.
'''

[[topic.rule]]
id = "kill-place"
tags = ["code"]
text = '''`kill` at a place (no shipped use) is a person's attack on the ground.'''

[[topic.rule]]
id = "guard-command"
tags = ["code", "guess"]
text = '''`guard` on a thing is a person's Guard order on it, whoever owns it ([combat](combat.toml#guard-orders)): on an enemy the regiment follows and guards it like any other thing. Only guarding itself is refused.'''

[[topic.rule]]
id = "bombard-command"
tags = ["code"]
text = '''`bombard` on a thing or at a place is a person's Bombard order ([combat](combat.toml#bombard-orders)). A regiment without a unit that can bombard, or a building, refuses it.'''

[[topic.rule]]
id = "air-attack-command"
tags = ["code", "data"]
text = '''
`air_attack` is an airfield's command, not a regiment's or a special operation:
- The airfield sends out its bombers against the thing or the place, as for a person's Air Attack, paying for them, or posts that its side can't afford it ([airfields](airfields.toml)). Either way the effect succeeds.
- Anything but an airfield refuses it.
- Shipped use: `allies10_berlin`'s intro has the two Soviet airfields air-attack the city's buildings.
'''

[[topic.rule]]
id = "unpack-command"
tags = ["code"]
text = '''
`unpack` at a place: a person's Unpack order there ([buildings](buildings.toml#an-unpack-order-from-start-to-finish)): the truck, or the regiment it leads, drives to the place and unpacks.
- With no facing in the order, the building faces (0, -1) in map coordinates, whatever way the truck came.
- If it can't get there, or there's no room at the place, it gives up with "Cannot unpack %s" and stays a truck, as for a person's order. The effect still succeeds.
'''

[[topic.rule]]
id = "move-command"
tags = ["code"]
text = '''`move` at a place is a person's Move there.'''

[[topic.rule]]
id = "command-without-target"
tags = ["code"]
text = '''`actor_performs_command` (`ma_actor`, `ma_command`), with neither target nor place, always fails. No shipped map uses it.'''

[[topic.rule]]
id = "kingdom-actors-in-area-move"
tags = ["code", "data", "guess"]
text = '''
`kingdom_actors_in_area_move_to_location` (`ma_kingdom`, `ma_area`, `ma_location`): every thing on the area's list (as the last check left it, [who is in an area](#who-is-in-an-area)) that belongs to that side is ordered to move to the place, at top speed, as `actor_moves_to_location` with value 0 would. A locked thing is unlocked first.
- The list holds regiments and their units alike, so a regiment in the area is ordered and so is each of its units that is in it.
- A unit in a regiment takes a move order of its own: it sets off for the place alone, out of formation.
- When its regiment is ordered too, the regiment's move wins: at its first look after the order it hands every member its place on the regiment's route, as for any regiment move ([movement](movement.toml#members-routes)), replacing the units' own orders. So a regiment in the area moves as a regiment.
- A unit ordered without its regiment (it's in the area, its regiment's position isn't) heads off alone. While it's still within its regiment's control zone nothing pulls it back. Once outside, it keeps going only if the place lies inside the regiment's control zone and the regiment isn't retreating or routing; otherwise after `MoverDetachedSecondsUntilReattach` seconds (stock 2) outside, it gives up the move and goes back to its regiment.
- If that unit is its regiment's leader, the regiment's position follows it as usual ([movement](movement.toml#arriving)), so the leader stays with its regiment and the regiment's place goes along with it.
- Things that can't move (buildings) take no order. It succeeds whenever the side, area and place all name something, even if nothing is ordered.
- No shipped AA map uses it.
'''

[[topic.rule]]
id = "actor-performs-animation"
tags = ["code", "data"]
text = '''`actor_performs_animation` (`ma_actor`, `ma_animation`): the thing plays that animation of its model (`build1`). Fails if it has no such animation.'''

[[topic.rule]]
id = "ability-used-by-kingdom"
tags = ["code", "guess"]
text = '''`ability_used_by_kingdom_from_location_at_location` (`ma_ability`, `ma_kingdom`, `ma_location` from, `ma_location` at): the side uses that special operation (`v_weapons`) at the second place, as if from the first, without paying for it or waiting for its recharge; nothing happens if the place is out of its range. Only operations aimed at an area work.'''

[[topic]]
title = "Locking"

[[topic.rule]]
id = "actors-lock"
tags = ["code"]
text = '''`actors_lock` (no parameters): every thing of every side that is in the world at that moment is told to stop (Stop, as in [Computer control](#computer-control)) and is locked. Things that come into the world afterwards aren't locked.'''

[[topic.rule]]
id = "lock-holds-back"
tags = ["code", "guess"]
text = '''
What a lock holds back:
- Queued orders. A locked thing that runs out of orders doesn't go on down its queue ([queued orders](commands.toml#queued-orders)); the queued orders wait, all of them, and once it's unlocked it takes them up in turn as usual, the next time it's idle.
- A unit's answer to being hit: a locked unit doesn't turn on what hit it.
'''

[[topic.rule]]
id = "lock-allows-direct-orders"
tags = ["code", "guess"]
text = '''What it doesn't: an order given straight to the thing, not queued, is carried out at once, a person's included. So is a trigger's, which unlocks it first anyway. A locked thing still fires at enemies in its range, and its regiment still engages as usual ([combat](combat.toml#engagement)).'''

[[topic.rule]]
id = "regiment-lock"
tags = ["code"]
text = '''A regiment is locked with its units: locking or unlocking a regiment does the same to each of them. Each still has its own lock, so a unit unlocked alone (a trigger's order naming it) leaves its regiment and the other units locked.'''

[[topic.rule]]
id = "actors-unlock"
tags = ["code"]
text = '''`actors_unlock` unlocks every thing of every side.'''

[[topic.rule]]
id = "moscow-intro-lock"
tags = ["data"]
text = '''One mission (`axis10_moscow`) locks everything through its intro.'''

[[topic]]
title = "Computer control"

[[topic.rule]]
id = "sai-disabled"
tags = ["code", "data", "guess"]
text = '''
A side or a thing can have computer control switched off. It only matters to a computer player:
- `sai_disabled_for_kingdom` (`ma_kingdom`): the side's computer player stops planning and giving orders, and every thing of the side is told to stop, whether a computer plays it or not. `sai_enabled_for_kingdom` lets its computer player carry on. Enabling doesn't give a side a computer player it didn't have; on a side played by a person it only stops everything.
- `sai_disabled_for_actor` (`ma_actor`): the side's computer player lets go of that one thing (drops it from whatever it had it doing) and gives it no orders, and it's told to stop. `sai_enabled_for_actor` hands it back.
- The thing is told to stop whoever plays its side: a person's thing stops too.
- "Told to stop" is the Stop order, as a person's Stop button gives it: the thing drops its order, its queue and any fight it's in, and stands where it is. Only the ordinary engagement rules start a new fight ([combat](combat.toml#engagement)). A thing that doesn't offer Stop at that moment (one routing, or a truck at its unpacking spot) refuses it and carries on.
- Switched off for a thing, it stays off when the thing changes side (a capture, `actor_transfer_control_to_kingdom`): the new side's computer player doesn't use it either, until `sai_enabled_for_actor` names it.
- Either way the things themselves behave as any unit without orders: they keep their stance, fight what comes into range and return fire, and morale works as usual ([combat](combat.toml), [morale](morale.toml)). Only the computer player's decisions are switched off.
- While its side is off the computer player forgets nothing, and it carries on from where it was once switched back on; a thing switched back on is simply free for it to use again ([computer players](computer-players.toml#switched-off-by-a-trigger)).
- `sai_change_profile_for_kingdom` exists, but no shipped map uses it.
- Each fails only when its parameter names nothing.
- Shipped use: Map Init switches off the enemy side (the tutorial's for good), and a later trigger (a timer, a landing) switches it on.
'''

