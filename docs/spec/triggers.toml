[[topic]]
title = "Counter"

[[topic.rule]]
id = "game-counter"
tags = ["code", "data"]
text = '''`game_counter_show` (`ma_value` seconds): shows a countdown from the seconds on screen, starting now; a second one replaces the first. 0 or less fails. `game_counter_hide` takes it away. It's only shown: nothing happens when it reaches 0, so maps pair it with an `activation_time` trigger of the same length (`allies09`: 1200 seconds to defend Bastogne). It counts game time, stops at 0 and stays on screen until hidden, and every player sees it; how it's written is in [interface](interface.toml#the-time-labels). It's kept in a saved game.'''

