subject = "Data files"
summary = '''How the game reads its definition files: which files load, how ids, renames and duplicates resolve, how values are read, how models find their textures and sounds, and how the string tables turn keys into the text the player reads.'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "Which files load"

[[topic.rule]]
id = "index-lists"
tags = ["code", "data"]
text = '''Only the `.tgi` files the `index*.lst` files name are loaded, in the order those lists give. The `index*.lst` files themselves are read in name order (`index_aa.lst` says so itself), each from top to bottom; a list named inside another is read where it's named. How files are stored inside an archive or a folder plays no part in the order.'''

[[topic.rule]]
id = "pattern-sort-order"
tags = ["code", "guess"]
text = '''A `*` pattern in a list loads its matches in sorted name order (plain character order, case-sensitive, so `Vulture.tgi` sorts before `eagle.tgi`), within that one folder only; subfolders load only if a list names them.'''

[[topic.rule]]
id = "file-named-twice"
tags = ["code"]
text = '''A file named twice (twice in the lists, or by a name and a `*`) is read each time. The second reading meets its own ids as duplicates, so it fails at its first definition (below) and the first reading stands.'''

[[topic]]
title = "Data sources"
intro = '''Where a file named in the lists is read from, when the archive, the loose data folder and the user data folder can each hold a copy.'''

[[topic.rule]]
id = "source-priority"
tags = ["code", "data"]
text = '''The game reads its files from the sources that `startup/autoexec.txt` adds (`adddepot`, and `addlocaledepot` for localised ones): archives such as `Data.rwd` and folders such as `data/`, each taking paths relative to its own root. A number after the source is its priority; without one it's 0. The stock file adds, in order, `EngineData/`, `Data.rwd`, `data/`, then music, video and speech, all at priority 0, and last `%USERDATA%/data/` and `Userdata/` at priority 1.'''

[[topic.rule]]
id = "one-copy-per-path"
tags = ["code"]
text = '''A path held by more than one source is one file, read from one source only: the one with the highest priority, and among sources of equal priority the one added last. Paths match ignoring case, with `\\` and `/` alike. The other copies are never read, so nothing in them counts, not even definitions the chosen copy lacks.'''

[[topic.rule]]
id = "stock-source-precedence"
tags = ["code", "data"]
text = '''With the stock `autoexec.txt`: a loose file in the game's `data/` folder replaces the file of the same path in `Data.rwd`, and one in `Userdata/` (or the user's `My Documents` data folder, `%USERDATA%/data/`) replaces both; between those two, `Userdata/` wins, being added last. This holds for every kind of file alike: definition files, index lists, textures, models and sounds.'''

[[topic.rule]]
id = "patterns-span-sources"
tags = ["guess"]
text = '''A `*` pattern, and the search for `index*.lst`, match the files of every source together, as one folder: a new loose file in a listed folder (`data/Game/resources_mod.tgi` under `Game/resources*.tgi`) loads, in name order among the archive's files.'''

[[topic]]
title = "Ids, renames and duplicates"

[[topic.rule]]
id = "translate-renames"
tags = ["code"]
text = '''`[Translate]` entries rename an old id (`ids_old`) to a new one (`ids_new`). Wherever the game looks an id up (in templates, maps' terrains and things), a renamed id is replaced by its new id first.'''

[[topic.rule]]
id = "renames-one-step"
tags = ["code"]
text = '''Renames go one step only: if A is renamed to B and B to C, A finds B's definition, or nothing when B has none.'''

[[topic.rule]]
id = "rename-beats-definition"
tags = ["code"]
text = '''A rename wins even over a definition still made under the old id.'''

[[topic.rule]]
id = "rename-to-undefined"
tags = ["code"]
text = '''A rename to an id with no definition finds nothing. In shipped data `tropical_river03` is renamed to `tropical_river02`, which is itself only a rename, so `tropical_river03` finds no terrain.'''

[[topic.rule]]
id = "duplicate-rename"
tags = ["code"]
text = '''Renaming the same old id twice is a load error, the first rename is kept. Renames inside comments don't count.'''

[[topic.rule]]
id = "first-definition-wins"
tags = ["code"]
text = '''For every kind of definition, a second definition of an id already defined is a load error, and the first one read stays exactly as it was: nothing of the second is taken, not even fields the first left out. This is the same for things and visual effects, audio, bones, cursors, formations, kingdom colours, nations, resources and every other kind, and the same whether the two are in one file, in two files, or one in `Data.rwd` and one in a loose file of another path. Ids are compared ignoring case. "First" is in the order files load ([which files load](#which-files-load)), then top to bottom within a file.'''

[[topic.rule]]
id = "duplicate-ends-file"
tags = ["code"]
text = '''The error ends the reading of the file holding the second definition: that block and every block after it in the file are skipped, the blocks before it are kept, and loading goes on with the next file. A load error doesn't stop the game. So a mod file that repeats one stock id loses everything written after that block.'''

[[topic.rule]]
id = "thing-kinds-share-ids"
tags = ["code"]
text = '''`Thing`, `Unit`, `Projectile` and `VFX` blocks share one set of ids: a visual effect with the id of a unit is a duplicate of it. Every other kind has its own set, so an `Audio` block and a `VFX` block can share an id.'''

[[topic.rule]]
id = "duplicate-needs-name"
tags = ["code"]
text = '''For kingdom colours and cursors a repeat is recognised by the first definition's `name`, which each definition must have. If the first's `name` is empty text, a later definition of the same id is read into the same entry instead of being refused, its fields replacing the first's.'''

[[topic.rule]]
id = "duplicate-thing-id"
tags = ["code"]
text = '''The shipped `eastern_europe_city_center02_large` and `_small` pair is no conflict: one copy lives in a subfolder no index list names, so it never loads.'''

[[topic.rule]]
id = "vars-last-wins"
tags = ["code", "game"]
text = '''Settings files are the exception: every `AVars*.tgi` and `UVars*.tgi` loads, across all sources, in name order, and a setting a later one sets replaces the earlier value. So `data/AVars_zz_mine.tgi` overrides the shipped app settings.'''

[[topic.rule]]
id = "duplicates-reported-in-log"
tags = ["code", "game"]
text = '''A duplicate, like every other load error, is reported only in the run's log file in the game folder's `Logs` folder (`log-N…log`), naming the file, the line and the id. Nothing is shown on screen. A string key defined twice ([string tables](#duplicate-key)) isn't reported at all unless the strict data checking setting (`DataCheckingStrict`) is on.'''

[[topic]]
title = "Templates"

[[topic.rule]]
id = "template-inheritance"
tags = ["code"]
text = '''A definition naming a template (`Template=` or `Inherit=`) takes from it, at every level of nesting, each field it doesn't set itself; a field it does set wins. Templates of templates chain the same way.'''

[[topic.rule]]
id = "section-merging"
tags = ["code"]
text = '''A section the definition also has is combined field by field like this. A section only the template has is copied in, unless the template marks it `optional`: then a thing that doesn't write it has none.'''

[[topic.rule]]
id = "list-sections"
tags = ["code"]
text = '''Sections a template marks `list` (`[list WhenHealth Template=FXC]` in the body component's template, and the like) can be written any number of times, and they add up: a thing gets every entry written in each of its templates, all the way up the chain, ancestors' first, followed by its own. Writing entries of a list never drops the inherited ones, and there's no way to remove one. So a German medium tank has both `AAUnitVehicle`'s `smoke_tank` at 40% and its own template's `medium_tank_debris` at 0, and a packable HQ gets the five commands of `AABuildingPackable` plus three of its own.'''

[[topic.rule]]
id = "repeated-section"
tags = ["code"]
text = '''Writing a section more than once where the template has that section but doesn't mark it `list` is a load error.'''

[[topic.rule]]
id = "nested-section-templates"
tags = ["code", "game", "data"]
text = '''
A section written inside a definition, where the enclosing section's template has a section of the same name, is filled like this:
- naming no template, or the same template the enclosing template's section names: it takes its missing fields from the enclosing template's section and nothing else. That section was itself filled from the named template when it was defined, its own fields winning, so what the enclosing template's section sets beats the named template's whole chain;
- naming a different template: it takes its missing fields from its own template first (the whole chain), then any still missing from the enclosing template's section. Its template must be that section's template or a descendant of it, or the load fails. So an engineer's `[Ability Template=AARepairLocal] { [AbilityDefinition Template=AARepairAction] ... }` gets `recharge_time = 0.0` from `AARepairLocal`'s own `[AbilityDefinition Template=AARepairAction]` section, not the `1.5` that `AARepairAction` inherits from `AARepairAllAction`; the fields `AARepairAction` sets (`targets`, `name`) still come through, by way of that section. A rifle's `[Ability Template=AAGunLocal] { [AbilityDefinition Template=AAInfantryRifle] ... }` is the other case: `AAInfantryRifle` descends from the `AAAttack` that `AAGunLocal`'s section names, so its own chain's fields come before anything that section sets. The game's engineers heal at the pace a zero recharge gives ([construction](construction.toml#building-and-repairing-work)).
'''

[[topic.rule]]
id = "template-lifetime"
tags = ["code", "guess"]
text = '''A `[Template]` lasts only as long as its file stays loaded. A file that holds any definitions (things, terrains and the like) is let go once read, and its templates go with it; a file of nothing but templates stays loaded for the rest of the data load, so its templates serve every file after it. That files let go are dropped at once, not kept in a cache, is inferred from the shipped data loading cleanly.'''

[[topic.rule]]
id = "same-template-two-files"
tags = ["code", "guess"]
text = '''So the same template name in two files that both hold definitions is no conflict: each file uses its own. In shipped data `AAUSAAttackBattleShipBombard` (in `usa_battleship.tgi` and the cutscene's `hires_usa_battleship_texas.tgi`) and `AARUSRegimentParatrooper` (in `regiment_rus_paratrooper.tgi` and `_heavy.tgi`) are of this kind, and each file's things take that file's version.'''

[[topic.rule]]
id = "template-redefined"
tags = ["code"]
text = '''Defining a template whose name is still loaded (one from a templates-only file, or earlier in the same file) is a load error that fails the whole later file: none of its blocks load, and the first template stands.'''

[[topic]]
title = "Values"

[[topic.rule]]
id = "field-type-decides"
tags = ["code"]
text = '''A field is read by the type the game expects for it, not by how the value looks.'''

[[topic.rule]]
id = "fraction-numbers"
tags = ["code"]
text = '''Numbers with a fraction: the number as written, divided by 100 when the text contains `%`. So `80` is 80, `80%` is 0.8 and `0.8` is 0.8. In a list of two or three numbers each is read this way on its own.'''

[[topic.rule]]
id = "whole-numbers-percent"
tags = ["code"]
text = '''Whole numbers ignore a `%`.'''

[[topic]]
title = "Sounds on animations"

[[topic.rule]]
id = "sound-start-delay"
tags = ["code"]
text = '''An animation's `start_min` and `start_max` are seconds. The sound next starts `start_min` plus a random fraction of `start_max - start_min` after the animation is created and again after each play ends.'''

[[topic.rule]]
id = "playsfx"
tags = ["code"]
text = '''`PlaySFX` entries play each time their animation starts, looping if they're flagged to, for every kind of animation. Sounds on the `SELECTED` animation are sometimes skipped. When is open.'''

[[topic]]
title = "Textures"

[[topic.rule]]
id = "texture-renames-per-model"
tags = ["code"]
text = '''Texture renames belong to one model (`AspectNormal`, or one `Aspect`), not to the whole unit: each model uses only its own.'''

[[topic.rule]]
id = "texture-rename-order"
tags = ["code"]
text = '''A texture a model names is first taken as the model's folder plus the name. The model's renames then apply, last declared first, each replacing every occurrence of its text anywhere in that path (case matters), so one rename's result can be renamed again by an earlier one.'''

[[topic.rule]]
id = "texture-search-paths"
tags = ["code", "guess"]
text = '''Then the game takes the first that exists of: that path; then, for each of the view's search paths in order, the file name in that folder (a search path starting with `.` is relative to the texture's folder). File names match ignoring case.'''

[[topic.rule]]
id = "default-texture"
tags = ["code"]
text = '''Failing all of those the default texture is used, with a warning. The game never searches the archive for another file of the same name.'''

[[topic.rule]]
id = "biome-texture-subfolder"
tags = ["code", "data"]
text = '''A map's biome can name a subfolder (`texture_subfolder_name`: `Arctic` for `arctic_tundra` and `boreal_forest`, `Desert` for `desert`, `Tropical` for the two tropical biomes). While such a map is loaded, whenever a texture or a model file is about to be read from a folder and a file of the same name exists in that subfolder of the same folder, the subfolder's file is read instead (`Units/USA/USATruck/Arctic/ USATruckBase.dds` for `Units/USA/USATruck/USATruckBase.dds`). It applies to every model and texture, world and interface alike.'''

[[topic.rule]]
id = "biome-swap-every-candidate"
tags = ["code"]
text = '''The swap is part of every test in the texture search above, not a step after it. Each candidate (the model's folder first, then each search path) counts as found when the file is in that folder's biome subfolder or in the folder itself, and the subfolder's copy wins when both are there. So a texture that exists only in the biome subfolder of the model's folder is found there, before any search path is tried: on an arctic map a model in `Units/USA/USAInfantryCO/` naming `PortraitBreathBase.dds` gets `Units/USA/USAInfantryCO/Arctic/ PortraitBreathBase.dds`, not the plain one in `Shared/SharedTextures/`; on other maps the folder has none and the shared one is used. A search path's own biome subfolder is tried the same way when its turn comes.'''

[[topic.rule]]
id = "model-in-biome-subfolder"
tags = ["code", "data"]
text = '''A model that was itself read from the biome subfolder has that subfolder as its folder: its textures are looked for beside it there (and in the search paths), never in the plain folder above. One missing from the subfolder isn't taken from the plain model's folder. Every shipped subfolder model has all its textures beside it.'''

[[topic]]
title = "String tables"

[[topic.rule]]
id = "text-blocks"
tags = ["code"]
text = '''Each `[Text]` block in `Localization/strings_*.tgi` holds `key = "text"` pairs. Its `ids` and `name` describe the block and aren't strings. Every other value must be quoted; an unquoted one is a data error.'''

[[topic.rule]]
id = "shared-case-insensitive-keys"
tags = ["code"]
text = '''All tables share one set of keys, and keys are compared ignoring ASCII case.'''

[[topic.rule]]
id = "key-suffixes"
tags = ["code", "data"]
text = '''A `|` in a key is part of the key: `multi_element_format_string|ss` and `multi_element_format_string|sss` are two strings, and the game asks for them with the suffix. The suffix lists the values the text is formatted with, in order: `s` a string, `d` a whole number (e.g. `objective_city_ratio|ddd = "Control %d cities (%d/%d)"`). Five stock keys exist with more than one suffix, or with and without one.'''

[[topic.rule]]
id = "duplicate-key"
tags = ["code", "data"]
text = '''A key defined twice keeps the first table's text. Shipped tables define none twice.'''

[[topic.rule]]
id = "hash-key-reference"
tags = ["guess"]
text = '''Data fields such as `name = "#rus_infantry_sniper_name"` name a key with a leading `#`.'''

[[topic.rule]]
id = "missing-key"
tags = ["code"]
text = '''Asking for a key that doesn't exist logs an error and shows a placeholder text, unless the asker supplied its own fallback.'''

[[topic]]
title = "Escapes"

[[topic.rule]]
id = "escapes-every-string"
tags = ["code"]
text = '''These apply to every quoted string in every data file, as it's read, not only to the string tables.'''

[[topic.rule]]
id = "glyph-blocks"
tags = ["code"]
text = '''Glyphs are defined by `[Glyph]` blocks in `Fonts/special_glyphs*.tgi`: `ids` names the glyph, `index` is the character it stands for. Most indices are 128–159, characters the font draws as icons (`ch_gem` 132, `ch_rank1` 134); a few are ordinary characters (`n` 10, `ch_amp` 38, `ch_semicolon` 59). Glyph names are compared ignoring case.'''

[[topic.rule]]
id = "backslash-escape"
tags = ["code"]
text = '''`\` takes the one character after it: `\c` becomes the glyph whose `ids` is `c`, so `\n` is a newline. `\\` and `\&` give a plain `\` and `&`. `\` before any other character that isn't a glyph name is a data error and is left as written. A `\` at the very end is a data error.'''

[[topic.rule]]
id = "ampersand-glyph-name"
tags = ["code"]
text = '''`&name.` becomes the glyph called `name`: `&ch_gem.` is the gem icon. `&&` gives a plain `&`. An unknown name is a data error and is left as written; a `&` with no `.` after it is a data error.'''

[[topic.rule]]
id = "escape-characters-settings"
tags = ["guess"]
text = '''The three characters `\`, `&` and `.` are game settings, not fixed; these are the stock ones, as the shipped data uses them.'''

