subject = "Campaigns"
summary = '''AA's scripted campaigns (Tutorial, Allies, Axis), from the main menu's Campaign button to the debriefing: the campaign screen, which missions are open, difficulty, videos, who plays which side, the loading screen, the debriefing and the progress kept on disk. Not the World War II campaign map. What a mission's own triggers do is in [triggers](triggers.toml); winning and losing in [outcome](outcome.toml).'''
games = '''traced in AA. Kohan II's campaigns are unchecked.'''

[[topic]]
title = "The campaigns and their missions"

[[topic.rule]]
id = "campaign-list"
tags = ["code", "data"]
text = '''`Campaign/campaign_aa.tgi` lists the campaigns in the order the screen shows them, each with its missions in the order they're played ("missions are listed in the linear progression order", `Templates/template_campaign.tgi`).'''

[[topic.rule]]
id = "mission-type"
tags = ["code", "data"]
text = '''A mission is one of three kinds (`mission_type`): `PLAYABLE`, a map played to a win or a loss; `CINEMATIC`, a video (`cinematic`, a `.bik`); `CUTSCENE`, a map that plays itself. AA ships only the first two: the Allies and Axis campaigns open with a video and have videos between missions (D-Day, Berlin, London, Moscow) and after the last one (the victory video).'''

[[topic.rule]]
id = "unused-mission-fields"
tags = ["code", "data"]
text = '''`cinematic_intro`, `cinematic_outro` and `preview_texture` are read but none of AA's missions or the screen uses them ("preview_texture is archaic").'''

[[topic]]
title = "The campaign screen"

[[topic.rule]]
id = "campaign-button"
tags = ["data"]
text = '''The Campaign button of the single-player menu opens the campaign screen (`UI/Menus/choose_campaign.tgi`).'''

[[topic.rule]]
id = "campaign-buttons"
tags = ["code", "data"]
text = '''Down the left, a button for each campaign: its name, and its `complete_texture` once every mission in it is complete, its `incomplete_texture` until then. The campaign last chosen is selected on arrival (remembered with the player's preferences); the first time, the first campaign (the Tutorial).'''

[[topic.rule]]
id = "mission-list"
tags = ["code"]
text = '''In the middle, the selected campaign's missions, by `name`, in order. Only missions that have been opened are listed: a fresh campaign shows just its first mission, and the list grows by one each time the newest is completed (see Progress).'''

[[topic.rule]]
id = "mission-name-colour"
tags = ["code", "data"]
text = '''A mission's name is drawn in the campaign's `complete_color` once it's complete (stock 0, 0.75, 0, a green) and `incomplete_color` until then (stock white); a `CUTSCENE` mission's always in the interface's cutscene colour.'''

[[topic.rule]]
id = "mission-selection"
tags = ["code"]
text = '''On arrival and on choosing a campaign, the first open mission that isn't complete is selected. When every mission is complete nothing is selected and there's no Play button until the player picks one.'''

[[topic.rule]]
id = "difficulty-dropdown"
tags = []
text = '''Beneath the list, a Difficulty dropdown (Easy, Normal, Hard; below).'''

[[topic.rule]]
id = "play-replay"
tags = ["code", "data"]
text = '''Buttons along the bottom: Play, Load, Back. Play reads "Play" either way, but it's a different button for a mission not yet complete (play on) and a complete one (replay); they differ only in what follows a video (below).'''

[[topic.rule]]
id = "dependent-campaign-ids"
tags = ["code", "data"]
text = '''A campaign with a `dependent_campaign_ids` that isn't complete asks first: "Playing the Tutorial is recommended before playing Allies Campaign. Do you wish to continue?" (`campaign_dependent_campaign_confirm`, the two campaigns' names). Yes plays and turns the warning off for good (the user setting `UICampaignConfirmDependentCampaign`, on by default); no stays. Allies depends on the Tutorial, Axis on Allies. Nothing is ever locked: any campaign can be started.'''

[[topic.rule]]
id = "load-and-back"
tags = ["code", "data"]
text = '''Load opens the saved-game list for campaign saves (below). Back returns to the single-player menu.'''

[[topic]]
title = "Progress"

[[topic.rule]]
id = "mission-states"
tags = ["code"]
text = '''Each mission of a campaign is locked, open or complete. A fresh campaign has its first mission open and the rest locked.'''

[[topic.rule]]
id = "completing-mission"
tags = ["code"]
text = '''Completing a mission marks it complete and opens the one after it. Only the newest can open a new one: completing an already complete mission again changes nothing.'''

[[topic.rule]]
id = "what-completes-mission"
tags = ["code"]
text = '''A playable mission is completed by winning it: the player's side has won (outcome won) when the player leaves the match. A video is completed by being watched (see Videos). Losing, or leaving before the outcome is decided, completes nothing.'''

[[topic.rule]]
id = "completion-on-leaving"
tags = ["code"]
text = '''Completion is recorded when the player leaves the match for the debriefing, not at the moment of winning.'''

[[topic.rule]]
id = "campaign-complete"
tags = ["code"]
text = '''The campaign is complete once its last mission is.'''

[[topic.rule]]
id = "linear-progress"
tags = ["code"]
text = '''Progress is linear: the player can play the open mission or replay any complete one, but can't jump ahead to a locked one.'''

[[topic]]
title = "Difficulty"

[[topic.rule]]
id = "campaign-difficulty"
tags = ["code", "data"]
text = '''The Difficulty dropdown sets the campaign's difficulty: Easy, Normal or Hard (`Game/difficulty_level.tgi`, ids `easy`, `medium`, `hard`). Each campaign keeps its own; a fresh one starts at Normal, the `DifficultyLevel` world rule's default.'''

[[topic.rule]]
id = "difficultylevel-rule"
tags = ["code"]
text = '''Every mission of the campaign is launched at that difficulty: it becomes the match's `DifficultyLevel` world rule.'''

[[topic.rule]]
id = "difficulty-only-in-triggers"
tags = ["code", "data"]
text = '''That rule changes nothing by itself: no handicap, no change to the computer players. It matters only where a map's triggers test it (`difficulty_compare_difficulty`, in [triggers](triggers.toml)).'''

[[topic.rule]]
id = "difficulty-saved-with-progress"
tags = ["code"]
text = '''A difficulty chosen and never followed by a completion isn't kept: it's written to disk only along with a change of progress.'''

[[topic]]
title = "Videos"

[[topic.rule]]
id = "video-playback"
tags = ["code", "data"]
text = '''Playing a `CINEMATIC` mission plays its video full screen with its sound, over everything.'''

[[topic.rule]]
id = "esc-stops-video"
tags = ["guess"]
text = '''Esc stops the video, and it then counts as having ended.'''

[[topic.rule]]
id = "video-end"
tags = ["code"]
text = '''
When it ends it counts as watched and is marked complete, and then:
- chosen with Play (not yet complete): the next mission starts at once, straight to its loading screen, so the Allies intro leads into El Alamein; a video that is the campaign's last returns to the menus;
- chosen with replay (already complete): back to the campaign screen.
'''

[[topic.rule]]
id = "video-from-next-mission"
tags = ["code"]
text = '''The same goes for a video reached by Next Mission from a debriefing: it plays, then the mission after it starts.'''

[[topic.rule]]
id = "video-skip-unsettled"
tags = ["guess"]
text = '''Whether a key or click ends a video early is unsettled; the video widget plays to its end unless told to stop.'''

[[topic]]
title = "Who plays which side"

[[topic.rule]]
id = "map-decides-sides"
tags = ["code", "data"]
text = '''There's no lobby. The map decides everything about the sides: their nations, generals, colours, teams, which are independent, what each starts with.'''

[[topic.rule]]
id = "player-side"
tags = ["code", "data"]
text = '''The player plays the one side the map's header names as the local human player: `kingdom_0` in most missions, `kingdom_3` in Allies 5 (Monte Cassino) and Axis 6 (Kursk), `kingdom_1` in Axis 4 (Stalingrad).'''

[[topic.rule]]
id = "computer-sides"
tags = ["code", "data", "guess"]
text = '''Every other side that isn't independent is given a computer player as the mission launches, using the AI profile its kingdom setup names (`ai`, e.g. `ger_sai`), or, where it names none (every side in both tutorials but Tutorial 2's German side, most of the Axis missions'), a profile picked at random for that side's nation. Independent sides get none.'''

[[topic.rule]]
id = "trigger-computer-control"
tags = ["code", "data"]
text = '''Whether a computer player actually plays is then up to the map's triggers, which can switch a side's or a thing's computer control off and on ([triggers](triggers.toml#computer-control)); most missions switch the enemy off at the start and on later, and the Tutorial keeps it off.'''

[[topic.rule]]
id = "no-handicaps"
tags = ["code", "data"]
text = '''No handicaps ([players](players.toml#handicaps)), no extra starting money: every campaign map's sides start with what the map gives them. Sides keep the map's names ([players](players.toml#side-names)).'''

[[topic]]
title = "Loading screen"

[[topic.rule]]
id = "loading-screen-contents"
tags = ["code", "data"]
text = '''A campaign mission's loading screen (`UI/Loading/loading_screen.tgi`) shows the map's name and description (MAP_HEADER), the player's side's objectives from the map, and the mission's two pictures, `loading_texture_left` and `loading_texture_right`. Single-player, so play waits for Continue ([multiplayer](multiplayer.toml#loading)).'''

[[topic.rule]]
id = "loading-picture-paths"
tags = ["code", "data"]
text = '''The pictures are relative to `Campaign/`. A `%s` in the path stands for a folder named after the screen width; when there's no such file the `%s/` part is dropped, so `allies/%s/Allies01Left.png` is `Campaign/allies/Allies01Left.png`, the only copy AA ships.'''

[[topic.rule]]
id = "loading-picture-fallback"
tags = ["code"]
text = '''A mission without both pictures shows the map's own loading pictures, or failing that the default ones.'''

[[topic]]
title = "Debriefing"

[[topic.rule]]
id = "debriefing-entry"
tags = ["code", "data"]
text = '''Leaving a playable mission (End Mission, or Abort Mission before the end; see [outcome](outcome.toml#when-the-match-is-over)) goes to the debriefing (`UI/Menus/debriefing.tgi`): the mission's name, its `debriefing_success` text if the player's side won or `debriefing_failure` if not (lost, or left still playing), the side's primary and secondary objectives ([objectives](objectives.toml#mission-debrief)), and victory or defeat music ([music](music.toml)).'''

[[topic.rule]]
id = "debriefing-buttons"
tags = ["code", "data", "guess"]
text = '''
Its buttons:
- Next Mission, shown only when this mission is complete and isn't the campaign's last: plays the next one (a video plays first if the next is one). So it shows after a win, and after a loss on a mission already won before;
- Replay Mission: plays this mission again;
- Score: the score screen;
- Save Film: saves the recording of the match;
- Exit: back to the menus, the campaign screen.
'''

[[topic.rule]]
id = "is-final-mission"
tags = ["code", "data", "guess"]
text = '''A mission with `is_final_mission = true` (Allies 12, Okinawa; Axis 12, Hawaii), once won, is marked complete and skips the debriefing: the game cuts to the credits. The victory video after it is then open on the campaign screen.'''

[[topic]]
title = "What carries over"

[[topic.rule]]
id = "nothing-carries-over"
tags = ["code"]
text = '''Nothing but progress: each mission starts from its map alone. No generals' levels, experience, units, money or technologies carry from one mission to the next.'''

[[topic.rule]]
id = "progress-file"
tags = ["code", "data"]
text = '''What's kept on disk, per campaign, is each mission's lock, open or complete state, whether the campaign is complete, and its difficulty: a file `CampaignSave/<campaign id>.rcs` (e.g. `campaign_aa_allies.rcs`) in the game's user folder, beside the user preferences, screenshots and films. It isn't per player name or profile: everyone using that folder shares one progress. A file that is missing or unreadable means a fresh campaign.'''

[[topic.rule]]
id = "campaign-saves"
tags = ["code", "data", "guess"]
text = '''A mission can be saved part-way like any game, as a campaign save (extension `RCG`). The campaign screen's Load lists them; loading one for another campaign is refused ("Attempted to load a saved game that was for a different campaign"), as is one for a mission not yet reached ("The saved game you selected is for a mission you have not yet reached.").'''

[[topic]]
title = "Losing and quitting"

[[topic.rule]]
id = "losing-mission"
tags = ["code", "data"]
text = '''Losing a mission shows "Mission Lost" with End Mission ([outcome](outcome.toml#what-the-player-sees)); End Mission goes to the debriefing with the failure text. Nothing is marked, so the mission stays open and the player can replay it from the debriefing or the campaign screen.'''

[[topic.rule]]
id = "abort-mission"
tags = ["code"]
text = '''Leaving part-way (Abort Mission from the game menu) is treated as a loss in the debriefing and changes no progress.'''

[[topic.rule]]
id = "end-mission-confirm"
tags = ["data"]
text = '''The interface's confirmation for ending a mission reads "Exit to Debriefing?" (`campaign_end_confirm`).'''

