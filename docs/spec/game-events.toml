subject = "Game events"
summary = '''The announcements the game makes to a player when something happens to them (a building finished, a company routed, a city taken): who is told, and the message line, radar blip and sound each one brings. Every event is an entry in `Game/game_events.tgi`, and its sound an entry in `Audio/sounds_game_events_aa.tgi`.'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "Who is told"

[[topic.rule]]
id = "addressed-to-one-player"
tags = ["code"]
text = '''Each event is addressed to one player, the one it happened to. Only the player at this machine is ever told anything: an event addressed to anyone else, an AI player included, does nothing here, and allies and third parties are told nothing.'''

[[topic.rule]]
id = "global-events"
tags = ["code", "data"]
text = '''An event marked `global = true` is the exception and is shown to the player here whoever it's addressed to. The victory and defeat events set it (`kingdom_defeated`, `kingdom_resigned`, `kingdom_victory`, `team_defeated`, `team_resigned`, `team_victory`, `city_ratio_victory`); no other shipped event does.'''

[[topic.rule]]
id = "unseen-thing-dropped"
tags = ["code"]
text = '''An event about a thing is dropped if the player it's addressed to can't see that thing at that moment, unless it's one of the flare events (`my_flare_created`, `ally_flare_created` and their `_on_actor` forms) or `marker_discovered`.'''

[[topic.rule]]
id = "filter"
tags = ["code"]
text = '''An event with a `filter` is dropped whole while that filter is off in the interface; `message_filter` turns off only its message line.'''

[[topic.rule]]
id = "display-when-loading"
tags = ["code", "data"]
text = '''Events raised while a saved game is loading are dropped, unless marked `display_when_loading` (only `technology_gained` is).'''

[[topic]]
title = "What an event brings"

[[topic.rule]]
id = "game-message"
tags = ["code", "data"]
text = '''Its `game_message`, if any, goes to the message log, as the kind its `message_type` names (`BUILDING_CAPTURED`, `BUILDING_NEGATIVE`). The message's `%s` are filled in by the event (below). Every shipped event's line, and how the log shows it, is in [messages](messages.toml).'''

[[topic.rule]]
id = "additional-fx"
tags = ["code", "data"]
text = '''
Then its `AdditionalFX` entries run, at the thing the event is about, or at a place on the map for events about a place, or with no place:
- `FXC_CreateRFX` blinks `radar_icon` on the minimap at the thing's position, as in [Minimap blips](#minimap-blips). Every shipped event uses `/Textures/GameEvents/testart.tga` (32 by 32) with the template's colours, yellow (`src_color` 1, 1, 0) and white (`dst_color`), and 3 blinks.
- `FXC_GameEventSFX` plays `audio_ids`, as [sounds](sounds.toml), Event sounds, describes.
'''

[[topic.rule]]
id = "no-blip-or-sound-at-startup"
tags = ["code"]
text = '''The radar blip and the sound are skipped while the game is still starting up (the map loading); the message still goes to the log.'''

[[topic]]
title = "Minimap blips"

[[topic.rule]]
id = "minimap-blip"
tags = ["data"]
text = '''An `FXC_CreateRFX` command (template in `Templates/template_fx.tgi`) puts a blinking picture on the minimap. Game events use it, as do the objective markers (`Special/Things/thing_objectives.tgi`, as each is made: `IconRadar01.png` to `09`, 17 by 17, `src_color` 0, 0.6, 1 to black, 8 blinks) and Radar Scan (`IconRadarScan.tga`, 100 by 100, at the minimap's centre, magenta to white, 3 blinks).'''

[[topic.rule]]
id = "blip-place"
tags = ["code", "data"]
text = '''Place: the effect's spot on the map (`at`, `SOURCE_GROUND` by default: the thing the command plays for), turned into minimap pixels; `MAP_CENTER` is the middle of the map.'''

[[topic.rule]]
id = "blip-size"
tags = ["code", "data"]
text = '''Size: the picture is drawn at its own pixel size, one texel to one minimap pixel, centred on the spot. The minimap is `minimap_size` pixels (172 by 172 from the widget template), so Radar Scan's picture covers most of it and an event's 32 by 32 is a small square. Only the picture's texels with alpha above half are drawn, fully opaque; the rest of the picture leaves the minimap as it is. Pixels off the minimap are dropped.'''

[[topic.rule]]
id = "blip-colour"
tags = ["code"]
text = '''Colour: each drawn texel is its own colour times `src_color` or times `dst_color`, channel by channel.'''

[[topic.rule]]
id = "blip-timing"
tags = ["code", "data"]
text = '''Timing: the blip is shown from the next time the minimap redraws its things (every `MinimapPeriodUpdateObjects`, 1 second, in `AVars.tgi`), for `blink_count` of those redraws. Each blink is the picture in `src_color` for the first half of the period and in `dst_color` for the second: a hard switch, not a fade, and the same in every blink. So a blip of 3 blinks lasts 3 seconds. The minimap keeps time in real seconds, not game time.'''

[[topic.rule]]
id = "blip-layer"
tags = ["code"]
text = '''Layer: it's drawn into the minimap's layer of things' marks, over the ordinary marks, but a mark that's blinking for its own reasons (a thing under siege or out of supply, see [supply](supply.toml)) is drawn over the blip where they overlap. Where blips overlap, the newest is on top.'''

[[topic.rule]]
id = "blip-users"
tags = ["data"]
text = '''No other operation or ability uses it.'''

[[topic]]
title = "Capture"

[[topic.rule]]
id = "capture-events"
tags = ["code"]
text = '''A building changes hands the same way whether it was shot down to no health or is a city centre won by holding its zone, and both raise the same two events. Nothing happens unless the new owner differs from the old.'''

[[topic.rule]]
id = "actor-captured-by-enemy"
tags = ["code", "data"]
text = '''`actor_captured_by_enemy` goes to the player who lost it, before the building changes owner: "%s captured by %s", the building's name and the taker (the taking side, shown as [messages](messages.toml), Names in lines, describes, or the capturing thing's name when it belongs to no side). Its sound is `actor_captured_by_enemy_sfx` (BuildingLost.wav).'''

[[topic.rule]]
id = "actor-captured"
tags = ["code", "data"]
text = '''`actor_captured` goes to the player who took it, after it has changed owner: "You have captured %s", the building's name. Its sound is `actor_captured_sfx` (BuildingGained.wav).'''

[[topic.rule]]
id = "who-hears-capture"
tags = ["code"]
text = '''So with the rules above: the player here hears BuildingGained when they take a building and BuildingLost when one of theirs is taken, by anyone, AI included. An AI's capture from another AI or from nobody is silent here, as is any capture by or from an ally. A building nobody owned tells only its taker.'''

[[topic.rule]]
id = "capture-event-at-building"
tags = ["code", "guess"]
text = '''Each event is about the building itself, so its radar blip is at the building, and either side is told only if it can see the building at that moment (the loser's event comes while the building is still its own, the taker's just after it's become theirs). In practice both sides see it: the taker has units on the spot or shooting at it.'''

[[topic.rule]]
id = "city-member-buildings"
tags = ["code"]
text = '''A city's member buildings follow the centre to its new owner without being captured themselves, so a city taken by its zone raises each event once, for the centre, not once per member. Members can't be captured on their own by damage while their city stands ([buildings](buildings.toml), Capture by damage).'''

[[topic.rule]]
id = "no-capture-event-limit"
tags = ["code"]
text = '''Nothing else limits how often these play: two buildings taken in quick succession raise two of each event, with two message lines and two blips. The second sound is dropped if the first is still playing ([sounds](sounds.toml), Event sounds).'''
