subject = "Saved state"
summary = '''What the less obvious values a map (or saved game) stores mean to the game, named by the fields of `docs/formats/rmp.ksy` in the public repo, and which of them the game ignores. Shipped maps hold the stock value in nearly all of these, so most can't be told apart from the data alone.'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''
intro = '''Some of these the format gives a meaning that AA itself never uses (another game on the same engine does). Name a field for what it means in the format, and say in its doc what AA does with it ("always -1 in AA, which never reads it"); keep "unused" for fields nothing gives a meaning. The other game needn't be named.'''

[[topic]]
title = "The map as a whole"

[[topic.rule]]
id = "height-map-resolution"
tags = ["code"]
text = '''`height_map`: the value after `default` is the resolution the map was made with, as a power of two (`HeightmapResolutionBits`, stock 1). A map whose value differs from the game's setting is refused as it loads, as is one whose vertex count doesn't fit that resolution. The map's own `min`, `max` and `default` replace the game's for that map.'''

[[topic.rule]]
id = "terrain-resolution"
tags = ["code"]
text = '''`terrain`: the value after `version` is likewise the tile resolution (`MapGTileResolutionBits`, stock 1), and a map that disagrees with the setting is refused. The grids these give are in [terrain](terrain.toml).'''

[[topic.rule]]
id = "map-header-unused"
tags = ["code", "data"]
text = '''`map_header` `unused` (the byte after `edition`) is kept with the map and written back when it's saved, and nothing else reads it. Kohan II, on the same engine, does the same and nothing more, so it has no meaning to recover; 0 in every map of both games.'''

[[topic.rule]]
id = "tile-unused"
tags = ["code"]
text = '''`tile` `unused` (version 7 on) is never read; the game writes 0 there when it saves a map, in both games.'''

[[topic.rule]]
id = "triggers-unused-strings"
tags = ["code", "data"]
text = '''`triggers` `unused_strings` (version 5 on) is likewise kept and written back but never read, in both games; it's empty in every shipped map of either.'''

[[topic]]
title = "Saved groups"

[[topic.rule]]
id = "saved-group-name"
tags = ["code"]
text = '''A saved group's second string is its display name: "Group N" in the player's language (`static_group_name|s`), N being the digits of the group's `name`. It's made when the group is first saved and read back as stored.'''

[[topic]]
title = "Abilities"

[[topic.rule]]
id = "ability-unused1"
tags = ["code"]
text = '''`ability` `unused1` is never used: 0 when the ability is made, then only loaded and saved, in both games.'''

[[topic.rule]]
id = "ability-usable-now"
tags = ["code", "data"]
text = '''`ability` `unused2` is whether the actor may use the ability now. An ability that lists `required_properties` is usable only while the actor holds all of them, and one with `required_experience_min` or `required_experience_max` only while the actor's level is within them; the flag is worked out again whenever the actor gains or loses a property or its experience changes. Using an ability whose flag is 0 is refused. 1 in every shipped map, meaning "nothing missing"; a unit saved short of a requirement (a bomber before `tech_napalm`, say) holds 0.'''

[[topic.rule]]
id = "performer-how-started"
tags = ["code"]
text = '''`performer` `unknown` (version 6 on) says how the ability under way was started: 1 for an ordinary use, 3 for a bombardment (the unit was ordered to bombard, or the ability is flagged `BOMBARD`). A commander's own abilities are also used as 3. It stays at 0 until the actor first uses an ability. The value travels with the attack into the damage it does (below).'''

[[topic]]
title = "Shared properties an actor holds"
intro = '''A property an actor holds (its `property` record) carries, in file order:'''

[[topic.rule]]
id = "property-time-gained"
tags = ["code"]
text = '''`unknown`: the game time it was gained, in seconds, as an f4 like the other game times.'''

[[topic.rule]]
id = "property-source"
tags = ["code"]
text = '''`unknown2`: where it came from. Values seen: 1 an ability's effect, 2 granted kingdom-wide (technology and the like), 5 the terrain the unit stands on, 9 the unit's stance; others exist (0, 3, 6, 10).'''

[[topic.rule]]
id = "property-already-held"
tags = ["code"]
text = '''`unknown3`: set when the actor already held that property from the same source: the copy is kept but adds nothing. On load, a property with this clear applies its modifiers; one with it set is dropped if its twin is already there.'''

[[topic.rule]]
id = "property-from-actor"
tags = ["code"]
text = '''`unknown4`: the thing id of the actor it came from, 0 for none. On load, a property that came from another actor is dropped unless it's the kind that passes between actors.'''

[[topic.rule]]
id = "property-second-actor"
tags = ["code"]
text = '''`extra` (properties of the second kind): a second actor's thing id, set when an ability hands the property over. What that actor is to the property is open.'''

[[topic.rule]]
id = "properties-dropped-old-maps"
tags = ["code"]
text = '''In maps whose world version is 20 or below, every property actors hold is dropped as the map loads.'''

[[topic.rule]]
id = "no-shipped-properties"
tags = ["data"]
text = '''No shipped map stores any: every actor in AA's maps has an empty list (world versions 21 to 28).'''

[[topic]]
title = "Animation"

[[topic.rule]]
id = "character-pending-stance"
tags = ["code"]
text = '''`character` `unknown` (version 2 on) is a stance waiting to take effect. When a unit changes stance to one that needs a different set of animations, the change waits for the next animation to start; this holds the stance meanwhile: -1 the template's default stance, another value a stance's index, -2 none (stock).'''

[[topic]]
title = "Damage taken"
intro = '''The `damage` record is one hit:'''

[[topic.rule]]
id = "damage-attacker"
tags = ["code"]
text = '''`unknown1`: the thing id of the attacker, then the thing id of the one credited with the attack when that's someone else (the commander, for its own abilities), else 0.'''

[[topic.rule]]
id = "damage-type"
tags = ["code"]
text = '''`name`: the damage type.'''

[[topic.rule]]
id = "damage-amount-time"
tags = ["code"]
text = '''`unknown2`: the damage dealt (f4) and the game time it landed (f4).'''

[[topic.rule]]
id = "damage-how-started"
tags = ["code"]
text = '''`unknown3_v15` (world versions 15 to 17) is read and ignored. `unknown3` (18 on) is how the attack was started, as the performer's value above.'''

[[topic.rule]]
id = "damage-cause"
tags = ["code"]
text = '''`unknown4` (20 on): what dealt it: 4 an ability's main damage, 5 its added damage; other causes give other values.'''

[[topic]]
title = "Where the records are kept"
under = "Damage taken"

[[topic.rule]]
id = "element-damage-history"
tags = ["code"]
text = '''An element keeps the hits it took in the last `ROEPrimaryDamageHistoryLength` seconds (stock 3), but only while it's its regiment's primary, the member whose fate the regiment watches; older records are dropped as each new hit comes in. Every other element's list stays empty.'''

[[topic.rule]]
id = "regiment-last-hit"
tags = ["code"]
text = '''A regiment's single record is the last hit any of its members took. A hit started as a bombardment doesn't make the regiment engage the attacker (see [combat](combat.toml)).'''

[[topic]]
title = "Regiments"

[[topic.rule]]
id = "replacement-health"
tags = ["code"]
text = '''`organization` `unknown1` (one per position, version 1 on; stored as f4) is, for a position whose member has been lost, the health its replacement has built up so far. It grows by the member template's `resupply_rate` times its maximum health per second, scaled down by the kingdom's upkeep shortfall; when it reaches full health the member is back. The empty position shows this as its health. It's 0 for filled positions. When a regiment replenishes at all: [supply](supply.toml).'''

[[topic.rule]]
id = "regiment-attack-efficiency"
tags = ["code"]
text = '''`unknown2` is the regiment's attack efficiency now, the `efficiency` of [combat](combat.toml); it eases over time towards `level`, which is the efficiency its properties set (stock 1).'''

[[topic.rule]]
id = "regiment-aggressive-flags"
tags = ["code"]
text = '''`unknown3` is whether its current formation is aggressive, `unknown4` whether the regiment is aggressive now (as in [combat](combat.toml)'s Engagement).'''

[[topic.rule]]
id = "organization-damage"
tags = ["code"]
text = '''`damage`: the last hit a member took (above).'''

[[topic]]
title = "Buildings that house denizens"

[[topic.rule]]
id = "denizens-sally-escort"
tags = ["code"]
text = '''`denizen` `unknown1` is whether its denizens have sallied out: `sally_forth` sets it and `recall` clears it. `unknown2` is whether fighter escort is on: `escort_on` sets it and `escort_off` clears it. Each also decides which command of its pair the player is offered.'''

[[topic.rule]]
id = "denizen-item-outside"
tags = ["code"]
text = '''`denizen_item` `unknown` is the thing id of that denizen while it's out of the building, 0 while it's inside; `health` is the health it keeps while inside, where it heals.'''

[[topic.rule]]
id = "runway-last-takeoff"
tags = ["code"]
text = '''`unknown3` is when the last aircraft took off from its runway. It starts at minus the runway's `delay`, so the first can go at once (stock -1 or -0, for a `delay` of 1 or 0).'''

[[topic.rule]]
id = "runway-takeoff-queue"
tags = ["code"]
text = '''`ids` are the aircraft waiting their turn to take off, when the runway has a `delay`.'''

[[topic.rule]]
id = "sorties-under-way"
tags = ["code"]
text = '''The trailing count is of the sorties under way (air attacks, recon flights, sallies), each saved as a record of its own; no shipped map has one, so their layout is undecoded.'''

[[topic]]
title = "Recruiting"

[[topic.rule]]
id = "recruit-rally-point"
tags = ["code"]
text = '''`recruit` `unknown1` (present when `has_unknown1` is set) is the rally point, (x, y), where new recruits head.'''

[[topic.rule]]
id = "recruit-old-entries"
tags = ["code"]
text = '''The version 1–2 entries and the `unknown2` and `unknown3` after them are read and thrown away.'''

[[topic]]
title = "Packing"

[[topic.rule]]
id = "packed-health-share"
tags = ["code"]
text = '''`mobile_deployment` `unused` is the share of full health carried across packing, in both games. Packing a building into its truck stores the building's health over its maximum here, on the truck; unpacking gives the new building that share of its own maximum. It starts at 1, so a truck that never was a building unpacks at full health.'''

[[topic]]
title = "Defensive abilities"

[[topic.rule]]
id = "defender-engaged-targets"
tags = ["code"]
text = '''`defender` `unknown` is a list of (thing id, thing id) pairs: for each target its abilities are working on, the target and the organization registered as engaging it (the defender's own regiment, or itself). When an ability changes target the old target is released.'''

[[topic]]
title = "Research"

[[topic.rule]]
id = "completed-research"
tags = ["code"]
text = '''`research` `unknown` lists the research (shared property ids) completed at that building. An id the template no longer offers is dropped with a warning.'''

[[topic]]
title = "Deliveries"
intro = '''`transport` is a unit bringing others onto the map, such as a summoned force. How a delivery plays out is in [deliveries](deliveries.toml); this is what its saved fields mean:'''

[[topic.rule]]
id = "delivery-cargo"
tags = ["code"]
text = '''`template` and `layout` are what it delivers.'''

[[topic.rule]]
id = "delivery-progress"
tags = ["code", "data"]
text = '''`destination`, `started`, `assigned`, `num_to_deliver` and `num_delivered`: every transport starts with all of these at 0. Being given a delivery (a summoning ability, a trigger, a building sending one out) sets `assigned`, along with the place and the count, and nothing clears it; `started` is set once the first unit is put down. So the 47 transports in shipped maps, all 0, are transports never given a delivery. A transport with a delivery isn't taken back into a building as a denizen.'''

[[topic.rule]]
id = "cargo-cost-upkeep"
tags = ["code"]
text = '''`unknown1` and `unknown2` aren't lists of ids but resource amounts, one value per resource kind (the count, then an f4 each): `unknown1` what the cargo cost, `unknown2` the cargo's upkeep. While it carries them the transport stands in for its cargo in the kingdom's accounts: it charges the kingdom the cargo's upkeep, and counts as costing what the cargo cost, instead of its own figures. A summoned or map-edge delivery has no cost and the upkeep of the delivered template plus that of each layout slot's template; a unit bought at a building and flown in brings the cost and upkeep it was bought with. Both are emptied when it finishes unloading, or fails to. Same in both games.'''

[[topic.rule]]
id = "summon-point"
tags = ["code"]
text = '''`summon` (version 3 on, when `has_summon` is set): the point on the map's edge the transport came in from, (x, y). A summoned transport (and a map-edge delivery from a building or trigger) flies back to it once it's delivered and is taken off the map there; a transport without it stays.'''

[[topic.rule]]
id = "delivered-actor-name"
tags = ["code", "data"]
text = '''`unknown3` (version 5 on): the name the delivered actor is given, the one triggers refer to it by; empty for none. The trigger effect `actor_create_transported_named` sets it from its text argument; summoning and buying set it empty. Both games have that effect, so an AA map can hold a value here.'''

[[topic.rule]]
id = "last-delivered-next-slot"
tags = ["code"]
text = '''`last_delivered` (version 4 on): the thing id of the last one it delivered. `next_slot`: the next layout slot to deliver.'''

[[topic.rule]]
id = "delivery-hq"
tags = ["code"]
text = '''`hq` (version 6 on): the HQ the delivered organization attaches to, 0 for none.'''

[[topic.rule]]
id = "deliveries-empty-shipped"
tags = ["code", "data"]
text = '''These are all at their empty values in shipped maps only because no map was saved with a delivery under way.'''

[[topic]]
title = "Lairs"

[[topic.rule]]
id = "lair-unguarded"
tags = ["code"]
text = '''`lair` `unguarded` is 0 for a lair that guards itself and the lairs it spawned, sending its denizens after whatever damages them; non-zero turns that off. Nothing in the game sets it.'''

[[topic.rule]]
id = "lair-unused"
tags = ["code"]
text = '''`unused` is set to -1 when the lair is made and never used, in Kohan II too.'''

[[topic]]
title = "HQs"

[[topic.rule]]
id = "hq-old"
tags = ["code"]
text = '''`hq` `old` (version 1 only) is read and thrown away.'''

[[topic.rule]]
id = "hq-attachment-kind"
tags = ["code"]
text = '''`hq_attachment` `kind` is what's attached: 0 an organization, 1 a transport, 3 none (an empty slot, dropped as the HQ loads). `unused` is -1 for all of these.'''

[[topic.rule]]
id = "hq-queued-slot"
tags = ["code", "data"]
text = '''Kind 2 is a slot held for an organization still waiting in the recruit queue of the HQ's building: `organization` is then the building's thing id and `unused` the queue entry, which the interface uses to show what's coming. The slot is given up if the entry leaves the queue, and becomes kind 0 or 1 when the organization arrives. Both games make these ([supply](supply.toml), Attaching to an HQ), so a game saved with a regiment queued at an HQ holds one; shipped AA maps have none, so there `unused` is always -1.'''

[[topic]]
title = "Areas"

[[topic.rule]]
id = "area-things-inside"
tags = ["code", "data"]
text = '''`area` `unknown` is the count of a list that follows it: for each thing inside the area, its thing id (u4) and a byte the game uses while checking (0 when saved). The game keeps the list as play goes on, adding any actor with a body or an organization that comes inside (which is what fires an area's "entered" trigger events, once per stay) and dropping those that leave. Same in both games. A map saved from the editor has an empty list, as nothing has moved yet; a saved game can hold entries.'''

[[topic]]
title = "Construction"

[[topic.rule]]
id = "construction-old-upgrade"
tags = ["code"]
text = '''`construction` `unknown` (version 0 only) is the state of an upgrade under the old upgrading rules. Both values must be 0: a map with either set is refused as it loads, with a warning that the upgrading system changed. Same in both games.'''

[[topic]]
title = "Layouts"

[[topic.rule]]
id = "layout-slot-templates"
tags = ["code", "data"]
text = '''`layout` `unknown1` is the layout's own id again (an `OrganizationLayout`, such as `herd_ambient_large`), and `unknown2` the element template in each of its slots, in slot order, empty for an empty slot: the same as an organization template's `layout_IDS` and its slots' `element_IDS`. The `id` before them is read first so the right number of slots can be made; a layout whose saved slot count differs from its data stops the map loading ("data changed"). Organizations being delivered, recruited or ordered carry their make-up this way, in both games.'''

[[topic]]
title = "Orders and minds"
intro = '''Times below are game times in seconds, stored as f4 even where the format doc reads a u4. Each order's values outlast it: nothing clears them when the order ends, so a saved mind often holds what its last order of that kind left.'''

[[topic.rule]]
id = "denizen-jobs"
tags = ["code"]
text = '''`mind_base` `denizen_jobs` is a set of flags for what a building's denizens are sent out to do (defend the building, sally, an air mission); 0 for every actor that isn't a denizen. Which flag is which is open.'''

[[topic.rule]]
id = "attack-target"
tags = ["code"]
text = '''`mind_base` `attack_target` (version 1 on) is the actor an organization was ordered to attack, 0 for none.'''

[[topic]]
title = "A unit's mind"
under = "Orders and minds"

[[topic.rule]]
id = "unit-aggressiveness"
tags = ["code"]
text = '''`aggressiveness` is the unit's own, used only while it isn't part of a regiment (a regiment member follows the regiment's): 2 aggressive, 0 not; units start at 1. Whether 1 acts as aggressive is open.'''

[[topic.rule]]
id = "unit-engage-after"
tags = ["code"]
text = '''`engage_after` (version 3 on) is the time before which the unit won't fight again after falling back to its position: `ROEPrimaryEngageReturnTimeout` (stock 5) seconds after it fell back. 0 for none.'''

[[topic.rule]]
id = "unit-pack-check"
tags = ["code"]
text = '''`sleep_unknown` (version 9 on): when an idle unit next checks whether to follow its regiment's leader in packing. Every 3 seconds a unit that can pack or unpack unpacks if the leader is unpacked and it isn't, and packs if the leader is packed or packing. Starts at 0.'''

[[topic.rule]]
id = "unit-path-plans"
tags = ["code"]
text = '''`move_unknown1`: how many times the unit has planned its path for this move. On a third failed plan the move is given up. Reset when a move starts, when it reaches the next point of its path, and when a target it follows moves.'''

[[topic.rule]]
id = "unit-planned-destination"
tags = ["code"]
text = '''`move_unknown2` (8 bytes): the destination, (x, y), when the path was last planned. A unit moving to another actor plans again once that actor has moved away from this point by more than about 0.38 of the distance to it.'''

[[topic.rule]]
id = "unit-turn-distance"
tags = ["code"]
text = '''`move_unknown3` (an f4): how far before each corner of its path the unit starts to turn: its mover's `turn_radius` times the tangent of half the angle between the path's next two legs. The unit steers at a point that far short of the corner. 0 for units that turn instantly, and when only one point is left. How the unit drives the corner is in [movement](movement.toml#corners).'''

[[topic.rule]]
id = "unit-last-detour"
tags = ["code"]
text = '''`move_unknown4` (version 12 on): when the unit last worked a way around something close by; it doesn't do so again within `LowPathingWaitMinimum` (stock 2) seconds.'''

[[topic.rule]]
id = "unit-last-blocker"
tags = ["code"]
text = '''`move_unknown5` (version 10 on, 24 bytes): the last thing that blocked the move: what kind (u4: 0 nothing, 1 impassable ground, 2 an actor or object, 3 the map's edge), the blocker's thing id (u4), the blocked tile's column and row (s4 each), then the direction the unit was moving, (x, y). The unit reacts by its kind: it attacks or steps around an actor in the way, and steers round blocked ground. Empty is all zeros with direction (0, -1).'''

[[topic.rule]]
id = "unit-regiment-reattach"
tags = ["code"]
text = '''`move_unknown6` (version 7 on): when the unit was last keeping up with its regiment while moving. A unit moving outside its regiment for `MoverDetachedSecondsUntilReattach` (stock 2) seconds goes back to it. Set to the time the move starts.'''

[[topic.rule]]
id = "unit-engage-unknown1"
tags = ["code"]
text = '''`engage_unknown1` is 3 for a new unit and is never read or changed otherwise.'''

[[topic.rule]]
id = "unit-retarget"
tags = ["code"]
text = '''`engage_unknown2` is set when the unit must pick a new target in combat: when it starts fighting, when its target is no longer valid, and when something happens that calls for a new choice; the unit then picks and clears it.'''

[[topic.rule]]
id = "unit-repair-approach"
tags = ["code"]
text = '''`repair_unknown1` is set while the unit is still walking to what it's to repair, and cleared when it starts work.'''

[[topic.rule]]
id = "unit-raze"
tags = ["code"]
text = '''`repair_unknown2` (version 8 on) is set for a raze order (below): the unit carries on when the target is at full health instead of stopping.'''

[[topic.rule]]
id = "unit-bombard-target"
tags = ["code"]
text = '''`bombard_unknown` (version 4 on): the display name of the actor it's shelling, empty when shelling a place. Only whether it's empty matters: once the target is gone, it tells shelling a target from shelling a place.'''

[[topic.rule]]
id = "unload-next-passenger"
tags = ["code"]
text = '''`unload_unknown` (version 11 on), on a transport unloading: when the next passenger gets off. Each one waits the transport template's `deployment_delay` after the one before; 0 to start, so the first gets off at once.'''

[[topic.rule]]
id = "deploy-blocked-count"
tags = ["code"]
text = '''`deploy_unknown` (version 11 on), on a unit being put down: how many times the spot it arrived at was blocked. Each time it moves to a free spot nearby; the sixth time, it dies. Reset when it starts.'''

[[topic]]
title = "A group's mind"
under = "Orders and minds"

[[topic.rule]]
id = "group-forming-places"
tags = ["code"]
text = '''`sleep_unknown1` (version 9 on): set while the group is putting its members into their formation places; `sleep_unknown2` (version 9 on) how many times it has sent them (it tries twice). A resting group does this whenever its make-up changes, and when it reforms.'''

[[topic.rule]]
id = "group-form-on-leader"
tags = ["code"]
text = '''`sleep_unknown3` (version 12 on): when set, the group first moves itself onto its leader and lays the places out around it, rather than around where the group stands. AA never sets it (only clears it), so it matters only if a map holds a 1.'''

[[topic.rule]]
id = "rampage-gathering"
tags = ["code"]
text = '''`rampage_unknown`: set while a rampaging group is gathering in its strays. Once more than `rampage_max_detached_ratio` of its members are off on their own, it rests and calls them back, and goes on rampaging when all are back.'''

[[topic.rule]]
id = "group-move-speed"
tags = ["code"]
text = '''`move_unknown1` (an f4): the speed the group moves at, at most its full speed; 0 means full speed. It comes from a move order's speed (below); moves the group makes for itself use full speed.'''

[[topic.rule]]
id = "group-path-plans"
tags = ["code"]
text = '''`move_unknown2`: how many times it has planned its path for this move. After the third plan, once `CAIMoveMinSecondsBeforeFail` (stock 5) seconds have passed since the move began, it gives up.'''

[[topic.rule]]
id = "group-bombard-target"
tags = ["code"]
text = '''`bombard_unknown` (version 6 on): as for a unit. When the shelled actor is gone, a group that can see its last place gives up; one that can't keeps shelling that place.'''

[[topic.rule]]
id = "siege-target-city"
tags = ["code"]
text = '''`siege_unknown1` (version 4 on): the thing id of the target under siege. `siege_unknown2` (version 4, and 13 on): the thing id of the city that target belongs to. If that city is gone, has no owner, or the target no longer belongs to it, the siege becomes a plain attack.'''

[[topic.rule]]
id = "chase-target"
tags = ["code"]
text = '''`chasing_unknown`: the thing id of the organization it's chasing after that one got out of reach in combat.'''

[[topic.rule]]
id = "group-construct"
tags = ["code"]
text = '''`construct_unknown1`: set while the group is still on its way to the building site; it shows as building once there. `construct_unknown2` (version 11 on): the number an order to build carries (its speed value, below, as a whole number), -1 when it carries none; it's handed on with the building made. What the building does with it is open.'''

[[topic.rule]]
id = "group-repair"
tags = ["code"]
text = '''`repair_unknown1`: set while moving to the target; `repair_unknown2`: the thing id of the structure; `repair_unknown3` (version 10 on): set for a raze order. A razing group shows as razing and doesn't stop at full health; otherwise it shows as building (a structure not yet finished) or repairing, and stops once the target is whole.'''

[[topic.rule]]
id = "guard-state"
tags = ["code"]
text = '''Guard ([combat](combat.toml), Guard orders). `guard_doing` (`guard_unknown1`): what the guard is doing now: 0 nothing, 1 resting at its post, 2 going to its post, 3 shelling an intruder, 4 attacking one. `guard_sent_back` (`guard_unknown2`): set once it's been sent to its post, cleared when it goes for an intruder, when the post moves, and whenever the guard starts or resumes after a fight. `guard_target` (`guard_unknown3`): the thing id of the actor it guards, 0 when it guards a place. `guard_location`: the post, the ordered point or, for a guarded actor, the point beside it last worked out. `guard_facing`: the facing the order carried, (0, 0) for none. Whether the regiment is guarding at all is its guard state's activity, like any other state's; these values are what it needs to carry on.'''

[[topic.rule]]
id = "reform-rout-start"
tags = ["code"]
text = '''`reform_unknown`: when reforming began; it ends after `ReformTime` seconds. `rout_unknown`: likewise when a rout began, ending after `RoutingTime`.'''

[[topic.rule]]
id = "retreat-start"
tags = ["code"]
text = '''`retreat_unknown`: when a retreat began; nothing reads it, and `RetreatingTime` limits nothing.'''

[[topic.rule]]
id = "group-engage-siege-city"
tags = ["code"]
text = '''`engage_unknown1` (version 18 on): the city under siege when the fighting broke out during a siege, else 0; cleared when the fighting ends. Nothing reads it.'''

[[topic.rule]]
id = "group-all-engaged"
tags = ["code"]
text = '''`engage_unknown2` (version 19 on): set while every member is fighting a target the group may attack. Its members' choice of ability takes it into account. How is open.'''

[[topic.rule]]
id = "explore-points"
tags = ["code"]
text = '''`explore_unknown1` (8 bytes): the point it's exploring around; `explore_unknown2` (8 bytes): the place it's heading for now, both (0, -1) for none. `explore_unknown3` (version 17 on): how good that place was judged (an f4, -10000 for none). `explore_unknown4` (version 17 on): how well its kingdom knows that place: 0 in view, 1 explored, 2 never seen; the less known wins before the better judged.'''

[[topic.rule]]
id = "explore-place-kind"
tags = ["code"]
text = '''`explore_old` (version 17 on) isn't ignored, whatever the format doc says: it's what kind of place it picks, 0 somewhere at random near the group, 1 a waypoint or the point it was ordered to. A new group has 1; older maps load as 0.'''

[[topic.rule]]
id = "join-target"
tags = ["code"]
text = '''`join_unknown1`: the thing id of the actor it's joining; `join_unknown2`: set once it has arrived. `join_unknown3` (version 7 on): set when what it's joining is a portal, which its members go into one by one; `join_unknown4` (version 7 on): the thing ids of the members already through.'''

[[topic.rule]]
id = "unpack-attempts"
tags = ["code"]
text = '''`unpack_unknown` (version 16 on): how many times it has told its leader to unpack at the site. On the second failure it gives up and its player is told.'''

[[topic]]
title = "Orders"
under = "Orders and minds"

[[topic.rule]]
id = "order-facing-speed-queue"
tags = ["code"]
text = '''`command` `unknown1` is three values: a facing, (x, y), to turn to on arrival; a speed (f4), 0 for full speed, never more than the actor's top speed; and whether the order goes on the end of the actor's queue instead of replacing what it's doing (u1, the player's modifier key). The facing counts only with flag 0x8 and the speed only with flag 0x10.'''

[[topic.rule]]
id = "order-yes-no"
tags = ["code"]
text = '''`unknown2` (version 3 on) is a yes/no whose meaning depends on the order, and counts only with flag 0x200: for `repair` it makes the order a raze; scripts send 1 with `group_behavior_enable`. What it means for other orders is open.'''

[[topic.rule]]
id = "order-flags"
tags = ["code"]
text = '''Other `flags` bits: 0x1 a target, 0x4 a position, 0x20 a layout, 0x40 extra order data, 0x80 a formation, 0x100 a property.'''

[[topic.rule]]
id = "queued-orders"
tags = ["code"]
text = '''A mind's queued orders (`mind_base` `commands`) are the orders waiting after the current one, first to be taken first ([commands](commands.toml#queued-orders)); a group keeps its own queue of orders given to it as a whole, saved with the group.'''

[[topic.rule]]
id = "explore-speed-one"
tags = ["code"]
text = '''An order to explore with a speed of exactly 1, given to a group already exploring, only moves the point it explores around.'''

