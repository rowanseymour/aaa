subject = "Movement"
summary = '''How a ground unit drives a route once it has one: turning, speed, corners, what it does about a spot it can't turn onto, when it counts as arrived, the Explore order, and how a truck's trailer follows. Where a route's points go isn't covered, only when there's no route to be had ([Moves that can't be made](#moves-that-cant-be-made)). What a mind saves about a move is in [saved state](saved-state.toml).'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "Turn types"

[[topic.rule]]
id = "turn-type-values"
tags = ["code"]
text = '''A mover's `turn_type` is `INSTANT`, `IN_PLACE` or `WHILE_MOVING`. `INSTANT` units face any new heading at once and their `turn_radius` is ignored (treated as 0 everywhere below).'''

[[topic.rule]]
id = "turn-rate"
tags = ["code", "data"]
text = '''`IN_PLACE` and `WHILE_MOVING` move alike: nothing in how the unit turns, drives or arrives tells them apart. Both turn at a fixed rate of `speed_max` / `turn_radius` radians a second, whatever speed the unit is doing at the time. Stock HQ and supply trucks (`speed_max` 3, `turn_radius` 3) turn at 1 radian a second. So an `IN_PLACE` unit does not stop to turn: it drives while turning. `turn_radians_per_sec` is never used.'''

[[topic.rule]]
id = "default-turn-type"
tags = ["code", "data"]
text = '''The root mover template sets `turn_type = INSTANT`, so a unit with a `turn_radius` and no `turn_type` anywhere up its template chain turns instantly and its radius does nothing. A unit that sets only `turn_radius` keeps its template's `turn_type`: stock halftracks set 1.5 over their template's `WHILE_MOVING`.'''

[[topic]]
title = "Driving a leg"

[[topic.rule]]
id = "route-points"
tags = ["code"]
text = '''A route is a list of points, each with a heading: the direction of travel along the leg that ends at it. A point made for a move straight from where the unit stands has the direction from the unit to the point.'''

[[topic.rule]]
id = "leg-heading-and-aim"
tags = ["code"]
text = '''For each leg the unit has a heading to hold (the leg's) and an aim point: the leg's point, pulled back along the heading by the corner lead (see [Corners](#corners)). The heading stays as it was when the leg was made; it is not re-aimed at the point as the unit moves.'''

[[topic.rule]]
id = "step-order"
tags = ["code"]
text = '''
Each simulation step, in this order:
1. It turns toward the leg's heading by its turn rate times the step length, the shorter way round. If that is enough to reach the heading it takes the heading exactly.
2. Its speed changes (see [Speed](#speed)).
3. It moves speed times the step length along the way it now faces, never sideways or backwards.

So it doesn't steer at its aim point: it swings onto the leg's heading and drives, and if the swing carries it off the leg's line it stays off until it gets back on line ([Second thoughts](#second-thoughts)).
'''

[[topic.rule]]
id = "leg-end"
tags = ["code"]
text = '''The leg ends when the distance left to the aim point, measured along the leg's heading (not straight-line), is no more than one step's travel. That includes a unit already level with or past the aim point, however far to the side it is and whichever way it faces. On that step, a unit facing exactly along the heading moves just the distance left, ending level with the aim point; any other takes a full step.'''

[[topic.rule]]
id = "leg-end-near-aim"
tags = ["code"]
text = '''A leg also ends at once when the unit is within 0.01 of the aim point, and a leg whose aim point is within `TAIReachedDestinationThreshold` (stock 0.1) of the unit when it's set ends without moving.'''

[[topic.rule]]
id = "passed-points-skipped"
tags = ["code"]
text = '''A point the unit is already level with or past (measured along that point's heading) when it comes to steer for it is skipped.'''

[[topic]]
title = "Speed"

[[topic.rule]]
id = "travel-speed"
tags = ["code"]
text = '''A unit drives at its travel speed: its top speed (`speed_max` as its properties change it, [below](#a-units-top-speed)) unless its order or its regiment sets a lower one ([a regiment's speed](#a-regiments-speed)).'''

[[topic.rule]]
id = "acceleration"
tags = ["code"]
text = '''Speeding up, it gains `acceleration` a second until it reaches the travel speed; `acceleration` 0 means it's at travel speed at once.'''

[[topic.rule]]
id = "slowing-down"
tags = ["code"]
text = '''Slowing down is immediate: a lower travel speed is taken at once, and a unit that stops, stops dead on the step it arrives. `acceleration` plays no part in stopping.'''

[[topic.rule]]
id = "no-slowing-to-turn"
tags = ["code"]
text = '''It never slows, stops or reverses to make a turn.'''

[[topic.rule]]
id = "terrain-speed-limit"
tags = ["code", "data", "guess"]
text = '''
Terrain sets a speed limit. Each terrain has at most one, for everyone on it:
- It's the `TerrainSpeedModifier` amount of the last property the terrain lists that has one above 0. Stock terrains list the infantry property and then the vehicle one, so the vehicle figure is the terrain's limit: city 3, forest 2, jungle 1.5, sand and snow 3.5. The infantry figures (forest 2.5, jungle, sand and snow 2) are never used for movement.
- A terrain that lists no such property has no limit.
- The limit used is never below `TerrainMinimumMoveSpeed`, which the data files don't set; the game's own default is 0.5.
- A terrain of type `MOUNTAIN` is given a limit of 0.0001 whatever it lists, which that floor then raises: on a mountain the limit in play is `TerrainMinimumMoveSpeed` itself, 0.5 with stock data. It doesn't depend on what any other terrain lists.
- It seldom comes up. A terrain says who may cross it with `land` and `water`; `MountainTerrain` sets both false and no stock mountain changes them, so mountain tiles are closed to everything that moves on land or water. Aircraft, which do cross them, have no terrain looked at and so no limit ([terrain](terrain.toml)). The mountain limit only bites on a ground unit whose terrain is a mountain anyway: one a map placed there, or a regiment member with its regiment whose regiment's position is on one.
- Each step, after the unit's speed has moved towards its travel speed, a speed above the limit is cut to it at once (a regiment member keeping its place then stretches its step, so it can go faster: [keeping place](#keeping-place)). It's an absolute speed, not a share of `speed_max`: a unit slower than the limit isn't affected.
- Whether the unit holds the terrain's property plays no part, nor whether it's infantry or a vehicle: foot soldiers in forest are held to 2 like the tanks.
- The terrain is the unit's terrain as [terrain](terrain.toml) has it: a member with its regiment (the leader, or a member inside the regiment's control zone, `control_range`) is limited by the terrain under the regiment's position, not by the tile it's on, so one lagging behind in forest while the regiment's position is on open ground has no limit at all. Whether a member is with its regiment is judged as [supply](supply.toml#member-with-regiment) has it, so the body of a regiment shares one terrain limit, on top of moving at its slowest member's top speed ([a regiment's speed](#a-regiments-speed)). A straggler is limited by its own tile.
- A unit with the `TRAILBLAZING` flag (property `trailblazing`, held by the stock recon regiments) ignores the limit.
'''

[[topic.rule]]
id = "speed-carries-between-legs"
tags = ["code"]
text = '''Speed carries through from one leg to the next. After a stop (the end of a move, or between tries at a missed destination) it starts from 0 again.'''

[[topic.rule]]
id = "tighter-turns-below-top-speed"
tags = ["code"]
text = '''Because the turn rate is fixed, a unit below its top speed (still accelerating, or held back by its regiment) turns in a tighter circle than `turn_radius`: the circle's radius is `turn_radius` times its speed over its top speed.'''

[[topic]]
title = "A unit's top speed"
under = "Speed"

[[topic.rule]]
id = "top-speed"
tags = ["code", "data"]
text = '''
A unit's top speed is its `speed_max` times (1 + the sum of the `SPEED_MAX` `MultiplyModifier` amounts of every property it holds), never below 0.05 times `speed_max` (`ModifierAttributeClampMultiply`). The amounts add; they don't multiply each other.
- Example: an infantry unit in Assault formation (−0.25), engaged (+0.25) and prone (−0.6) is at 1 − 0.25 + 0.25 − 0.6 = 0.4 of its `speed_max`.
- The same property held twice (from two sources, or the same operation cast on it again) counts once. Different properties add up even when they come from the same kind of source: Courage and Forced March together are +0.7.
'''

[[topic.rule]]
id = "speed-modifiers-per-unit"
tags = ["code"]
text = '''Each modifier works on the unit that holds the property, on that unit's own top speed. A property the regiment holds is handed down to each member, so it reaches every unit in the regiment; see below for which properties those are.'''

[[topic.rule]]
id = "speed-property-requirements"
tags = ["code", "data"]
text = '''A property with `required_properties`, handed down from a regiment or given by a technology, reaches only the units that have them (a special operation gives its property without checking, [special operations](special-ops.toml)). A technology is given to every unit of its side that qualifies: `tech_diesel_engines` (`AATechnologyTank`, `required_properties = tank`) speeds up only the tanks of a mixed regiment, and `tech_superchargers` (`AATechnologyAirplane`, `aircraft`) only aircraft, delivery planes included, which fly at their top speed ([deliveries](deliveries.toml#the-air-transport)). Handing down from the regiment checks each member the same way.'''

[[topic.rule]]
id = "top-speed-changes"
tags = ["code", "guess"]
text = '''The top speed is recomputed whenever a property arrives or goes, and a unit faster than its new top speed drops to it at once. A rise doesn't speed up a unit already on its way: it keeps the speed it was last given, and speeds up at its `acceleration` only once it's given a higher one. A regiment's member is given one when its regiment's speed rises and is handed down ([A regiment's speed](#a-regiments-speed)); a unit on its own, at its next move.'''

[[topic.rule]]
id = "turn-rate-follows-top-speed"
tags = ["code"]
text = '''The turn rate follows the top speed: it's the top speed over `turn_radius`, recomputed with it, so a faster unit also turns faster and the circle it draws at top speed keeps the radius `turn_radius`.'''

[[topic.rule]]
id = "terrain-limit-last"
tags = ["code"]
text = '''The terrain limit is applied after all this, as an absolute speed (above).'''

[[topic.rule]]
id = "stock-speed-modifiers"
tags = ["code", "data"]
text = '''
Where the stock `SPEED_MAX` modifiers come from, and who holds them:

| Source | Held by | Amount | When |
|---|---|---|---|
| Formation `regiment_aggressive` (Assault, the layouts' combat formation) | regiment, handed down | −0.25 | while the regiment is in it |
| Formation `regiment_column` (Column) | regiment, handed down | +0.25 | while in it |
| Formation `regiment_defensive` (Aggressive) | — | none | |
| Layout's Broken Formation property | regiment, handed down | +0.25 | while the regiment has no formation (routing, Exhausted, and the other states below) |
| State `actor_state_engaged` | regiment, handed down; also a unit on its own | +0.25 | while engaged |
| State `actor_state_targeted` | regiment, handed down | −0.10 | while targeted (below) |
| Stance `infantry_kneel` | the unit | −0.2 | while kneeling ([stances](stances.toml)) |
| Stance `infantry_prone` | the unit | −0.6 | while prone ([stances](stances.toml)) |
| Technologies (`tech_diesel_engines` +0.15, `tech_superchargers` +0.25) | each qualifying unit | | once researched |
| Special operations | each unit reached | | while the enchantment lasts ([special operations](special-ops.toml#what-the-modifiers-do)) |
'''

[[topic.rule]]
id = "formation-speed-modifiers"
tags = ["code", "data"]
text = '''
Formations: the formation the regiment is in decides, moving or standing:
- Moving or standing on the player's orders, it's in the formation the player chose, so Column is +0.25 and Assault −0.25 whether or not it's moving.
- Attacking (the approach of an attack order or attack-ground), engaged, and guarding are in the combat formation, Assault, whatever the player chose ([combat](combat.toml#attack-orders)): −0.25.
- Engaged also gives `actor_state_engaged` +0.25, which cancels Assault's −0.25: an engaged regiment's units are at their full `speed_max`, stances aside. On the approach of an attack order the regiment isn't engaged yet, so it closes in at 0.75.
- A regiment in a state whose `formation_required` is `BROKEN` has no formation and holds the Broken Formation property instead: +0.25. In AA's data that's routing and Exhausted, and also chasing a lost attack target (`mind_chasing`), regrouping, reattaching, building, repairing and razing.
- Retreating (`mind_retreating`) takes the layout's retreat formation; no stock layout names one.
'''

[[topic.rule]]
id = "engaged-speed-modifier"
tags = ["code", "data"]
text = '''Engaged: the regiment holds `actor_state_engaged` while it's engaged, and hands it to its members; a unit that is itself engaged holds it too, which counts once ([combat](combat.toml#engaged-and-under-siege)). A unit standing alone and engaged gets the +0.25 with no Assault penalty.'''

[[topic.rule]]
id = "targeted-speed-modifier"
tags = ["code", "data"]
text = '''Targeted: a regiment is targeted while another regiment is engaging it and it isn't engaged itself (it hasn't engaged back, say while moving or routing away). The regiment checks once a second and whenever its activity changes. Its units then move at −0.10.'''

[[topic.rule]]
id = "stance-speed-modifiers"
tags = ["code", "data"]
text = '''Stances: an infantry unit kneels while it is both engaged and under siege ([combat](combat.toml#engaged-and-under-siege)); those whose template also lists `StanceProne` go prone instead at half health or less. The speed changes when the man's stance does, which can wait for the animation he's playing to end. When stances apply, and the rest of what they do: [stances](stances.toml).'''

[[topic]]
title = "A regiment's speed"
under = "Speed"

[[topic.rule]]
id = "regiment-speed"
tags = ["code"]
text = '''A regiment moves at the top speed of its slowest member: the lowest of the members' top speeds, each with its own modifiers. Of a mixed regiment with `tech_diesel_engines`, only the tanks are faster, so the regiment only gains if a tank was its slowest member.'''

[[topic.rule]]
id = "regiment-speed-updates"
tags = ["code"]
text = '''It's kept up to date: a member slowing below it lowers it at once; when the slowest member speeds up, joins or leaves, it's worked out afresh from all the members.'''

[[topic.rule]]
id = "order-speed-handed-down"
tags = ["code"]
text = '''A move order hands the regiment's speed (or a lower one, if the order carries a speed) to every member, and the leader drives the route at it. A change to the regiment's speed during a move is handed to the members again.'''

[[topic.rule]]
id = "order-speed-lasts"
tags = ["code"]
text = '''An order's lower speed lasts for that move: through the fights that interrupt it, since the move takes up again at the same speed, until it arrives or another order replaces it. A trigger's move can give one ([triggers](triggers.toml#effects-the-shipped-multiplayer-maps-use), `actor_moves_to_location`); a person's moves and the moves a regiment makes for itself go at top speed.'''

[[topic.rule]]
id = "regiment-speed-minimum"
tags = ["code"]
text = '''A regiment speed below 0.1 is no speed: a member handed one stops.'''

[[topic]]
title = "Members' routes"
under = "A regiment's speed"

[[topic.rule]]
id = "regiment-places"
tags = ["code"]
text = '''A regiment's places face the way the regiment faces. Each member's place is its position in the layout, set out from the regiment's position (which follows the leader's) and turned to the regiment's facing.'''

[[topic.rule]]
id = "regiment-sets-off"
tags = ["code"]
text = '''When a regiment sets off on a route it turns at once to face along the route's first leg, and its places turn with it. From then on it follows its leader: each time the leader passes a point of the route, the regiment drops that point from its own copy of the route and turns at once to face along the next leg, places and all. So during a move the regiment always faces along the leg its leader is on.'''

[[topic.rule]]
id = "organized-formation-routes"
tags = ["code", "data"]
text = '''
In a formation that is `organized` (every formation a player's regiment can have; AA's ambient herds use `regiment_herding`, which isn't), the leader is handed the route itself, and every other member, with the regiment or away from it, is handed a copy of the route fitted to its place, with the regiment's speed:
- Each point of the copy is the leader's point moved by the member's place: its place's distance ahead of or behind the leader, and to the leader's left or right, as the regiment faces at set-off, laid out along that point's own heading instead. A place 2 to the leader's left puts every point 2 to the left of the leader's point, square to the leg that ends there; a place 3 behind puts it 3 back along that leg.
- Every point but the last is then slid along the leg that ends at it to where that leg's line meets the next leg's line, so the member's legs run parallel to the leader's, each at the same offset, and meet in clean corners: a member on the inside of a turn turns before the leader's corner, one on the outside after it. Where two legs run the same way the point stays where it was moved to.
- The points keep the leader's headings. The last point, the member's destination, is its place at the end of the route as the regiment will face along the last leg.
- Nothing tests the moved points against the ground when the copy is made. A member finds a point it can't reach as it drives: when, at a look, the way to its next point is blocked, it pulls that point back towards the leader's point it was made from, a short step at a time, until it reaches a spot it can drive to in a straight line, and goes there instead. If none is found short of the leader's point, the point is given up at once and counts as passed; but when that point is its last and it isn't within 0.5 of it, its move fails.
'''

[[topic.rule]]
id = "joining-member-route"
tags = ["code"]
text = '''A member that joins the regiment, or comes back to it (back inside its control zone after being cut off), while the regiment is moving is handed a copy at the regiment's next look, about once a second, made the same way from what is left of the route and the regiment's facing then. That holds in any formation, `organized` or not, as long as the regiment is moving in the formation it would choose and its leader is still driving: the copy is fitted to the member's place, which for a regiment with no `organized` formation is where it last stood from the leader.'''

[[topic.rule]]
id = "unorganized-regiment-routes"
tags = ["code"]
text = '''A regiment with no `organized` formation (one routing or exhausted has no formation at all) doesn't keep place. Each member with the regiment is handed the route moved bodily by where the member stands from the leader, unturned and with no corner fitting, and drives it at the regiment's speed like the leader. A member away from the regiment is sent on a move of its own to the route's first point, shifted by where it last stood from the leader while it was with the regiment; only for a route of one point is that the move's destination. `herding` formations (AA's ambient herds, and Kohan II's) aren't covered.'''

[[topic.rule]]
id = "getting-onto-route"
tags = ["code"]
text = '''**Getting onto its route.** Every point keeps the leader's heading, so the first leg holds that heading rather than pointing from where the member stands to its first point. A member off its line (just ordered, or pushed off it) swings onto the heading and drives parallel to its line, and at its next look the correction under [Second thoughts](#second-thoughts) (Getting back on line) brings it back: 1 or more off the line, it turns in by up to 45 degrees for a point on the line ahead, or, where that turn would meet the line beyond its next point, faces that point at once and dashes straight at it. That straight dash is the member's **detour**: it's on it until it reaches the point (or it's taken off the route) and then carries on along its route. The turn-in point is an ordinary route point, which puts the member one point further behind the leader until it passes it.'''

[[topic.rule]]
id = "member-move-end"
tags = ["code"]
text = '''**At the end.** A member's move ends when it has no route left and is within 0.5 of its destination; if it isn't, it plans its own way there, as under [Arriving](#arriving). It can also stop short (well ahead of its place when the leader has stopped, below). When its move ends it faces the regiment's facing at once.'''

[[topic.rule]]
id = "regiment-arrival-facing"
tags = ["code"]
text = '''When the regiment arrives (within 0.5 of where it was sent), it faces along the route's last leg. If the move order carried a facing (the player drags one out as the order is given, [commands](commands.toml#targeted-commands)), the regiment turns to it at once instead, its places turning with it, and the order's facing is then forgotten. Then every member is sent to its place, each on a move of its own from where it stands, and faces the regiment's facing when it gets there.'''

[[topic.rule]]
id = "new-order-while-moving"
tags = ["code"]
text = '''**A new order while moving** takes effect for the whole regiment at its first look after the order: the route is planned and every member is handed its new route then, dropping the old one, wherever it is. The same fresh hand-out happens during a move when the regiment's formation changes, when the thing it's following moves far enough for it to plan again, and when a long route moves on to its next stage.'''

[[topic]]
title = "Keeping place"
under = "A regiment's speed"

[[topic.rule]]
id = "member-pace"
tags = ["code"]
text = '''
The leader drives the route at the regiment's speed R. Every other member heading for its place on its route (above) sets its own pace v each time it steers (when it takes up a leg, and on each look along the way, about once a second):
- Mostly v = R + d ÷ 2, where d is how far its place is ahead of it:
  - While it has as many route points left as the leader (it's on the same leg as the leader), d is the distance from the unit to its place, measured along the heading of the leg the unit is on: positive when its place is ahead of it (it has fallen behind), negative when it's ahead of its place. Its place here is the regiment's position plus its place in the formation, with the regiment facing along the leader's leg.
  - Within 6 of the corner at the end of its own leg (its distance to its own next route point, when that point isn't its last), its place's sideways offset from the leader (its left or right distance, as the regiment faces) is counted in as well, from none 6 away to all of it at the corner: a place on the outside of the turn counts as that much further ahead, one on the inside as that much nearer, so the outer file speeds up and the inner slows down round the turn. The turn's direction is from its own next leg's heading.
  - With a different number of route points left from the leader, d is how much further it has to go than the leader along the leader's route, measured from each of them; but if that disagrees in sign with how many route points it is behind the leader (negative when it's ahead), d is half that number of points instead.
'''

[[topic.rule]]
id = "detour-pace"
tags = ["code", "data"]
text = '''While it's on a detour (above), its pace instead rises evenly from R, when it has no more route left than the regiment, to `MoverCatchupSpeed` × its top speed when it has 4 or more further to go. It never drops below R on a detour.'''

[[topic.rule]]
id = "mover-catchup-speed-cap"
tags = ["code", "data"]
text = '''v is never above `MoverCatchupSpeed` (1.75 in AA) times the unit's own top speed.'''

[[topic.rule]]
id = "ahead-of-place-stops"
tags = ["code"]
text = '''If v comes out at 0.2 or less (it's well ahead of its place), it stops. If the leader is still moving it waits a second and looks again; if the leader has stopped, its move ends there.'''

[[topic.rule]]
id = "pace-stretches-steps"
tags = ["code"]
text = '''It drives at the regiment's speed R (accelerating to it as usual) with each step stretched by v ÷ R, so once up to speed it covers v a second. The terrain limit cuts R, before the stretch, so a member catching up in forest goes faster than the forest limit by the same proportion.'''

[[topic.rule]]
id = "behind-place-speed"
tags = ["code"]
text = '''So a member behind its place moves at the lower of R and its terrain limit, times v ÷ R, with v at most `MoverCatchupSpeed` × its own top speed. Where R is under the limit the terrain plays no part; where the limit is under R, the member's catching up is cut in the same proportion as the leader's own speed.'''

[[topic.rule]]
id = "leader-never-waits"
tags = ["code"]
text = '''The leader never slows down or waits for members behind their places: it drives at R, the regiment's speed (the slowest member's top speed, members away from the regiment included), however far behind any member is. The only waiting is a group's, below.'''

[[topic.rule]]
id = "unit-without-regiment-speed"
tags = ["code"]
text = '''A member no longer in a regiment drives at its own top speed.'''

[[topic.rule]]
id = "returning-member-speed"
tags = ["code"]
text = '''A unit making its way back to its regiment (returning after being cut off, not yet with it) while the regiment is moving drives at `MoverCatchupSpeed` × its own top speed instead of R, stretched as above when it's heading for its place. It keeps that speed until the regiment next hands it a speed.'''

[[topic]]
title = "Several regiments ordered together"
under = "A regiment's speed"

[[topic.rule]]
id = "separate-orders-per-regiment"
tags = ["code"]
text = '''Giving one order to a selection of several regiments that isn't a group with Group Behavior on (below) gives each regiment its own order. Nothing ties them: each moves at its own speed and arrives when it arrives, whether the order is a move, an attack, a guard or an attack-ground.'''

[[topic.rule]]
id = "spread-from-selection-centre"
tags = ["code", "data"]
text = '''A move or guard on a place sends each regiment to the clicked point plus its own offset from the selection's centre (the average of their positions), cut to at most `GroupZoneRangeMin` (18) long, so they keep roughly how they stood. An attack, attack-ground or bombard sends every regiment to the same thing or point. Which orders spread is the command's `apply_group_offset` (true by default; false for `kill`, `bombard` and `air_attack`).'''

[[topic.rule]]
id = "thing-orders-unspread"
tags = ["code"]
text = '''
Only an order on a place spreads. A move or guard on a thing (a right-click on a regiment, unit or building) gives every regiment the same order on that thing, with no offset, whatever `apply_group_offset` says. So regiments moved onto a thing they can't attack don't keep how they stood: each heads for the thing itself and stops as one alone would, within 0.6 × its own `control_range` of it ([combat](combat.toml#attack-efficiency), Resting), at the first point its own route comes that close. They end up spread round the side of the thing each came from, regiments with a smaller `control_range` closer in, and nothing keeps one from stopping where another stands.
- When the thing moves off, each follows it on its own, re-aiming and stopping by its own distance, just as one regiment does. Nothing keeps their places relative to each other.
- Each regiment decides for itself whether the order is a move or an attack: in a mixed selection, those with an ability that can attack the thing attack it and the rest move onto it.
'''

[[topic]]
title = "Groups"
under = "A regiment's speed"

[[topic.rule]]
id = "group-behavior"
tags = ["code", "data"]
text = '''With Group Behavior on, an order to the selection goes to it as one group, whose regiments are timed to arrive together.'''

[[topic.rule]]
id = "group-behavior-switch"
tags = ["code"]
text = '''Group Behavior is a switch on the selection's current group ([selection](selection.toml#control-groups)): a saved group selected exactly, or the player's one stand-in for any other selection of two or more. The stand-in starts off, and since it's one switch for all of them, turning it on for one unsaved selection leaves it on for every later one until it's turned off. A newly saved group takes the switch of the current group it was saved from.'''

[[topic.rule]]
id = "group-behavior-button"
tags = ["code", "data"]
text = '''The button is in command grid slot 4 (row 1, second column), hotkey V in AA (H in Kohan II): `group_behavior_enable` while the switch is off, `group_behavior_disable` while it's on, one at a time. It shows whenever two or more of the player's own things are selected, saved group or not. Pressing it only flips the switch; nothing is sent to the regiments until the next order.'''

[[topic.rule]]
id = "orders-to-group"
tags = ["code"]
text = '''An order counts as given to the group as one whenever two or more things are selected and the current group's switch is on, except `set_formation`, which always goes to each on its own. Each such order (not queued with Shift) makes a fresh group of what's selected, and each regiment leaves any group it was in for the new one; the fresh group starts with a facing as below ([group-facing](#group-facing)). An order queued with Shift goes to the group it already has, which takes it up when it's done with the orders before it (below).'''

[[topic.rule]]
id = "leaving-group"
tags = ["code", "data"]
text = '''A regiment leaves its group (a group left empty goes) when: it accepts an order given to it rather than to the group (Group Behavior off, or the regiment ordered alone), apart from `set_formation`; it starts routing or becomes exhausted; it joins another group; it changes side; or it's removed. Orders the group itself hands its regiments don't take them out.'''

[[topic.rule]]
id = "left-group-untimed"
tags = ["code"]
text = '''Then it no longer times its arrival with the rest.'''

[[topic.rule]]
id = "group-orders-and-timing"
tags = ["code", "data"]
text = '''The group's orders and timing:'''

[[topic.rule]]
id = "group-thing-orders"
tags = ["code"]
text = '''An order on a thing reaches each of its regiments as the same order on that thing, as it does without Group Behavior (above): a move onto a thing they can't attack still has each regiment stop within its own distance of the thing and follow it when it moves. What the group adds is the timing below, so they arrive together rather than each when it gets there, and each again when they follow, and that each heads for its place round the thing rather than the thing itself ([group-place-aim](#group-place-aim)).'''

[[topic.rule]]
id = "arrival-timing"
tags = ["code"]
text = '''Once a second, for each of its regiments that is moving and takes part (below), it works out the route the regiment has left and the time that takes at the regiment's own speed. Each regiment is then given the speed that makes its time equal the longest: its own speed × its time ÷ the longest time. The regiment furthest out in time goes at its own speed and the others slow down to match; none is ever sped up.'''

[[topic.rule]]
id = "timed-speed-bounds"
tags = ["code"]
text = '''That speed is the regiment's speed R from then on, as an order's speed is ([A regiment's speed](#a-regiments-speed)): it goes no higher than the slowest member's top speed, is handed to every member, and the members keep place against it. Worked out again each second.'''

[[topic.rule]]
id = "group-places"
tags = ["code", "data"]
text = '''
Each regiment has a place in the group, an offset from the group's centre in the group's own frame (sideways, and ahead along the way the group faces):
- When all its regiments are in the same formation, regiment by regiment in group order they take the positions of that formation's `group_formation_ids` (`Game/group_formations.tgi`: AA's `group_aggressive` sets (0, 6), (±13.5, 6), (0, −6), (±13.5, −6)). Regiments beyond the last position (a group larger than the formation) are placed as in the next item.
- Otherwise each keeps where it stands from the group's centre, turned into the group's frame; one not taking part (below) is put at `GroupZoneRangeMin` from the centre in its own direction.
- The places are then recentred so their average is the centre.
- They're worked out when the group is given an order (not when it gives the same order again, [group-resends-order](#group-resends-order)), when it finds itself in a fight, and when its regiments come to share a formation.
'''

[[topic.rule]]
id = "group-facing"
tags = ["code"]
text = '''
The way the group faces is a direction on the map, f; a place (x, y) in the group's frame lies x × (f.y, −f.x) + y × f from the centre on the map, so y is ahead and x sideways.
- A move or guard on a place or a thing sets f when the group takes it up: the order's own facing if it carried one, else the direction from the group's centre to the order's point (the thing's position for an order on a thing). The centre here is the average of its regiments' positions, or, for a group that had finished its last order, the point it was put at then (below), so a queued move faces from the previous order's point to its own.
- Every other order (an attack, a bombard) leaves f as it was, and the places are worked out with it.
- A fresh group takes f from the group last made for the same selection group ([selection](selection.toml#control-groups): the saved group, or the player's one stand-in for unsaved selections), if that group is still there; a group is gone once it has no regiments. Otherwise it starts at (0, −1). The regiments' own facings and earlier groups play no part.
'''

[[topic.rule]]
id = "group-place-aim"
tags = ["code"]
text = '''
While the group is carrying out an order (not while it's in a fight, below), a regiment heads for its place rather than the order's own point: the order's point (or the thing's position, as it moves) plus its place laid onto the map as the group faces. A place that would fall outside the circle of the group's zone radius round that point is pulled in along the line to the point, to the first tile centre inside. It does so:
- for any order on a place other than a bombard: a move, a guard;
- for a move onto a thing it can't attack;
- for an attack, a guard or a bombard on a thing, and a bombard on a place, only while the regiment stands outside that circle; inside it, it heads for the target itself.
The group looks at this when it hands out the order and again at each of its once-a-second timing passes; a regiment whose aim changes is sent on afresh, and isn't timed that pass.
'''

[[topic.rule]]
id = "group-order-done"
tags = ["code"]
text = '''A group's order is done when, at a timing pass, every one of its regiments is at rest or reforming. The group is then put at the order's point (its centre if the order was on a thing that is gone) and, unless the order was a stop or more orders are queued for it, every regiment is sent on a move to its place round that point. Then the group takes up its next queued order, if any, at its next look (once a second). A group whose order is on a thing that's gone, or whose order none of its regiments taking part can carry out, drops it the same way, at its centre.'''

[[topic.rule]]
id = "group-supply-zone-buffer"
tags = ["code", "data"]
text = '''When the group's order is on an enemy thing that has a guard zone ([morale](morale.toml#rout-destination); an HQ or an airfield, say), each regiment times its arrival not at the end of its route but that far short of it: the zone's radius plus `GroupSupplyZoneBuffer` (5) plus how far ahead its place in the group is (a place behind the centre counts negative), taken off its route's length, never below 0. So the group arrives together at the edge of the zone, front places first. On anything else, such as a city or an ordinary regiment, they time it to the end of their routes.'''

[[topic.rule]]
id = "group-speed-minimum"
tags = ["code", "data"]
text = '''A regiment handed a speed below `GroupSpeedMinimum` (1.0 in AA) doesn't crawl: its members stop, and the regiment looks again each second without that counting as a try at the move. So a regiment nearly there waits for the rest.'''

[[topic.rule]]
id = "who-takes-part"
tags = ["code", "data"]
text = '''
Which regiments take part:
- The group's zone is a circle round its centre (the average of its regiments' positions) whose radius is the largest control zone radius among its regiments (`control_range`), never less than `GroupZoneRangeMin` (18 in AA).
- Each time the group gives a move, and each time it finds itself in a fight (below), it marks the regiments then inside its zone as taking part and the rest as not. A regiment joining the group starts out taking part. Until the next marking, a regiment left outside goes at its own speed and doesn't hold the others back.
- Whether the group is in a fight is decided by the first member taking part, in the group's order, that is engaged or under siege; the rest aren't looked at. It's in a fight if that member is:
  - engaged ([combat](combat.toml#engaged-and-under-siege)) with something other than what it was sent to attack. It counts unless it has an attack target and is engaging that target, or the regiment that target belongs to. Its attack target is the target of its attack order (in Kohan II, while besieging a settlement, the first wall in its way, else the besieged target: [combat](combat.toml#city-siege)); failing that, while engaged, the first attack order in its queue whose target it can attack. So a group whose regiments are fighting what they were sent to attack goes on timing their arrival, while one drawn into fights on the way stops. A member fighting its own target ahead of one drawn into another fight keeps the group out of a fight;
  - or under siege. Only a lone unit in the group can be: a regiment as a whole never is.
- The group looks for a fight once a second, at each timing pass and also while it has no order. When it finds one it marks again and goes into the fight, which it handles on the next tick and then once a second ([group-resends-order](#group-resends-order)); while in it, it times nothing and doesn't look for a fight again. The fight ends only as that rule says, whatever the regiments are fighting, and the group then goes back to its order and its timing.
- A computer player gives every order that names two or more of its regiments as a group ([computer players](computer-players.toml#orders-as-person)), and in a mode where the group times every moving regiment, marked or not.
'''

[[topic]]
title = "Corners"

[[topic.rule]]
id = "corner-lead"
tags = ["code"]
text = '''Before each corner the unit starts its turn early by the lead distance: `turn_radius` times the tangent of half the angle between the route's next two legs. The lead is 0 when only one point is left, and on a leg the unit is driving straight for a spot of its own (a destination close by, the dash of a detour). Where the next point lies on the one after it (closer than 0.0002), the angle is taken with the leg after that, or the lead is 0 if those two are all that's left.'''

[[topic.rule]]
id = "next-leg-at-lead"
tags = ["code"]
text = '''It drives the leg until it is level with the point lead short of the corner, then takes up the next leg at once: the heading becomes the next leg's and the aim point the next point, less that point's own lead. Nothing else changes: it keeps its speed and turns at its rate as it goes. At its top speed that draws an arc of radius `turn_radius` touching both legs.'''

[[topic]]
title = "Second thoughts"

[[topic.rule]]
id = "look-interval"
tags = ["code"]
text = '''While it drives, a unit looks at its move again every 1.0 to 1.3 seconds (uniform), and every 0.3 to 0.6 seconds on a leg it is driving straight for a spot of its own: a destination close by ([A destination close by](#a-destination-close-by)) or the dash of a detour (above). A leg it was snapped onto keeps 1.0 to 1.3 seconds. Between looks it just carries on as under Driving a leg.'''

[[topic.rule]]
id = "last-leg-snap"
tags = ["code"]
text = '''**Snapping onto the last leg.** Picture two circles of radius `turn_radius` touching the unit, one centred `turn_radius` to its left and one to its right: the tightest turns it can make. When only the last point is left and that point lies inside either circle, the unit can't turn onto it, so it gives up turning for that leg: it faces the leg's heading at once and drives. This is tested when the leg is set and at each look.'''

[[topic.rule]]
id = "getting-back-on-line"
tags = ["code"]
text = '''**Getting back on line.** At a look, a unit that has finished turning (faces the leg's heading exactly) and is 1 or more to the side of the leg's line (the line through the leg's point along its heading) puts a detour in ahead of the point: it turns toward the line by 45 degrees, drives to meet it, and turns back along it, all at its usual turn rate. When the offset is small enough that 45 degrees would overshoot, a shallower angle is used.'''

[[topic.rule]]
id = "detour-past-point"
tags = ["code"]
text = '''If that detour would meet the line beyond the leg's point, the unit instead faces the point at once and drives straight at it.'''

[[topic.rule]]
id = "no-detour-when-blocked"
tags = ["code"]
text = '''No detour is made if something is in its way.'''

[[topic]]
title = "A destination close by"
intro = '''These apply when a unit is given a destination of its own, not when it's handed a regiment's route (a regiment's leader gets the route, see [Arriving](#arriving)).'''

[[topic.rule]]
id = "close-exact-destination"
tags = ["code"]
text = '''On a move that needs exact arrival (see [Arriving](#arriving)), a destination less than 3 away gets a single straight leg from where the unit stands, with no route planned. The unit turns onto it at its turn rate unless the snap above applies, which it does at once for a spot inside a turning circle. That's only while the move hasn't planned a route: a move that has, and plans again with its destination under 3 away, plans a route.'''

[[topic.rule]]
id = "destination-inside-turning-circle"
tags = ["code"]
text = '''Otherwise, if the destination is ahead of the unit (not behind its facing; one exactly abeam counts as ahead) and strictly inside the turning circle on the destination's side, the unit faces it at once and drives straight there. That holds for any move, exact or not, but again only while the move hasn't planned a route.'''

[[topic.rule]]
id = "close-destination-otherwise-planned"
tags = ["code"]
text = '''Otherwise a route is planned.'''

[[topic.rule]]
id = "beside-and-behind-spots"
tags = ["code", "guess"]
text = '''So a spot close beside a unit makes it jump to face the spot. A spot straight behind, on an exact move, is outside both circles: the unit starts a U-turn, driving away as it turns; partway round the spot falls inside a turning circle and the unit snaps onto the leg's heading, usually ending up level with the spot but off to one side. It has then missed, and tries again as below.'''

[[topic]]
title = "Arriving"

[[topic.rule]]
id = "arrival-check"
tags = ["code"]
text = '''When a unit has no route left it stops dead and checks where it is. It has arrived if it is within 0.5 of its destination, or within 0.1 on a move that needs exact arrival (below), or any move whose destination is already within 0.5 of the unit when the move starts. It is not moved onto the spot.'''

[[topic.rule]]
id = "exact-arrival-moves"
tags = ["code"]
text = '''
These are the moves a unit makes on its own that need exact arrival:
- going to another thing: a man's approach to the target of his attack (until he's in range, [combat](combat.toml#attack-orders)), a man walking to the thing he repairs, a member that has fallen out of its regiment heading back to it, and a unit in no regiment ordered to move onto a thing it doesn't attack;
- going to a spot of its own: a truck to the spot it unpacks on ([Unpacking after a move](#unpacking-after-a-move)), and a unit just recruited walking out to its place by the building, or to the free spot it's moved to when that place is taken.
A regiment's move never does, whether to a spot or onto a thing: the regiment arrives within 0.5, and its members, following its route or keeping their places, within 0.5 as well.
'''

[[topic.rule]]
id = "arrival-by-outline"
tags = ["code"]
text = '''Going to another thing that blocks tiles (`blocking`, such as a building), a unit has also arrived once its outline comes within 0.1 of that thing's outline; for anything else only its position counts.'''

[[topic.rule]]
id = "stopping-in-range"
tags = ["code", "data"]
text = '''
A man going to a thing to use an ability on it (the approach of his attack, the walk to a building he builds or repairs) stops as soon as he's within that ability's reach, wherever he is on his route:
- His route is planned to the thing's own position, as for any move to a thing: the destination is made standable and a close one gets a straight leg, as above, and the arrival tests above still apply when his route runs out.
- At every step of his drive, his soft shape's gap to the thing's soft shape ([objects](objects.toml#gap-between-two-shapes)) is tested against the ability's `range` less 0.0001 (or the distance he covers in that step, if that's more). Once it's within, the move ends there, mid-route or not, and he decides again what to do ([combat](combat.toml#rating-outcomes)), which is now to use the ability.
- As each leg of his route ends, his centre's distance to the thing's centre is tested against the same reach as well.
- It's the soft shapes that stop him, even for a thing whose template gives it a `target_shape` of its own (AA's battleships and carriers), though range itself is measured between target shapes ([combat](combat.toml#range-edge-to-edge)). For everything else in AA the two are the same.

So an engineer (soft circle 0.5) walking to a bunker site (soft circle 2.1) with his range of 1 stops on the step that brings his centre within 3.6 of the site's, short of where his route ends, which lies nearer the site.
'''

[[topic.rule]]
id = "out-of-range-after-move"
tags = ["code", "guess"]
text = '''If his move ends without bringing him within reach (it arrived, failed, or ran out of plans), he doesn't walk straight at the thing. He sets off again from where he stands when he's next given the work: for builders and repairers, the regiment hands it out again each time it looks at the building ([construction](construction.toml#closing-in)). That each such hand-out restarts his walk afresh, with its plan count reset, is a guess.'''

[[topic.rule]]
id = "replan-if-not-arrived"
tags = ["code"]
text = '''If it hasn't arrived it plans again from where it stands and drives again.'''

[[topic.rule]]
id = "plan-limit"
tags = ["code"]
text = '''A move is planned at most 3 times; when a fourth would be needed the move is given up. The count starts again each time the unit finishes a stage of a long route, and when an actor it follows moves.'''

[[topic.rule]]
id = "stopping-facing"
tags = ["code"]
text = '''The unit does not turn to an ordered facing when it stops. A unit in a regiment faces the way its regiment faces, at once, when its move ends; one on its own stays facing the way it arrived. Which way the regiment faces: [Members' routes](#members-routes).'''

[[topic.rule]]
id = "regiment-leader"
tags = ["code", "data"]
text = '''
A regiment's leader is one of its members:
- The member in its layout's `PrimarySlot` (the captain, in AA's infantry and mechanized layouts) is the leader whenever that slot is filled, including when a replacement fills it again.
- Otherwise the first member to join an empty-handed regiment becomes leader, so a layout with no `PrimarySlot` (AA's `herd_ambient`) has one too.
- When the leader leaves the regiment (it dies, say), the next leader is taken at once from the members left: the first, in the order of the layout's positions, that is with the regiment (inside its control zone, not straggling); failing that, the first member at all. The positions run in the order the layout lists its `Slot`s, each `Slot` giving `number` of them in turn.
- So a regiment is without a leader only when it has no members, which ends it. A map or saved game stores which member leads.
'''

[[topic.rule]]
id = "regiment-position"
tags = ["code"]
text = '''A regiment's own position follows its leader's. While the regiment moves, about once a second its position is aimed at where the leader is then, and it slides there in a straight line at `MoverCatchupSpeed` × the regiment's speed R per second, but never slower than `BannerMinCatchupSpeed` (1.75 × R and 0.5 in the stock SVars). So on the march it trails the leader. A regiment sent somewhere plans a route and hands it to its leader, who drives it as above, counting as arrived within 0.5 of the route's last point.'''

[[topic.rule]]
id = "regiment-arrival"
tags = ["code"]
text = '''The regiment has arrived when its position is within 0.5 of where it was sent. If its leader has stopped and it hasn't arrived, it sends the leader again. Each plan or re-send counts as a try, except that on a move to another actor only re-sends count; from the third try on, the regiment gives up the move if `CAIMoveMinSecondsBeforeFail` (stock 5) seconds have passed since the order.'''

[[topic]]
title = "Moves that can't be made"
intro = '''What happens when a route is planned to somewhere the unit can't get to.'''

[[topic.rule]]
id = "unreachable-destinations"
tags = ["code"]
text = '''A regiment plans from its leader's position, by what its leader can cross; a unit planning its own way (a lone unit, or a member on a move of its own, such as to its place) plans the same way. A member handed a copy of its regiment's route plans nothing ([Members' routes](#members-routes)), and a destination close by may get a straight leg with no plan ([A destination close by](#a-destination-close-by)).'''

[[topic]]
title = "Where the move is aimed"
under = "Moves that can't be made"

[[topic.rule]]
id = "destination-made-standable"
tags = ["code"]
text = '''Before planning, the destination is made a spot the unit could stand on: on the map, on a tile open to it (for a land unit, not water and not ground closed to everything), and not on a tile a thing blocks ([objects](objects.toml#blocked-tiles)). A destination that isn't one is pulled back along the straight line towards the unit, a tile (2) at a time, until it is. At each spot on the way that falls on a thing, the spot one tile out from that thing along its facing axis, on the unit's side, is tried as well.'''

[[topic.rule]]
id = "destination-pulled-back"
tags = ["code"]
text = '''So an order into a lake, onto ground closed to the unit, or onto a building heads for the first spot short of it on the line from the unit: the near shore, the edge of that ground, the building's near side. Only the route is aimed there: arriving is still judged against the spot the unit was sent to. So once there it hasn't arrived, plans again (reaching the same spot) and gives up as under [Arriving](#arriving): a lone unit after its third plan, a regiment from its third try once `CAIMoveMinSecondsBeforeFail` (5 s) has passed since the order. It then comes to rest where it stopped as a failed move does (below).'''

[[topic.rule]]
id = "no-spot-found"
tags = ["code"]
text = '''If that pulling back reaches the unit before it finds a spot, or the spot it finds is where the unit already stands, there's no route and the move fails (below).'''

[[topic]]
title = "Areas"
under = "Moves that can't be made"

[[topic.rule]]
id = "map-areas"
tags = ["code"]
text = '''The map is divided into areas, each a block of tiles of one kind: tiles land things may stand on, water, or ground closed to everything. Areas of the same kind join where they share a tile edge; areas of different kinds never join. Things on the map, buildings included, play no part. The areas are worked out when a map is prepared and kept with it.'''

[[topic.rule]]
id = "how-areas-are-drawn"
tags = ["code", "data"]
text = '''
How the areas are drawn, all in tiles (SVars):
- The map is covered with rectangles, each of one kind of tile. Squares are tried from `StaticMapStartingSquareSize` (10) a side downwards, each next size three quarters of the last, rounded down (`StaticMapFastSquareReductionMult` 3 over `StaticMapFastSquareReductionDiv` 4: 10, 7, 5, 3, 2, 1), going down each column of the map from the left. Wherever a square of that size lies wholly on uncovered tiles of one kind, it's grown a column to the right and a row downwards at a time, each way until the next column or row would take in a tile of another kind, one already covered, or go off the map.
- Each grown rectangle is cut into equal pieces, as near as whole tiles allow, none more than W along a side: W = `StaticMapMaxRectangleWidth` (12) × (map width ÷ `StaticMapBaseMapWidth` (64)) to the power `StaticMapMaxRectangleWidthExp` (0.3333), rounded, the map width being the mean of its width and height. So W is 12 on a 64-tile map, 15 on 128 and 19 on 256.
- A piece of at least `StaticMapMinRegionSize` (9) tiles and at least `StaticMapMinRegionWidth` (3) along each side is an area of its own. A smaller one joins the neighbouring area of its kind it shares the most edge with (on a tie, the smaller area), passing over areas of more than `StaticMapMaxRegionSizeForExpansion` (1000) tiles; with none to join, it's an area of its own.
- An area's centre is the middle of its tiles.
'''

[[topic.rule]]
id = "open-land-areas"
tags = ["code", "data"]
text = '''So open land is cut into squares of about W tiles a side, and only a coast, a mountain edge or the map's own edge makes them smaller or out of line.'''

[[topic.rule]]
id = "no-area-chain"
tags = ["code"]
text = '''If no chain of joined areas of the kind the unit stands in leads from its area to its (moved) destination's, there's no route and the move fails. The one exception: a destination joined to the unit by a straight line that crosses no tile closed to it is never failed this way.'''

[[topic.rule]]
id = "unreachable-land"
tags = ["code"]
text = '''So for a land regiment the move fails when its destination is land it can't reach overland: another island, or ground cut off by water or ground closed to everything. A destination in the water between doesn't fail: it's pulled back to the near shore first (above).'''

[[topic.rule]]
id = "area-chain-limit"
tags = ["code"]
text = '''A chain longer than 254 areas is cut short at the area reached that is nearest the destination, and the move heads there instead (below). If that nearest area is the unit's own, there is no route and the move fails at once. On open land a chain crosses one area every W tiles or so, so even corner to corner of a 256-tile map it's under 30 areas: the cut needs a chain winding through hundreds of small areas, which no stock map has.'''

[[topic.rule]]
id = "area-stages"
tags = ["code"]
text = '''A move with a chain of areas goes in stages. Each stage heads for the centre of the first area along the chain, after the unit's own, that a straight line from the unit can't reach without crossing a tile closed to it, passing over areas whose centre has a thing on it; with no such area, it heads for the destination (for a cut chain, the end of the cut chain is no stopping point then). The centre is first made a spot the unit could stand on, as the destination is ([Where the move is aimed](#where-the-move-is-aimed)); if none is found there's no route and the move fails. The stage is done once the unit stands in that area or in any area bordering it (sharing a tile edge with it, whatever its kind), and it plans the next one from there. So a unit usually starts its next stage a step short of the area it was heading for.'''

[[topic.rule]]
id = "region-path-planner-switch"
tags = ["code", "data"]
text = '''The area step is switched by `TAIUseRegionPathPlanner` (SVars, stock `true`); things flagged `ethereal` skip it (for a regiment, as its leader is flagged). Without it, a move fails at once only for the destination's spot (above) or a tile route cut short at the unit's own tile (below).'''

[[topic]]
title = "Closed in by things"
under = "Moves that can't be made"

[[topic.rule]]
id = "blocked-tiles-not-areas"
tags = ["code"]
text = '''Things that block tiles (buildings, mostly) don't split areas, so a destination closed in by them, or a unit closed in, still has a route at the area level. The route over tiles then finds no way through, and heads for the tile it could reach that is nearest the destination instead. Nearness here is from the tile's centre to the destination: the shorter of the two distances along the map's axes times 1.414, plus the difference between the two.'''

[[topic.rule]]
id = "tile-route-limit"
tags = ["code"]
text = '''A route over tiles is at most 254 tile steps long, a diagonal step counting as one: once the search reaches tiles 255 steps from the start it stops and settles the same way, for the nearest tile reached so far. If that is still the tile the unit stands on, there is no route and the move fails at once. On open ground that cuts only a route longer than 254 tiles (508 units) along its longer axis; one that winds round obstacles reaches it sooner. The unit then plans the rest from where the cut route ends, and each such plan counts as a plan or try under [Arriving](#arriving).'''

[[topic.rule]]
id = "closed-in-gives-up"
tags = ["code"]
text = '''Either way it ends up short, so it gives up there as a pulled-back destination does (above). Where the nearest tile is the one it stands on, it doesn't move at all before giving up.'''

[[topic.rule]]
id = "immediate-failure-cases"
tags = ["code"]
text = '''So a move to somewhere it can't reach fails at once only for the cases under [Where the move is aimed](#where-the-move-is-aimed) and [Areas](#areas), and a tile route cut short where it stands (above); anything else sets off, ending entrenchment, and is given up later.'''

[[topic]]
title = "When a move fails"
under = "Moves that can't be made"

[[topic.rule]]
id = "regiment-move-failure"
tags = ["code"]
text = '''
A regiment plans at its first look after the order, before any member moves, and again whenever it has no route left short of its destination (a long route's next stage, a target that moved). When that plan fails:
- nothing is handed to the leader, so no member sets off, and the regiment doesn't start out: its position, facing, formation and entrenchment stay as they were ([stances](stances.toml#what-ends-it));
- a move order, or an attack order whose way to the target fails, is dropped. The order it replaced was already dropped when it was given, so the regiment doesn't go back to it: it rests where it is, showing Resting, and its next queued order (Shift), if any, starts;
- if the order carried a facing, the regiment turns to it at once as it comes to rest, its places with it, as it would on arriving;
- its members are then sent to their places round where it stands, as at any rest; members already in place stay put;
- a guard order keeps its post: the regiment guards from where it stands without trying again, and tries for the post again only when it returns to it after a fight ([combat](combat.toml#guard-orders));
- an unpack order shows its "Cannot unpack" line ([Unpacking after a move](#unpacking-after-a-move)).
'''

[[topic.rule]]
id = "failure-unannounced"
tags = ["code"]
text = '''Nothing else tells the player: no line, no sound, no buzzer. The order's reply (`WhenCommanded`, [sounds](sounds.toml#unit-replies)) has already played when the order was given, since the route is only planned afterwards.'''

[[topic.rule]]
id = "no-failure-cursor"
tags = ["code", "data"]
text = '''The cursor doesn't show it either. An armed command shows its command's `cursor_ids` cursor wherever it points. The one exception is Bombard: it shows its `cursor_invalid_ids` cursor (`bombard_invalid`, "Bombard Out of Range") over a spot none of the selection can bombard. No other command sets `cursor_invalid_ids`, and no cursor tests whether a spot can be reached.'''

[[topic.rule]]
id = "unit-move-failure"
tags = ["code"]
text = '''A unit planning its own way fails the same way: its move is dropped and it stops where it is, keeping its facing (it doesn't turn to its regiment's facing, as it would on arriving). A lone unit then stands idle; a member's regiment, at rest, sends members not yet in their places once more, and leaves them where they are after that. A lone truck with an unpack order shows "Cannot unpack".'''

[[topic.rule]]
id = "failure-in-selection"
tags = ["code"]
text = '''Several regiments ordered together each plan their own route, with or without Group Behavior: those that can't get there fail as above and the rest carry on. A failed regiment stays in its group, but it isn't moving, so the group leaves it out of its timing ([Groups](#groups)) and doesn't wait for it.'''

[[topic.rule]]
id = "group-resends-order"
tags = ["code"]
text = '''
A group sends its order to all its regiments again, the failed one included, at two moments, and the failed one then plans afresh (failing again if nothing has changed):
- when a fight the group was in ends. While it's in a fight, once a second, it goes through its regiments in group order, passing over those not taking part and those engaged or under siege themselves. Each of the rest is given a guard order on a regiment of the group that is engaged or under siege (the last such in group order, not the nearest, and taking part or not), or a stop order if it won't take that guard ([combat](combat.toml#guard-orders)). If no regiment of the group is engaged or under siege, the fight is over: every regiment taking part that isn't is told to stop. Here a regiment fighting what it was sent to attack counts as engaged, unlike in the test that starts a fight ([who-takes-part](#who-takes-part)). So in a group A then B with only A engaged, B guards A; the fight goes on until neither is engaged. When it's over, the group gives its own order to all of them again and goes back to timing ([Groups](#groups)); with no order, it is put at its centre and its regiments sent to their places round it ([group-order-done](#group-order-done)). So a failed regiment taking part joins in its group's fights like the others, then gets the group's order again;
- during a move or guard order, when its regiments come to share a formation they didn't share before (say all of them are switched to the same new one), since that changes their places in the group. With any other order, or none, the regiments are instead sent on moves to their new places round the group's centre; in a fight, nothing is sent. It sends nothing again at any other time.
- The order it gives again is the one it's carrying out: its last order not queued with Shift, or the queued one it has since taken up. It's the same order on the same point or thing, each regiment again heading for its place round it ([group-place-aim](#group-place-aim)); the places are kept, turned to the facing worked out afresh. If the order was a move or guard on a thing that's gone, the group drops it instead ([group-order-done](#group-order-done)). Any other order on a thing, an attack on one now dead included, is given again as it was, and each regiment takes it as it would alone ([combat](combat.toml#attack-orders)).
'''

[[topic]]
title = "Unpacking after a move"

[[topic.rule]]
id = "unpack-order-move"
tags = ["code"]
text = '''An unpack order to a regiment sends the regiment to the ordered spot first, as any move, with no facing asked of it.'''

[[topic.rule]]
id = "unpack-on-arrival"
tags = ["code"]
text = '''Once the regiment has arrived (within 0.5, above), the member in its layout's `PrimarySlot` (the truck, which leads whenever that slot is filled) unpacks where it stands: the building goes at the truck's own position less its `packed_position_offset` (0, 0 on every stock truck), not the ordered spot, facing as the order says (see [buildings](buildings.toml#packing-and-unpacking)). With that slot empty, nothing unpacks and the message comes at once (below).'''

[[topic.rule]]
id = "unpack-room-only"
tags = ["code"]
text = '''Nothing about the truck's facing, or its trailer, is tested. The only test is room for the building.'''

[[topic.rule]]
id = "cannot-unpack"
tags = ["code"]
text = '''At each of its looks while the truck is neither unpacking nor unpacked, the regiment tells it to unpack, up to twice; at the look after the second, the player is told "Cannot unpack" with the truck's name (string `tai_error_unpack`) and the order is dropped. So a building with no room is asked for twice. The message comes at once instead, with no try, when the member in the truck's place can't take an unpack order at that look: the truck was lost on the way, so the regiment is led by a unit that isn't a truck, or the truck can't be ordered at all just then.'''

[[topic.rule]]
id = "unpack-move-given-up"
tags = ["code"]
text = '''If the regiment gives up the move (above), the same message is shown, nothing unpacks, and the truck stays where it stopped. A truck that keeps missing a spot too close to turn onto ends this way.'''

[[topic.rule]]
id = "lone-truck-unpacks"
tags = ["code"]
text = '''A truck in no regiment drives to the ordered spot itself, needing exact arrival (above), unless it's already within 0.1 of it. Once there it unpacks where it stands, once: with no room, the same message at once and no second try. If it can't get there, the same message and it stays a truck.'''

[[topic]]
title = "Explore orders"
intro = '''Explore (command `explore`) sends a regiment off on its own to uncover the map around a place the player picks, and keeps it at that until it's given another order.'''

[[topic]]
title = "Who can explore"
under = "Explore orders"

[[topic.rule]]
id = "explorers"
tags = ["code", "data"]
text = '''Every unit that can move and belongs to a regiment can explore, and a regiment can when any of its units can. Nothing else counts: not `recon`, `trailblazing` or any other property, nor the kind of unit, so plain infantry, tank and other ground regiments get the button at slot 7 as the recon regiments do. A thing outside a regiment, and a unit that can't move, never has it.'''

[[topic.rule]]
id = "explore-without-fog"
tags = ["code", "game"]
text = '''With the fog setting None ([fog](fog.toml#the-match-setting)), nobody has it. So a match with fog of war off shows no Explore even for a plain infantry regiment, whose slot 7 stays empty (`berlin-infantry-regiment-commands`, from a session with fog off), while a recon regiment in a fogged match has it (`berlin-recon-regiment-hq-unpacking`). A plain regiment in a fogged match hasn't been seen yet.'''

[[topic.rule]]
id = "explore-lost-when-routing"
tags = ["code"]
text = '''It's lost with the regiment's other orders while it routs, is Exhausted or is at 0 morale ([morale](morale.toml#the-players-orders)). Fighting doesn't take it away.'''

[[topic.rule]]
id = "explore-with-several-selected"
tags = ["code"]
text = '''With several selected, the button shows when any of them can explore (the usual rule, [commands](commands.toml#command-grid)), and each selected regiment that can explore takes the order.'''

[[topic]]
title = "Giving it"
under = "Explore orders"

[[topic.rule]]
id = "explore-takes-place"
tags = ["code"]
text = '''It takes a place, never a thing: a click on a thing is a click on the ground under it ([commands](commands.toml#targeted-commands)). Any place on the map is taken, unexplored ground and water included.'''

[[topic.rule]]
id = "no-right-click-explore"
tags = ["code", "data"]
text = '''A right click never explores: neither of its `can_hot_command_*` switches is set, so the only ways to give it are the button and its hotkey.'''

[[topic.rule]]
id = "explore-point"
tags = ["code"]
text = '''The clicked point becomes the regiment's explore point, which stays fixed for the whole order (pulled in to at least 1 from the map's low edges, and onto the map if it's ever off it).'''

[[topic.rule]]
id = "explore-points-spread"
tags = ["code", "data"]
text = '''Several regiments given it together without Group Behavior each get their own order, the explore point spread by their offsets from the selection's centre as for a Move ([Several regiments ordered together](#several-regiments-ordered-together)); each then explores on its own.'''

[[topic.rule]]
id = "group-explore"
tags = ["code"]
text = '''With Group Behavior on ([Groups](#groups)), the group's leading regiment chooses where to go and every other regiment of the group heads for the same spot as soon as the leader picks it, with the group's arrival timing. When the leader has nowhere to go, they stand.'''

[[topic.rule]]
id = "explore-restart"
tags = ["code"]
text = '''Given to a regiment already exploring, it starts over from the new point.'''

[[topic.rule]]
id = "queued-explore"
tags = ["code"]
text = '''A Shift- or Ctrl-click queues it like any targeted order ([commands](commands.toml#queued-orders)). But exploring never finishes by itself (below), so an order queued behind Explore is never reached; only a fresh order, or the regiment routing, ends it.'''

[[topic]]
title = "Where it goes"
under = "Explore orders"

[[topic.rule]]
id = "explore-first-destination"
tags = ["code"]
text = '''It first heads for the clicked point, as a move would, or rather for the nearest spot within 2 of it where a member could stand. If there is none (water, a building), it skips that and chooses a destination at once.'''

[[topic.rule]]
id = "explore-new-destination"
tags = ["code", "data"]
text = '''Whenever it isn't moving, and whenever it comes within `ExploreInertiaCloseEnough` (3) of its destination, it chooses a new one. Until then it keeps going, whatever else comes into view. A move that fails ([When a move fails](#when-a-move-fails)) leaves it not moving, so it chooses again.'''

[[topic.rule]]
id = "explore-candidates"
tags = ["code", "data", "guess"]
text = '''
Choosing: it makes two sets of candidate places, and takes the best. The destination it's just had isn't one of them.
- `ExploreNumActorLocations` (20) around the regiment: each in a random direction, at a random distance from `ExploreActorRadiusMin` (20) to `ExploreActorRadiusMax` (30).
- `ExploreNumWaypointLocations` (20) around the explore point: each in a random direction, the game looks along that direction from the explore point for ground its side has never seen, on the same stretch of land as the regiment, and takes a spot up to `ExploreWaypointTilesIntoFog` (8) tiles further into that unseen ground. A direction that only reaches the map's edge gives nothing.
- Off the map, or where no member could stand within 2, a candidate is dropped; one kept is moved to the spot within 2 where a member could stand.
'''

[[topic.rule]]
id = "explore-best-candidate"
tags = ["code", "data"]
text = '''
Best: the less the side knows of a place, the better, before anything else: never seen beats seen before but not in view now, which beats in view now. This is judged for the regiment's side alone. Among places known equally well, the higher value wins:
- `ExploreActorBaseValue` (40) for one around the regiment, `ExploreWaypointBaseValue` (0) for one around the explore point;
- plus `ExploreDistanceMultiplier` (−1) × its distance from the explore point, so it keeps to the area the player picked;
- plus `ExploreDotProductMultiplier` (20) × how nearly it lies the same way from the regiment as its last destination did (the cosine of the angle between the two, from −1 to 1), so it tends to keep heading the same way;
- plus `ExploreFinishAreaBonus` (20) for a never-seen place whose region ([computer players](computer-players.toml#regions), the same regions for every side) has every neighbouring region on its island ([region-neighbours](computer-players.toml#region-neighbours)) wholly explored by the side: every tile of each seen by the side at least once. The place's own region isn't looked at, neighbours on another island are left out, and a region with no neighbours on its island always gets it. It finishes off a pocket of unseen ground;
- plus a random amount from 0 to `ExploreFuzzyFactor` (20).
'''

[[topic.rule]]
id = "explore-works-outwards"
tags = ["code"]
text = '''So it works outwards from the clicked point into unexplored ground, nearest first; with nothing unseen left within reach it still wanders, among places around itself and the explore point it has seen.'''

[[topic.rule]]
id = "explore-no-candidates"
tags = ["code"]
text = '''If every candidate is dropped, it stands where it is, still exploring, and keeps trying.'''

[[topic.rule]]
id = "explore-formation-and-speed"
tags = ["code", "data"]
text = '''On the way it moves as for a move order, in the player's chosen formation (`formation_required = DESIRED`), and at full speed.'''

[[topic.rule]]
id = "explore-routes-ignore-fog"
tags = ["code"]
text = '''Fog plays no part in its routes: the `PathingExplore*Fog` values in `SVars.tgi` are never read by AA.'''

[[topic]]
title = "On the way"
under = "Explore orders"

[[topic.rule]]
id = "explore-engagement"
tags = ["code"]
text = '''An engagement interrupts it as it does any order ([combat](combat.toml#engagement)): the move stops, the regiment fights by the usual rules for its formation's aggressiveness, then goes back to exploring, heading on for the destination it had (choosing a new one only if it now stands within `ExploreInertiaCloseEnough` of it, as on any look). Meeting an enemy doesn't end it.'''

[[topic.rule]]
id = "explore-counts-as-moving"
tags = ["code", "data"]
text = '''Its activity is Exploring, so for stances ([stances](stances.toml)) it is neither resting nor guarding, and its moves end entrenchment like any of its own. For supply it allows resupply ([supply](supply.toml#what-supply-gives)); it doesn't regain morale (`mind_exploring` has `morale_replenish = false`).'''

[[topic.rule]]
id = "explore-never-ends"
tags = ["code"]
text = '''It never ends by itself, at any distance or once nothing is left to uncover.'''

[[topic]]
title = "What the player sees"
under = "Explore orders"

[[topic.rule]]
id = "exploring-state-line"
tags = ["code", "data"]
text = '''The regiment's state line reads "Exploring" (`mind_exploring`) for the whole order, while it walks and while it stands with nowhere to go.'''

[[topic.rule]]
id = "explore-marker"
tags = ["code", "data"]
text = '''The order's marker is `waypoint_explore_actor`, shown at the clicked point while the regiment is selected, as for any order ([commands](commands.toml#order-markers)).'''

[[topic.rule]]
id = "explore-reply"
tags = ["code"]
text = '''Giving it plays the selection's `WhenCommanded` reply, as any order on a place does ([sounds](sounds.toml#unit-replies)). Nothing is posted to the message log, and the regiment says nothing as it picks new destinations.'''

[[topic.rule]]
id = "explore-cursor"
tags = ["data"]
text = '''The armed cursor is `explore` (`cursor_ids`).'''

[[topic]]
title = "Trailers"

[[topic.rule]]
id = "trailer-hitch"
tags = ["code", "data"]
text = '''A truck with a `trailer_actor` tows it by the truck's `TrailerHitch` `node_offset` (x to the truck's right, y ahead, so stock trucks' 0, -0.7 to 0, -2.2 are behind the cab). The trailer has a `TrailerHitch` offset of its own (stock 0, 0.5 to 0, 1.6, mostly 1.4 or 1.5: ahead of its centre). Each offset also has a height, so the trailer's facing tilts with the ground between the two.'''

[[topic.rule]]
id = "trailer-follows-hitch"
tags = ["code"]
text = '''Whenever the truck moves, the trailer turns to face from where it was toward the truck's hitch point, then is placed so that its own hitch point lies on the truck's. A trailer's own trailer follows it the same way.'''

[[topic.rule]]
id = "trailer-never-blocks"
tags = ["code"]
text = '''The trailer is only ever dragged. It never limits or blocks the truck's turning or movement, and it is no obstacle to unpacking (see [objects](objects.toml#room-to-stand)).'''

[[topic.rule]]
id = "trailer-after-snap"
tags = ["code", "guess"]
text = '''When the truck faces a new way at once (a snap, above), its hitch point jumps and the trailer is left pointing across or through the truck until driving straightens it: the tangled look. It changes nothing in play.'''

