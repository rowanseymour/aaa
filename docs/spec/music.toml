subject = "Music"
summary = '''What music plays where (menus, matches, the editor), how a music entry works through its files, and how music fades, switches and sits with the rest of the game's sound. Music entries are the `AudioMusic` entries in `Audio/music.tgi` and `Audio/music_aa.tgi`; how any audio entry picks a file is in [sounds](sounds.toml), Picking a sound's file.'''
games = '''traced in AA. Kohan II runs the same code, but its data hasn't been checked against these rules.'''

[[topic]]
title = "One music at a time"

[[topic.rule]]
id = "one-music-entry"
tags = ["code", "data"]
text = '''At most one music entry plays at a time, heard by the local player only (`who_flags = LOCAL`), and it's never paused when the game is.'''

[[topic.rule]]
id = "same-music-continues"
tags = ["code"]
text = '''Asking for the music that's already playing does nothing: it carries on where it is, with no restart and no fade.'''

[[topic.rule]]
id = "music-replacement"
tags = ["code"]
text = '''Asking for different music replaces what's playing: the old music fades out over its own fade-out time while the new one starts at once and fades in over its own fade-in, so the two overlap (see Fades).'''

[[topic.rule]]
id = "streaming-channels"
tags = ["code", "data"]
text = '''Music and speech share three streams (`MilesStreamingChannels = 3`). If all three are busy when new music starts (say two speeches and the old music), the old music stops dead instead of fading, and the new one takes its place, still fading in.'''

[[topic.rule]]
id = "latest-request-wins"
tags = ["code"]
text = '''Asked for again and again before any of it has started, only the latest music plays.'''

[[topic.rule]]
id = "music-silent"
tags = ["code", "data"]
text = '''`stop_music` and screens that ask for silence play `music_silent` (AVar `AudioMusicSilent`): an entry at 0% with no files. It replaces the current music like any other, so that fades out, and then nothing plays.'''

[[topic]]
title = "How an entry plays"
intro = '''All stock music has `control_flags = ALL, INTERRUPT` from the `AudioMusic` template, `simultaneous_limit = 1`, and no `fallout`.'''

[[topic.rule]]
id = "music-loops"
tags = ["code", "data"]
text = '''Music loops for as long as it's left playing: first one file from `leadin`, if the entry has one, then a file from `files`, then another, and so on until something replaces or stops it. `fallout` never plays for music, since the files never run out.'''

[[topic.rule]]
id = "leadin-once"
tags = ["code", "data"]
text = '''The `leadin` plays once each time the music starts, not on each pass: `main_title_music` opens with `MainTheme.mp3` and then goes on to its files.'''

[[topic.rule]]
id = "random-file-picks"
tags = ["code", "data"]
text = '''
Each file after the lead-in is a fresh random pick from `files`, every entry in the list equally likely and each pick independent of the ones before. There's no shuffle and no memory: a file listed twice comes up twice as often as one listed once, and the same file can play twice or more running.
- `main_title_music`: after the lead-in, `MainTheme`, `MenuAmbient01` and `MenuAmbient02` a third each, so the theme can play twice in a row straight after its own lead-in.
- The nation playlists (`usa_ambient` and the rest) list 20 files: their nation's three tracks twice each and the side's four cinematic tracks twice each (10% a pick each), and the six `GeneralAmbient` tracks once each (5% each).
'''

[[topic.rule]]
id = "pick-random-stream"
tags = ["code"]
text = '''The picks come from the same local, clock-seeded random stream as other sounds' picks ([sounds](sounds.toml)), so the order differs between runs and between players.'''

[[topic.rule]]
id = "no-gap-between-files"
tags = ["code"]
text = '''The next file starts as soon as the last one ends, with no gap and no fade between them.'''

[[topic.rule]]
id = "missing-file-silence"
tags = ["code", "game", "data"]
text = '''
A file the archive doesn't have is swapped, when the data loads, for `Audio/Default/StreamDefault.wav`, half a second of silence. The slot stays in the list and its picks play that: a half-second pause, then the next pick.
- `ger_ambient` and `jpn_ambient` name both `CinematicAxisMoscowFall.mp3` and `CinematicAxisLondonFall.mp3`, neither of which is in the archive (the game's log reports both missing), so 4 of their 20 slots, a fifth of the picks, give the half-second pause.
'''

[[topic.rule]]
id = "empty-files-list"
tags = ["code"]
text = '''An entry whose `files` list is empty (`music_silent`) plays its lead-in, if any, and ends.'''

[[topic]]
title = "Fades"
intro = '''`fade_time_s = in, out`, in seconds.'''

[[topic.rule]]
id = "fade-in"
tags = ["code"]
text = '''Fade-in: when the music starts, its level rises in a straight line from silent to full over `in` seconds. It happens once per start, never at the start of each file.'''

[[topic.rule]]
id = "fade-out"
tags = ["code"]
text = '''Fade-out: only when the music is replaced or stopped. Its level falls in a straight line to silence over `out` seconds, then it stops. Files ending and the next starting never fade.'''

[[topic.rule]]
id = "zero-fade"
tags = ["code"]
text = '''With 0 for either, that fade is skipped (full at once, or cut at once).'''

[[topic.rule]]
id = "stop-during-fade-in"
tags = ["code"]
text = '''Music stopped while still fading in fades out on a clock that started when it did: its level jumps to 1 − (seconds since it started ÷ `out`) and falls from there, or it stops at once if that's already 0 or less.'''

[[topic.rule]]
id = "stock-fade-times"
tags = ["data"]
text = '''Stock values: 4 s in, 2 s out for the menu, win and loss music; 3 s in, 1 s out for the nation and cutscene music. So switching from the main menu into a match gives 2 s of the menu music falling while the nation music rises over 3 s.'''

[[topic]]
title = "Loudness"

[[topic.rule]]
id = "music-volume"
tags = ["code", "data"]
text = '''A music file plays at Main volume × Music volume × the entry's `volume` × the fade level × the duck level (below). Main and Music are the options sliders (`AudioMainVolume`, stock 80%, and `AudioMusicVolume`, stock 70%).'''

[[topic.rule]]
id = "main-title-volume"
tags = ["code", "data", "guess"]
text = '''`volume = 133%` on `main_title_music` makes it a third louder than the rest (all at 100% from the `AAMusic` template): 80% × 70% × 133% ≈ 74% at the stock settings. Whether a product over 100% (sliders near the top) is held at full or distorts isn't known.'''

[[topic.rule]]
id = "causefade-ducking"
tags = ["code", "data"]
text = '''Ducking: while a sound flagged `CAUSEFADE` plays, every other kind of sound fades towards `AudioFadeVolume` (50%) of its level, in a straight line over `AudioFadeTime` (1 s). For speech that's music, interface sounds and world sounds; music ducking is the same whichever kind causes it. Every speech entry built on the `AudioSpeech` or `AudioCutscene` template has the flag.'''

[[topic.rule]]
id = "ducking-recovery"
tags = ["code", "data"]
text = '''Ducking lifts once no `CAUSEFADE` sound has played for `AudioRecoverFromFadeTime` (2 s): everything then rises back to full over `AudioFadeTime` (1 s). A new one during the wait cancels it, and the wait starts again when that one ends.'''

[[topic]]
title = "Menus and other screens"

[[topic.rule]]
id = "interface-music"
tags = ["code", "data"]
text = '''Each screen may name music in `interface_music`. When a screen is shown it asks for that music; a screen with none (`NULL`, the default) leaves whatever is playing alone. Screens built on `SilentInterface` ask for `music_silent`.'''

[[topic.rule]]
id = "menu-music"
tags = ["code", "data"]
text = '''Only the main menu and the dynamic campaign screen name music, both `main_title_music`. Going between them, or through any screen that names none (lobby, campaign choice, options, loading, debriefing, scoring), the music carries on without a break, since asking for the playing music does nothing.'''

[[topic.rule]]
id = "scenario-editor-silence"
tags = ["code", "data"]
text = '''The scenario editor is a `SilentInterface`: entering it fades the music out over its fade-out and leaves silence.'''

[[topic.rule]]
id = "unused-menu-music"
tags = ["code", "data"]
text = '''`menu_background_music` is used only as the observers' match music (below). `win_interface_music` and `loss_interface_music` aren't used by the stock data: the debriefing screen's `victory_music` and `defeat_music` are both `null`, so after a match the match music plays on through the debriefing and scoring until the main menu replaces it.'''

[[topic.rule]]
id = "debriefing-music"
tags = ["guess"]
text = '''Given entries, the debriefing would play the victory one when the local player won and the defeat one otherwise.'''

[[topic]]
title = "In a match"

[[topic.rule]]
id = "match-music-start"
tags = ["code", "data"]
text = '''The match music starts on the match's first game tick, once loading is over; until then the menu music keeps playing through the loading screen. The game interface names no music, so nothing else changes it.'''

[[topic.rule]]
id = "game-music"
tags = ["code", "data"]
text = '''It's the `game_music` of the local player's nation (`usa_ambient` for the USA, and so on), whatever the other players' nations.'''

[[topic.rule]]
id = "observer-game-music"
tags = ["code", "data"]
text = '''With no local player (an observer), it's the music named by AVar `ObserverGameMusic`, stock `menu_background_music`. A local player whose nation has no `game_music` (`null`) gets no new music: whatever was playing carries on.'''

[[topic.rule]]
id = "trigger-music"
tags = ["code", "data"]
text = '''Map triggers can change it: `play_music` plays the named entry (as music, replacing the current one), `play_game_music` plays the match music by the rule above, and `stop_music` plays `music_silent`. Victory, defeat and speech don't change the music; speech only ducks it.'''

