<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Three lines, each behind a dot, as the log's lines are behind their icons. -->
  <g fill="#fff">
    <circle cx="9.6" cy="14.4" r="5.12"/>
    <circle cx="9.6" cy="32" r="5.12"/>
    <circle cx="9.6" cy="49.6" r="5.12"/>
  </g>
  <g stroke="#fff" stroke-width="6.4" stroke-linecap="round">
    <line x1="20.8" y1="14.4" x2="59.2" y2="14.4"/>
    <line x1="20.8" y1="32" x2="59.2" y2="32"/>
    <line x1="20.8" y1="49.6" x2="59.2" y2="49.6"/>
  </g>
</svg>
