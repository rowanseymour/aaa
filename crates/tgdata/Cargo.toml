[package]
name = "tgdata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The data of games on TimeGate's engine, such as Axis & Allies (2004) and Kohan II: archive access and definitions built from their files"
publish = false

[dependencies]
log = "0.4"
tgck = { path = "../tgck" }
serde = { version = "1", features = ["derive"] }
smart-default = "0.7"
tgi = { path = "../tgi", features = ["serde"] }
