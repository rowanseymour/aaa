[package]
name = "tgeditor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Map editor for games on TimeGate's engine, such as Axis & Allies (2004) and Kohan II, which views maps"
publish = false

[dependencies]
tgdata = { path = "../tgdata" }
tgmap = { path = "../tgmap" }
tgrender = { path = "../tgrender" }
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "tga", "dds"] }
bevy_egui = { version = "0.43", default-features = false, features = ["default_fonts", "render", "bevy_ui", "picking"] }
