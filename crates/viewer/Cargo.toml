[package]
name = "aaa-viewer"
version.workspace = true
edition.workspace = true
# Bevy 0.20 needs a newer compiler than the libraries do.
rust-version = "1.97.1"
license.workspace = true
description = "3D viewer for Axis & Allies (2004) maps"
publish = false

[dependencies]
nif = { path = "../nif" }
tgck = { path = "../tgck" }
tgi = { path = "../tgi" }
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "tga", "dds"] }
