[package]
name = "aaa-game"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plays Axis & Allies (2004) matches"
publish = false

[dependencies]
aaa-data = { path = "../data" }
aaa-map = { path = "../map" }
aaa-render = { path = "../render" }
aaa-sim = { path = "../sim" }
aaa-server = { path = "../server" }
tgck = { path = "../tgck" }
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "tga", "dds", "bevy_audio", "wav", "mp3", "custom_cursor"] }
raw-window-handle = "0.6"
