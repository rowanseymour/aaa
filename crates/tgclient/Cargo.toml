[package]
name = "tgclient"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plays the matches of games on TimeGate's engine, such as Axis & Allies (2004) and Kohan II, for each game's own program to run"
publish = false

[dependencies]
tgdata = { path = "../tgdata" }
tgmap = { path = "../tgmap" }
tgrender = { path = "../tgrender" }
tgserver = { path = "../tgserver" }
tgsim = { path = "../tgsim" }
tgck = { path = "../tgck" }
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "tga", "dds", "bevy_audio", "wav", "mp3", "custom_cursor"] }
raw-window-handle = "0.6"
