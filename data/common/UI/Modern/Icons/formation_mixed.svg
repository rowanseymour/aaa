<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mixed formations: a dashed light diamond round a line of dimmed dots, so it reads as a formation but none in particular. -->
  <polygon fill="none" stroke="#1c1a10" stroke-width="4.5" stroke-linejoin="round" points="32,3 61,32 32,61 3,32"/>
  <polygon fill="none" stroke="#ecebe2" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" points="32,3 61,32 32,61 3,32"/>
  <g fill="#1c1a10">
    <circle cx="20" cy="32" r="6.8"/>
    <circle cx="32" cy="32" r="6.8"/>
    <circle cx="44" cy="32" r="6.8"/>
  </g>
  <g fill="#8a877c">
    <circle cx="20" cy="32" r="5.5"/>
    <circle cx="32" cy="32" r="5.5"/>
    <circle cx="44" cy="32" r="5.5"/>
  </g>
</svg>
