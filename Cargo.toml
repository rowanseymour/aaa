[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/rowanseymour/aaa"

# Keep debug builds of the editor usable: optimise dependencies (Bevy) fully
# and our own code a little.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# For CI's tests, which want fast builds rather than fast binaries. Custom
# profiles inherit dev's package overrides, so undo the Bevy one explicitly.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
