[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# Keep debug builds of the editor usable: optimise dependencies (Bevy) fully
# and our own code a little.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
